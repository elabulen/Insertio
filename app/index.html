  }
  function renderWho(){ $("gWho").textContent=(S.nom||"").trim()||"Premier entretien"; const c=IO.ctxOf(S), b=[]; if(c.age!=null) b.push(c.age+" ans"); if(S.date_ent) b.push("premier entretien du "+U.fmtDate(S.date_ent)); if(opts.statusText) b.push(opts.statusText()); $("gWhoSub").textContent=b.join(" · "); }

  /* ---------- rafraîchissement */
  function refresh(){
    const c=IO.ctxOf(S), ev=IO.evaluate(S);

    $("live").innerHTML='<span class="lbl">Proposition</span><span class="pill '+ev.main.code+'">'+esc(ev.main.label)+'</span>'+(S.decision?'<span class="lbl">Retenu</span><span class="pill num">'+esc(S.decision)+'</span>':'')+
      '<span class="lbl">Numérique</span><span class="pill num">'+(c.numLevel?esc(c.numLevel)+' · '+c.digital.n+'/8':'—')+'</span>'+(S.cv_has&&S.cv_has!=="non"?'<span class="lbl">CV</span><span class="pill num">'+c.cv.ok+'/'+c.cv.total+'</span>':'');

    const as=$("alertSituation"); if(as){ let x="";
      if(S.permis==="b_etu") x+='<div class="alert"><b>Permis B études.</b> Activité accessoire : 15 h par semaine au maximum pendant les cours, 40 h pendant les vacances, sur autorisation de l\'OCPM (formulaire E signé avec l\'employeur)'+(S.etu_origine==="hors"?". Hors UE/AELE : 6 mois après le début des études, lettre de l\'école et décision de l\'OCPM avant de commencer.":".")+' <a href="https://www.ge.ch/demander-permis-sejour-etudiant/activite-accessoire-etudiant" target="_blank" rel="noopener">Règles sur ge.ch</a></div>';
      else if(c.snf) x+='<div class="alert info"><b>Permis '+S.permis.toUpperCase()+'.</b> Public prioritaire de Tremplin.</div>';
      if(IO.isMinor(c)&&S.activite&&S.activite!=="formation") x+='<div class="alert crit"><b>FO18.</b> Mineur·e sans formation : la formation est obligatoire jusqu\'à 18 ans à Genève. Coordonner avec CAP Formations (DIP).</div>';
      as.innerHTML=x; }
    const ap=$("alertProjet"); if(ap) ap.innerHTML=c.studentOver?'<div class="alert"><b>Attention au taux.</b> '+esc(S.taux)+' % dépasse les 15 h hebdomadaires autorisées en période de cours avec un permis études (environ 36 % d\'un plein temps). À vérifier, surtout si le stage fait partie du cursus.</div>':"";
    const m=$("cvMeter"); if(m) m.innerHTML='<span>'+c.cv.ok+' conforme(s), '+c.cv.ko+' à retravailler</span><span class="track"><i style="width:'+Math.round(c.cv.ok/c.cv.total*100)+'%"></i></span><span>'+(c.cv.total-c.cv.ok-c.cv.ko)+' non vérifié(s)</span>';
    const sw=IO.strengthsWarnings(S,c), li=a=>a.map(x=>'<li>'+esc(x)+'</li>').join("");
    $("goodList").innerHTML=sw.goods.length?li(sw.goods):'<span class="empty">Rien pour l\'instant</span>';
    $("warnList").innerHTML=sw.warns.length?li(sw.warns):'<span class="empty">Rien pour l\'instant</span>';
    let body=""; if(ev.reasons.length) body+='<div><h4>Pourquoi</h4><ul>'+li(ev.reasons)+'</ul></div>'; if(ev.extras.length) body+='<div><h4>En complément</h4><ul>'+li(ev.extras)+'</ul></div>';
    if(c.cvSupport) body+='<div><h4>CV et lettre · '+esc(c.cvSupport.level)+'</h4><ul><li>'+esc(c.cvSupport.text)+'</li></ul></div>'; if(ev.vig.length) body+='<div class="vig"><h4>Points de vigilance</h4><ul>'+li(ev.vig)+'</ul></div>';
    $("propCard").innerHTML='<div class="top"><span class="pill '+ev.main.code+'">'+esc(ev.main.label)+'</span><p>'+esc(ev.main.why)+'</p></div>'+(body?'<div class="body">'+body+'</div>':'');
    const rb=$("rulesBox"), open=rb.open;
    rb.innerHTML='<summary>Comment la proposition est calculée ('+ev.fired.length+' règle'+(ev.fired.length>1?'s':'')+')</summary><div class="rulewrap"><table>'+(ev.fired.map(f=>'<tr><td>'+esc(f.id)+'</td><td>'+esc(f.t)+'</td></tr>').join("")||'<tr><td></td><td>Aucune règle pour l\'instant.</td></tr>')+'</table></div><p class="sub-n">Priorité : statut à vérifier, puis permis S, N, F (Tremplin), puis profil prêt (Passerelles), sinon Élan.</p>'; rb.open=open;
    const cl=$("checkList"); if(cl){ cl.innerHTML=""; IO.completeness(S,c).forEach(x=>{ const it=ITEMS[x.f]; const l=h("li",{class:x.ok?"ok":"ko"},'<span class="st">'+(x.ok?"✓":"!")+'</span><span class="t">'+esc(x.t)+'</span>');
      if(!x.ok){ const b=h("button",{type:"button"},"Compléter"); b.addEventListener("click",()=>goStep(it?it.step:x.step,{focus:x.f})); l.appendChild(b); } cl.appendChild(l); }); }
    renderMsg(); renderChrome(); renderWho();
  }
  function changed(id){
    if(["cv_has","cv_auteur","dipl","exp_level","permis","lm","projet","activite"].includes(id)) renderDocs();
    if(id==="format") renderClock();
    refresh(); opts.onChange&&opts.onChange(id);
  }

  /* ---------- événements */
  const notesBtn=$("notesBtn");
  function toggleNotes(f){ const open=f!==undefined?f:drawer.hidden; drawer.hidden=!open; notesBtn.setAttribute("aria-expanded",open?"true":"false"); if(open) $("f_quicknotes").focus(); }
  notesBtn.addEventListener("click",()=>toggleNotes());
  $("f_quicknotes").addEventListener("input",e=>{ S.quicknotes=e.target.value; opts.onChange&&opts.onChange("quicknotes"); });
  $("prevBtn").addEventListener("click",()=>goStep((S.step||0)-1));
  $("nextBtn").addEventListener("click",()=>{ if((S.step||0)>=STEPS.length-1){ opts.onDone&&opts.onDone(); return; } goStep((S.step||0)+1); });
  $("modeStep").addEventListener("click",()=>setMode("step")); $("modeAll").addEventListener("click",()=>setMode("all"));
  $("clockBtn").addEventListener("click",()=>{ if(!S.clock.start){ S.clock.start=U.now(); lastTick=Date.now(); U.toast("Chrono démarré"); } else { tick(); U.toast("Durée : "+Math.round((Date.now()-Date.parse(S.clock.start))/60000)+" min"); } renderClock(); opts.onChange&&opts.onChange("clock"); });
  const onKey=e=>{ if(e.key==="Escape"){ if(!youth.hidden) youth.hidden=true; else if(!drawer.hidden) toggleNotes(false); } };
  const onVis=()=>{ if(document.visibilityState==="hidden") tick(); else lastTick=S.clock.start?Date.now():null; };
  document.addEventListener("keydown",onKey); document.addEventListener("visibilitychange",onVis);
  const iv=setInterval(()=>{ if(S.clock.start){ tick(); renderClock(); opts.onChange&&opts.onChange("clock"); } },15000);

  build(); refresh(); setMode(MODE);
  return { destroy(){ tick(); clearInterval(iv); document.removeEventListener("keydown",onKey); document.removeEventListener("visibilitychange",onVis); root.classList.remove("grille","mode-step","mode-all"); },
           refreshWho:renderWho };
}
})();

<script>

(function(){

  {nom:"Ela Öztürk",fonction:"Coordinatrice des programmes d'insertion",mail:"e.ozturk@insertio.ch"},

];

  retardMsg(j, r){ const p=U.firstName(j.nom), me=(this.me&&this.me.nom)||IO.App.settings.accomp||"L'équipe Insertio", tel=this.data.tel||"";

  async save(){

  async login(m){ this.me=m; try{ sessionStorage.setItem("insertio_me",m.id); }catch(e){} this.apply(); },

  /* ---------- Signature et messages */

  outlookCal(j, r){
    if(!r||!r.date) return "";
    const pad=n=>String(n).padStart(2,"0"), hm=(r.heure||"09:00").slice(0,5);
    const st=new Date(r.date+"T"+hm+":00"), dur=/premier/i.test(r.objet||"")?90:60, en=new Date(st.getTime()+dur*60000);
    const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00";
    const host=this.data.outlook==="office"?"https://outlook.office.com":"https://outlook.live.com";
    const who=(this.me&&this.me.nom)||IO.App.settings.accomp||"";
    const body=["Rendez-vous Insertio avec "+(j.nom||"le jeune")+(j.programme?" (programme "+j.programme+")":"")+".", who?"Accompagnant·e : "+who+".":"", "", "Si tu as un empêchement, préviens-nous en répondant à ce message."].filter((x,i)=>x||i===2).join("\n");
    const q=new URLSearchParams({path:"/calendar/action/compose",rru:"addevent",subject:"Insertio – "+(r.objet||"Rendez-vous")+" – "+(j.nom||""),startdt:iso(st),enddt:iso(en),location:r.lieu||this.data.lieu||"",body});
    if(j.mail) q.set("to",j.mail);
    return host+"/calendar/0/deeplink/compose?"+q.toString().replace(/\+/g,"%20");
  },
  outlookBtn(j, getR, label){
    const a=h("a",{class:"btn",target:"_blank",rel:"noopener",href:"#"},label||"Ajouter au calendrier Outlook");
    a.addEventListener("click",e=>{ const r=getR(); const u=r&&r.date?this.outlookCal(j,r):""; if(!u){ e.preventDefault(); U.toast("Indique d'abord la date du rendez-vous"); return; } a.href=u; });
    return a;
  },
  insertCal(body,link){ if(!link) return body; const line="Pour choisir ton prochain rendez-vous, réserve le créneau qui te convient ici :\n"+link; const k=["\n\nSi tu as une question","\n\nÀ bientôt"].find(x=>body.includes(x)); return k?body.replace(k,"\n\n"+line+k):body+"\n\n"+line; },
  calMsg(j){ const L=["Bonjour"+(U.firstName(j.nom)?" "+U.firstName(j.nom):"")+",","","Pour fixer ton prochain rendez-vous chez Insertio, choisis le créneau qui te convient ici :",this.calLink(j.nom,j.mail),"","Tu recevras une confirmation par e-mail. Si aucun créneau ne te va, réponds simplement à ce message.","","À bientôt,",(IO.App.settings.accomp||"L'équipe")+" – Insertio"];
    return {subject:"Insertio – choisis ton prochain rendez-vous", body:L.join("\n")}; },
  reminder(j,r){ const when=U.daysFrom(r.date)===1?"demain":U.dateLong(r.date);
    const L=["Bonjour"+(U.firstName(j.nom)?" "+U.firstName(j.nom):"")+",","","Petit rappel : on se voit "+when+(r.heure?" à "+U.fmtTime(r.heure):"")+(r.lieu?", "+r.lieu:"")+(r.objet?" ("+r.objet.toLowerCase()+")":"")+".","","Si tu as un empêchement, préviens-nous en répondant à ce message.","","À bientôt,",(IO.App.settings.accomp||"L'équipe")+" – Insertio"];
    return {subject:"Insertio – rappel de ton rendez-vous "+(when==="demain"?"de demain":"du "+U.fmtDate(r.date)), body:L.join("\n")}; },
  mailLink(to,m){ return U.mailto(to,m.subject,this.withSig(m.body)); },
  /* Ouvre le mail dans Outlook avec le message mis en forme (signature + logo) dans le presse-papiers.
     Un lien mailto ne transporte que du texte : le corps est donc collé (Ctrl+V) dans Outlook. */
  richMail(a, to, getM){
    a.addEventListener("click", e=>{ e.preventDefault(); const m=getM(); if(this.canSend()) this.compose(typeof to==="function"?to():to, m); else this.openOutlook(typeof to==="function"?to():to, m); });
    return a;
  },
  async openOutlook(to, m){
    {
      const text=this.withSig(m.body), html=this.html(m.body);
      if(!this.data.signature){ const url=U.mailto(to,m.subject,text);
        if(url.length<=1800){ location.href=url; return; }
        /* Lien trop long pour Windows (le mail s'ouvrirait vide, sans objet) : le texte passe par le presse-papiers. */
        try{ await navigator.clipboard.writeText(text); }catch(err){}
        location.href=U.mailto(to,m.subject,""); U.toast("Outlook s'ouvre avec l'objet. Le message est long : clique dans le mail et fais Ctrl+V pour le coller.",9000); return; }
      let ok=false;
      try{ await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]); ok=true; }catch(err){}
      location.href = ok ? U.mailto(to,m.subject,"") : U.mailto(to,m.subject,text);
      if(ok) U.toast("Outlook s'ouvre : clique dans le message et fais Ctrl+V pour coller le texte avec la signature et le logo.",9000);
    }
  },

  /* ---------- Boîte « message au jeune » */
  messageBox(box, m, mail, nom, rdv){
    let withCal=false;
    const draw=()=>{
      box.innerHTML="";
      const body=withCal?this.insertCal(m.body,this.calLink(nom,mail)):m.body, full=this.withSig(body);
      box.appendChild(h("div",{class:"msg-sub"},'<span class="flab">Objet</span><span>'+esc(m.subject)+'</span>'));
      const pre=h("pre",{class:"msg"}); pre.textContent=full; box.appendChild(pre);
      if(this.calBase()){ const c=h("label",{class:"chk plain",style:"margin-top:8px"},'<input type="checkbox"'+(withCal?" checked":"")+'><span>Ajouter le lien Calendly pour que le jeune choisisse son prochain rendez-vous</span>'); c.querySelector("input").addEventListener("change",e=>{ withCal=e.target.checked; draw(); }); box.appendChild(c); }
      const r=h("div",{class:"btn-row"});
      const o=this.richMail(h("a",{class:"btn primary",href:U.mailto(mail,m.subject,full)},(this.canSend()?"Envoyer le mail":"Ouvrir dans Outlook")),mail,()=>({subject:m.subject,body}));
      const c=h("button",{type:"button",class:"btn"},"Copier avec le logo"); c.addEventListener("click",()=>this.copyRich(full,this.html(body)));
            r.append(o); if(rdv&&rdv.get){ r.appendChild(this.outlookBtn(rdv.j,rdv.get,"Ajouter le RDV au calendrier Outlook")); } if(this.data.signature) r.append(c); box.appendChild(r);
      box.appendChild(h("p",{class:"sub-n"},(mail?"":"Ajoute l'e-mail du jeune dans son profil pour que le destinataire soit rempli. ")+"« Ouvrir dans Outlook » crée le mail (destinataire et objet) et garde le message avec ta signature et le logo prêt à coller : clique dans le corps du mail et fais Ctrl+V. Vérifie le champ « De » : ton adresse @insertio.ch."+(rdv&&rdv.get?" Le bouton calendrier ouvre Outlook avec le rendez-vous rempli et le jeune invité : clique sur Enregistrer, Outlook lui envoie l'invitation.":"")));
    };
    draw();
  },
  calButtons(j){
    if(!this.calBase()) return [];
    const a=this.richMail(h("a",{class:"btn",href:this.mailLink(j.mail,this.calMsg(j))},"Envoyer le lien Calendly"),j.mail,()=>this.calMsg(j));
    const b=h("a",{class:"btn",href:this.calLink(j.nom,j.mail),target:"_blank",rel:"noopener"},"Réserver sur Calendly");
    return [a,b];
  },

  /* ---------- Accueil : rappels de la veille */
  homeCards(js,card,list){
    const today=U.today(), d=new Date(); const dow=d.getDay(); const span=dow===5?3:dow===6?2:1;
    const items=[]; js.filter(j=>j.statut!=="clos").forEach(j=>IO.live(j.rdv).forEach(r=>{ const n=U.daysFrom(r.date); if(r.statut==="prevu"&&r.date>today&&n>=1&&n<=span&&!r.rappel) items.push({j,r}); }));
    if(!items.length) return;
    items.sort((a,b)=>(a.r.date+(a.r.heure||"")).localeCompare(b.r.date+(b.r.heure||"")));
    card("Rappels à envoyer",items.length,list(items,x=>{ const li=h("li",{class:"row"});
      li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom||"Sans nom")+'</b><span class="faint">'+esc(IO.App.rdvWhen(x.r))+(x.j.mail?"":' · <span class="warn-t">pas d\'e-mail</span>')+'</span></div>';
      const ra=h("div",{class:"racts"}); const a=this.richMail(h("a",{class:"btn primary",href:this.mailLink(x.j.mail,this.reminder(x.j,x.r))},"Envoyer le rappel"),x.j.mail,()=>this.reminder(x.j,x.r));
      a.addEventListener("click",()=>{ x.r.rappel=U.now(); IO.touch(x.r); IO.App.save(x.j); setTimeout(()=>{ li.classList.add("done"); a.textContent="Rappel ouvert dans Outlook"; },300); });
      ra.append(a,h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier")); li.appendChild(ra); return li; },""));
  },

  /* ---------- Écran « Qui es-tu ? » */
  loginView(main){
    const box=h("div",{class:"login"});
    box.innerHTML='<img src="'+esc(this.logoUrl)+'" alt="InsertiO"><h1>Qui utilise l\'application ?</h1><p class="sub-n">Ton nom signe les messages et les comptes rendus. Tu vois tous les jeunes de l\'équipe.</p>';
    const list=h("div",{class:"who-list"}); box.appendChild(list);
    this.data.membres.forEach(m=>{ const b=h("button",{type:"button",class:"btn who"},'<b>'+esc(m.nom)+'</b><span class="faint">'+esc(m.fonction||m.mail||"")+'</span>');
      b.addEventListener("click",()=>{ if(!m.pin){ this.login(m).then(()=>IO.App.route()); return; } pinForm(m); }); list.appendChild(b); });
    const pinBox=h("form",{class:"pinbox",hidden:true}); box.appendChild(pinBox);
    const pinForm=m=>{ pinBox.hidden=false; pinBox.innerHTML='<label class="flab" for="pinIn">Code de '+esc(U.firstName(m.nom))+'</label><input class="f" id="pinIn" type="password" inputmode="numeric" autocomplete="off"><div class="btn-row"><button class="btn primary" type="submit">Entrer</button></div><p class="sub-n" id="pinErr"></p>';
      const i=pinBox.querySelector("#pinIn"); i.focus();
      pinBox.onsubmit=async e=>{ e.preventDefault(); if(await hash(m.id,i.value)===m.pin){ await this.login(m); IO.App.route(); } else { pinBox.querySelector("#pinErr").textContent="Code incorrect."; i.select(); } }; };
    box.appendChild(h("p",{class:"sub-n"},'<a href="#/reglages">Réglages de l\'équipe</a>'));
    main.appendChild(box);
  },

  /* ---------- Réglages */
  settingsSections(main){
    const save=U.debounce(()=>this.save(),700);
    // Mon profil
    const me=h("section",{class:"dcard"}); me.appendChild(h("h2",null,"Mon profil sur cet ordinateur"));
    if(this.me){ me.appendChild(h("p",null,'Connectée : <b>'+esc(this.me.nom)+'</b>'+(this.me.fonction?' · '+esc(this.me.fonction):''))); const b=h("button",{type:"button",class:"btn"},"Changer de profil"); b.addEventListener("click",async()=>{ await this.logout(); IO.App.go("#/"); }); me.appendChild(h("div",{class:"btn-row"})).appendChild(b); }
    else if(this.data.membres.length){ me.appendChild(h("p",{class:"sub-n"},"Aucun profil choisi sur cet ordinateur.")); const b=h("button",{type:"button",class:"btn primary"},"Choisir mon profil"); b.addEventListener("click",()=>IO.App.go("#/")); me.appendChild(h("div",{class:"btn-row"})).appendChild(b); }
    else me.appendChild(h("p",{class:"sub-n"},"Crée d'abord les profils de l'équipe ci-dessous."));
    if(this.me){
      me.appendChild(h("div",{class:"sub-h"},"Ma signature Outlook avec le logo"));
      const pv=h("div",{class:"sigprev"}); pv.innerHTML=this.sigHtml(); me.appendChild(pv);
      const cb=h("button",{type:"button",class:"btn primary"},"Copier ma signature"); cb.addEventListener("click",()=>this.copySig());
      me.appendChild(h("div",{class:"btn-row"})).appendChild(cb);
      me.appendChild(h("p",{class:"sub-n"},"À faire une seule fois : dans Outlook, Paramètres → Comptes → Signatures (ou Fichier → Options → Courrier → Signatures), crée une signature « Insertio », colle (Ctrl+V), enregistre et choisis-la pour les nouveaux messages. Puis décoche plus bas « Ajouter ma signature » : l'application ouvrira les mails avec le texte déjà rempli, et Outlook ajoutera ta signature avec le logo."));
    }
    main.appendChild(me);

    // Équipe
    const eq=h("section",{class:"dcard"}); eq.appendChild(h("h2",null,"Équipe et signatures"));
    eq.appendChild(h("p",{class:"sub-n"},IO.Store.mode==="folder"?"Enregistré dans le dossier partagé (Reglages / equipe.json) : les mêmes profils sur tous les ordinateurs.":"Enregistré sur cet ordinateur. Choisis le dossier partagé plus bas pour que l'équipe ait les mêmes profils partout."));
    const wrap=h("div",{class:"members"}); eq.appendChild(wrap);
    const render=()=>{ wrap.innerHTML="";
      if(!this.data.membres.length){ const b=h("button",{type:"button",class:"btn primary"},"Créer les profils d'Ela, Tulin et Jannah"); b.addEventListener("click",async()=>{ this.data.membres=EQUIPE.map(x=>Object.assign({id:U.uid("m"),tel:"",calendly:"",pin:""},x)); await this.save(); render(); }); wrap.appendChild(b); }
      this.data.membres.forEach((m,i)=>{ const c=h("div",{class:"member"}); const g=h("div",{class:"row2"});
        [["nom","Prénom et nom"],["fonction","Fonction (dans la signature)"],["mail","E-mail @insertio.ch"],["tel","Téléphone (sinon celui du bureau)"],["calendly","Lien Calendly personnel (facultatif)"]].forEach(([k,l])=>{ const d=h("div"); const id="m_"+i+"_"+k; d.appendChild(h("label",{class:"flab",for:id},l)); const inp=h("input",{class:"f",id,type:k==="mail"?"email":"text"}); inp.value=m[k]||""; inp.addEventListener("input",()=>{ m[k]=inp.value; save(); }); d.appendChild(inp); g.appendChild(d); });
        c.appendChild(g);
        const r=h("div",{class:"btn-row"});
        const pin=h("input",{class:"f",type:"password",inputmode:"numeric",placeholder:m.pin?"Nouveau code":"Code (facultatif)","aria-label":"Code d'accès",style:"max-width:180px"});
        const pb=h("button",{type:"button",class:"btn"},m.pin?"Changer le code":"Définir un code"); pb.addEventListener("click",async()=>{ if(!pin.value.trim()){ pin.focus(); return; } m.pin=await hash(m.id,pin.value.trim()); pin.value=""; await this.save(); U.toast("Code enregistré"); render(); });
        r.append(pin,pb);
        if(m.pin){ const rm=h("button",{type:"button",class:"btn"},"Retirer le code"); rm.addEventListener("click",async()=>{ m.pin=""; await this.save(); render(); }); r.appendChild(rm); }
        const del=h("button",{type:"button",class:"btn danger"},"Supprimer"); del.addEventListener("click",()=>IO.UI.confirmInline(del,"Supprimer "+(m.nom||"ce profil"),async()=>{ this.data.membres.splice(i,1); await this.save(); render(); })); r.appendChild(del);
        c.appendChild(r); wrap.appendChild(c); });
      if(this.data.membres.length){ const a=h("button",{type:"button",class:"btn"},"Ajouter une personne"); a.addEventListener("click",async()=>{ this.data.membres.push({id:U.uid("m"),nom:"",fonction:"",mail:"",tel:"",calendly:"",pin:""}); await this.save(); render(); }); wrap.appendChild(h("div",{class:"btn-row"})).appendChild(a); }
    };
    render();
    eq.appendChild(h("p",{class:"sub-n"},"Le code n'est pas un mot de passe sécurisé : il évite seulement de signer au nom d'une collègue par erreur. La vraie protection, c'est la session Windows de chacune et le partage du dossier OneDrive."));
    main.appendChild(eq);

    // Association
    const as=h("section",{class:"dcard"}); as.appendChild(h("h2",null,"Association, messages et Calendly"));
    const g=h("div",{class:"row2"});
    [["lieu","Lieu de rendez-vous par défaut"],["adresse","Adresse (signature)"],["tel","Téléphone du bureau"],["mail","E-mail de contact"],["site","Site internet"],["calendly","Lien Calendly de l'association"]].forEach(([k,l])=>{ const d=h("div"); d.appendChild(h("label",{class:"flab",for:"a_"+k},l)); const i=h("input",{class:"f",id:"a_"+k}); i.value=this.data[k]||""; i.addEventListener("input",()=>{ this.data[k]=i.value; save(); }); d.appendChild(i); g.appendChild(d); });
    as.appendChild(g);
    const od=h("div",{style:"margin-top:12px"}); od.appendChild(h("label",{class:"flab",for:"a_outlook"},"Calendrier Outlook utilisé"));
    const os=h("select",{class:"f",id:"a_outlook"}); os.innerHTML='<option value="live">Outlook.com (compte Microsoft de contact@insertio.ch)</option><option value="office">Microsoft 365 (compte professionnel ou université)</option>'; os.value=this.data.outlook||"live"; os.addEventListener("change",()=>{ this.data.outlook=os.value; save(); }); od.appendChild(os); as.appendChild(od);
    const sg=h("label",{class:"chk",style:"margin-top:12px"},'<input type="checkbox"'+(this.data.signature?" checked":"")+'><span>Ajouter ma signature (nom, fonction, coordonnées, logo) aux messages<br><small class="faint">À décocher si une signature est déjà réglée dans Outlook, pour éviter les doublons.</small></span>');
    sg.querySelector("input").addEventListener("change",e=>{ this.data.signature=e.target.checked; save(); }); as.appendChild(sg);
    as.appendChild(h("p",{class:"sub-n"},"Calendly : le lien s'ouvre avec le nom et l'e-mail du jeune déjà remplis. Avec l'offre gratuite de Calendly, les rappels automatiques ne sont pas inclus : l'accueil affiche donc chaque jour les rappels à envoyer pour les rendez-vous du lendemain."));
    main.appendChild(as);

    // Envoi direct
    const ev=h("section",{class:"dcard"}); ev.appendChild(h("h2",null,"Envoi direct des mails"));
    ev.appendChild(h("p",{class:"sub-n"},this.canSend()?"Activé : les boutons « Mail au jeune », « Mail de retard », « Mail d'absence »… envoient directement le mail, sans ouvrir Outlook.":"Pas encore activé : les mails s'ouvrent dans Outlook. Colle ici l'adresse du service d'envoi et la clé (une seule fois, pour toute l'équipe)."));
    const eg=h("div",{class:"row2"}); const eu=h("input",{class:"f",type:"url",value:(this.envoi&&this.envoi.url)||"",placeholder:"https://script.google.com/macros/s/…/exec","aria-label":"Adresse du service d'envoi"}); const ek=h("input",{class:"f",type:"password",value:(this.envoi&&this.envoi.cle)||"",placeholder:"Clé d'envoi","aria-label":"Clé d'envoi",autocomplete:"off"});
    [["Adresse du service d'envoi",eu],["Clé d'envoi",ek]].forEach(([l,el])=>{ const d=h("div"); d.appendChild(h("label",{class:"flab"},l)); d.appendChild(el); eg.appendChild(d); }); ev.appendChild(eg);
    const er=h("div",{class:"btn-row"}); const es=h("button",{type:"button",class:"btn primary"},"Enregistrer et tester"); er.appendChild(es); ev.appendChild(er);
    es.addEventListener("click",async()=>{ this.envoi={url:eu.value.trim(),cle:ek.value.trim()}; es.disabled=true;
      try{ const r=await fetch(this.envoi.url,{method:"POST",body:JSON.stringify({cle:this.envoi.cle,test:true})}); const o=await r.json(); if(!o.ok) throw new Error(o.erreur||"refusé");
        await IO.Store.putShared("envoi.json",new Blob([JSON.stringify(this.envoi)],{type:"application/json"})); U.toast("Envoi direct activé pour toute l'équipe ✓",5000); IO.App.route(); }
      catch(e){ U.toast("Test raté : "+(e.message||e)+". Vérifie l'adresse et la clé.",8000); } es.disabled=false; });
    main.appendChild(ev);

    // Logo
    const lg=h("section",{class:"dcard"}); lg.appendChild(h("h2",null,"Logo"));
    const pv=h("div",{class:"logo-prev"}); const im=h("img",{src:this.logoUrl,alt:"Logo actuel"}); pv.appendChild(im);
    const lab=h("label",{class:"btn",for:"logoIn"},"Remplacer le logo"); const inp=h("input",{type:"file",id:"logoIn",accept:"image/png,image/jpeg,image/svg+xml",hidden:true});
    inp.addEventListener("change",async()=>{ const f=inp.files[0]; if(!f) return; try{ await IO.Store.putShared("logo.png",f); await this.loadLogo(); im.src=this.logoUrl; U.toast("Logo enregistré"); }catch(e){ U.toast("Logo non enregistré : "+(e.message||e),5000); } inp.value=""; });
    pv.append(lab,inp);
    if(this.logoCustom){ const rs=h("button",{type:"button",class:"btn"},"Revenir au logo InsertiO"); rs.addEventListener("click",async()=>{ await IO.Store.removeShared("logo.png"); await this.loadLogo(); im.src=this.logoUrl; }); pv.appendChild(rs); }
    lg.appendChild(pv); lg.appendChild(h("p",{class:"sub-n"},"Affiché en haut de l'application et dans la signature des messages."));
    main.appendChild(lg);
  },
};
document.addEventListener("click",e=>{ if(e.target&&e.target.id==="whoBtn"){ T.logout().then(()=>IO.App.go("#/")); } });
})();

</script>
<script>
/* InsertiO – application : navigation, accueil, dossiers des jeunes, suivis, documents, guide, réglages. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, $=U.$, Store=IO.Store;

/* ================================================================ État */
const App = IO.App = { settings:{accomp:"",lieu:"Locaux Insertio, rue Le-Royer 24, Les Acacias"}, jeunes:new Map(), view:null, status:"ok", installEvt:null };
const live = IO.live;

/* ================================================================ Composants partagés */
IO.UI = {
  messageBox(box, m, mail, nom, rdv){ IO.Team.messageBox(box, m, mail, nom, rdv); },
  confirmInline(btn, label, onYes){
    const wrap=h("span",{class:"confirm-inline"}); const y=h("button",{type:"button",class:"btn danger"},label||"Confirmer"); const n=h("button",{type:"button",class:"btn"},"Annuler");
    y.addEventListener("click",onYes); n.addEventListener("click",()=>wrap.replaceWith(btn)); wrap.append(y,n); btn.replaceWith(wrap); y.focus();
  },
};
function modal(html, onMount){
  const m=h("div",{class:"modal",role:"dialog","aria-modal":"true"}); const sh=h("div",{class:"sheet"},html); m.appendChild(sh); document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener("keydown",k); }; const k=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",k); m.addEventListener("click",e=>{ if(e.target===m) close(); });
  if(onMount) onMount(sh, close); return close;
}
function fileSize(n){ return n<1024?n+" o":n<1048576?Math.round(n/1024)+" ko":(n/1048576).toFixed(1)+" Mo"; }
function pill(code,label){ return '<span class="pill '+(code||"num")+'">'+esc(label)+'</span>'; }
function progPill(j){ const k=REF.decisionKey(j.programme); if(k) return pill(k,REF.PROGRAMMES[k].label); if(j.programme) return pill("num",j.programme); const e=IO.premier(j); if(e){ const ev=IO.evaluate(e.data); if(ev.main.code!=="attente") return pill(ev.main.code,ev.main.label+" ?"); } return '<span class="faint">—</span>'; }
function statutLabel(k){ return (REF.STATUTS.find(s=>s.k===k)||{}).t||k; }
function rdvWhen(r){ return U.dateShort(r.date)+(r.heure?" · "+U.fmtTime(r.heure):""); }

/* ================================================================ Enregistrement */
const timers=new Map();
function setSaveState(s, msg){ const el=$("saveState"); if(!el) return; el.dataset.state=s; el.textContent=msg||({saving:"Enregistrement…",ok:"Enregistré",err:"Non enregistré"})[s]; }
function save(j, now){
  j.updatedAt=U.now(); setSaveState("saving");
  clearTimeout(timers.get(j.id));
  const run=async()=>{ timers.delete(j.id);
    try{ const out=await Store.save(j); if(out!==j){ Object.keys(j).forEach(k=>{ if(!(k in out)) delete j[k]; }); Object.assign(j,out); }
      if(j._merged){ delete j._merged; U.toast("Dossier fusionné avec les modifications d'un·e collègue"); }
      App.jeunes.set(j.id,j); setSaveState("ok"); }
    catch(e){ console.error(e); setSaveState("err"); U.toast("Enregistrement impossible : "+(App.status!=="ok"?"reconnecte le dossier partagé (Réglages)":e.message||e),5000); } };
  if(now) return run(); timers.set(j.id,setTimeout(run,600));
}

function viewGuide(main){

  main.innerHTML='<div class="page-h"><h1>Guide du premier entretien</h1></div>'+
  '<p class="lead">Un déroulé commun à toute l\'équipe, en version 1 h et 1 h 30. On part toujours du CV : c\'est de là que viennent la plupart des informations. La grille propose, le jeune et l\'accompagnant·e décident.</p>'+
  '<h2 class="g2">Avant l\'entretien</h2><ul class="glist"><li>Réserver un espace calme et confidentiel.</li><li>Demander au jeune d\'apporter son CV et sa lettre de motivation (papier, clé USB ou e-mail).</li><li>Avoir le formulaire d\'autorisation d\'image à portée de main.</li><li>Créer le dossier du jeune (« Nouveau jeune ») et relire ce qu\'on sait déjà (orientation par un tiers, préinscription).</li></ul>'+
  '<h2 class="g2">Déroulé minuté</h2><div class="tablewrap"><table class="tbl"><thead><tr><th>Étape</th><th>1 h</th><th>1 h 30</th><th>Contenu</th></tr></thead><tbody>'+
  S.map((s,i)=>'<tr><td><b>'+(i+1)+'. '+esc(s.title)+'</b></td><td class="nw">'+s.budget[0]+' min</td><td class="nw">'+s.budget[1]+' min</td><td>'+esc(s.intent)+'</td></tr>').join("")+
  '</tbody></table></div><p class="sub-n">Les durées sont indicatives : elles s\'ajustent à l\'aisance du jeune, sans sacrifier l\'écoute. Le chrono de la grille aide à se situer.</p>'+
  '<h2 class="g2">Points d\'attention</h2><ul class="glist"><li><b>Image :</b> un refus est respecté sans relance. Pour un·e mineur·e, l\'autorisation est signée par le représentant légal.</li><li><b>Données :</b> informer le jeune de ce qu\'on note, pourquoi, qui y a accès, et de son droit de consulter ou faire corriger ses données. Ne noter que ce qui sert l\'accompagnement.</li><li><b>Mineur·e :</b> formation obligatoire jusqu\'à 18 ans à Genève (FO18). Sans formation : coordonner avec CAP Formations.</li><li><b>Permis B études :</b> 15 h par semaine au maximum pendant les cours, 40 h pendant les vacances, sur autorisation de l\'OCPM.</li><li><b>CV :</b> autonome → retravaille seul avec des pistes ; semi-autonome → Pôle numérique ou atelier ; non autonome → temps dédié en individuel.</li></ul>'+
  '<h2 class="g2">Après l\'entretien</h2><ul class="glist"><li>Dans la clôture : « Enregistrer la fiche dans le dossier ».</li><li>Envoyer au jeune le message (bouton « Ouvrir dans la messagerie » ou « Copier »).</li><li>Informer la ou le responsable du programme retenu.</li><li>Si une vidéo est prévue : transmettre l\'autorisation au pôle communication.</li></ul>'+
  '<h2 class="g2">Les séances (Élan, Tremplin) et le Pôle numérique</h2><ul class="glist"><li><b>Planification automatique :</b> en choisissant le programme, les séances se créent (Élan : 13, Tremplin : 16), une par semaine. Le nombre se modifie à tout moment avec − et +.</li><li><b>Coaching :</b> les séances 5 et 6 sont des séances de coaching avec la coach emploi (1. gestion du stress et sophrologie, 2. simulation d\'entretien) ; une 3e séance (coaching) peut être ajoutée dans l\'onglet Coaching du dossier.</li><li><b>Chaque séance :</b> date, présence, ce qui s\'est passé (ou bouton « Dicter »), ce qu\'on transmet à la personne suivante, des rappels. La séance suivante affiche tout en haut « À reprendre ».</li><li><b>Dictée :</b> commencer une phrase par « rappel » crée un rappel pour la prochaine séance.</li><li><b>Trois boutons :</b> Enregistrer (la fiche PDF se range dans le dossier du jeune), Mail au jeune (Outlook, objet rempli), Calendrier Outlook.</li><li><b>Fin de parcours :</b> « Terminer le parcours » avec la situation à la sortie, à tout moment : les statistiques comptent les séances réalisées.</li><li><b>Pôle numérique :</b> une fiche par passage (date, ce qui a été fait).</li></ul>'+
  '<h2 class="g2">Les entretiens de suivi détaillés (ancienne grille)</h2><p class="lead">Chaque suivi suit le même déroulé, sur plusieurs mois. Le dossier garde la mémoire : ce qu\'on s\'est dit la dernière fois, les actions prévues, les objectifs et leur évolution.</p>'+
  '<div class="tablewrap"><table class="tbl"><thead><tr><th>Étape</th><th>Durée</th><th>Contenu</th></tr></thead><tbody>'+
  '<tr><td><b>1. Accueil</b></td><td class="nw">5 min</td><td>Relire « la dernière fois ». Présence, comment ça va, ce qui s\'est passé depuis.</td></tr>'+
  '<tr><td><b>2. Retour sur les actions</b></td><td class="nw">10 min</td><td>Pour chaque action : fait, en cours ou pas fait, et pourquoi. Sans jugement : ce qui bloque est une information.</td></tr>'+
  '<tr><td><b>3. Objectifs</b></td><td class="nw">5 min</td><td>Situer chaque objectif avec le jeune, de « pas commencé » à « atteint ». L\'évolution se voit d\'un suivi à l\'autre.</td></tr>'+
  '<tr><td><b>4. Travail du jour</b></td><td class="nw">15 min</td><td>CV, candidatures, préparation d\'entretien, démarches… Mettre à jour les candidatures (statut, relance).</td></tr>'+
  '<tr><td><b>5. Documents</b></td><td class="nw">2 min</td><td>Cocher les documents reçus, les ajouter au dossier.</td></tr>'+
  '<tr><td><b>6. Prochaines étapes</b></td><td class="nw">5 min</td><td>Une à trois actions concrètes et datées, et le prochain rendez-vous.</td></tr>'+
  '<tr><td><b>7. Message</b></td><td class="nw">3 min</td><td>Résumé pour le jeune, puis envoyer le message et enregistrer le compte rendu.</td></tr>'+

  '<h2 class="g2">Principes</h2><div class="tablewrap"><table class="tbl"><tbody><tr><td><b>Bienveillance</b></td><td>Accueil sans jugement, respect du rythme et des réponses du jeune.</td></tr><tr><td><b>Engagement</b></td><td>Un cadre clair, une prochaine étape fixée avant de se quitter.</td></tr><tr><td><b>Innovation</b></td><td>L\'outil numérique soutient le dialogue, il ne le remplace pas.</td></tr><tr><td><b>Inclusion</b></td><td>Adapter le langage, le rythme et le support à chaque jeune.</td></tr></tbody></table></div>'+
  '<h2 class="g2">Installer l\'application</h2><ul class="glist"><li><b>Ordinateur (Chrome ou Edge) :</b> ouvrir insertio.ch/app, puis l\'icône « Installer » dans la barre d\'adresse.</li><li><b>iPad :</b> Safari → bouton Partager → « Sur l\'écran d\'accueil ».</li><li><b>Tablette Android :</b> Chrome → menu ⋮ → « Installer l\'application ».</li></ul>';

        ul.appendChild(h("li",null,"<strong>"+esc(o.nom||"Ordinateur")+(o.id===me?" (celui-ci)":"")+"</strong> — vu "+quand+" · "+(o.jeunes||0)+" jeune(s)")); });
    })();
    main.appendChild(pc);
  }

  const ex=h("section",{class:"dcard"}); ex.appendChild(h("h2",null,"Échanger avec un autre appareil"));
  ex.appendChild(h("p",{class:"sub-n"},"Exemple : entretiens faits sur tablette, puis importés au bureau dans le dossier partagé. L'import fusionne avec les dossiers existants sans rien écraser de plus récent."));
  const er=h("div",{class:"btn-row"});
  const eb=h("button",{type:"button",class:"btn"},"Exporter tous les dossiers (.zip)"); eb.addEventListener("click",async()=>{ await flushAll(); const {blob,count}=await Store.exportZip(null); if(!count){ U.toast("Aucun dossier à exporter"); return; } U.download("Insertio_export_"+U.today()+".zip",blob); });
  const ib=h("label",{class:"btn",for:"impZip"},"Importer un export (.zip)"); const ii=h("input",{type:"file",id:"impZip",accept:".zip,application/zip",hidden:true});
  ii.addEventListener("change",async()=>{ const f=ii.files[0]; if(!f) return; try{ const rep=await Store.importZip(f); await loadAll(); U.toast(rep.jeunes+" dossier(s) importé(s) dont "+rep.nouveaux+" nouveau(x), "+rep.fichiers+" fichier(s)",5000); }catch(e){ U.toast("Import impossible : "+(e.message||e),5000); } ii.value=""; });
  er.append(eb,ib,ii); ex.appendChild(er); main.appendChild(ex);

  const sa=h("section",{class:"dcard"}); sa.appendChild(h("h2",null,"Statistiques"));
  const sp=h("div"); sa.appendChild(sp); IO.Suivi.statsPanel(sp,sorted());
  sa.appendChild(h("p",{class:"sub-n"},"Export anonyme : une ligne par jeune, sans nom ni coordonnées : tranche d'âge, statut, programme proposé et retenu, suivis, rendez-vous honorés ou manqués, actions. Pour les rapports d'activité et les financeurs."));
  const sb=h("button",{type:"button",class:"btn"},"Télécharger (.csv pour Excel)"); sb.addEventListener("click",()=>U.download("Insertio_statistiques_"+U.today()+".csv",IO.statsCsv(sorted()),"text/csv")); sa.appendChild(h("div",{class:"btn-row"})).appendChild(sb); main.appendChild(sa);

  const ab=h("section",{class:"dcard"}); ab.appendChild(h("h2",null,"À propos"));
  ab.appendChild(h("p",{class:"sub-n"},"InsertiO, application d'entretien · version "+IO.VERSION+". Les données ne passent par aucun serveur : elles restent dans le dossier choisi ou sur l'appareil. Les informations de santé, d'aide sociale et de séjour sont des données sensibles : ne noter que ce qui sert l'accompagnement, et supprimer les dossiers qui n'ont plus lieu d'être conservés."));
  if(App.installEvt){ const ib2=h("button",{type:"button",class:"btn primary"},"Installer l'application sur cet appareil"); ib2.addEventListener("click",async()=>{ App.installEvt.prompt(); App.installEvt=null; }); ab.appendChild(h("div",{class:"btn-row"})).appendChild(ib2); }
  main.appendChild(ab);
}

Object.assign(App,{tabDocuments,tabProfil,save,go,route,startSuivi,actionAdder,pickFiles,modal,rdvWhen,flushAll,rdvDialog,progPill,getJ,banner,tabBase:tabSuivi,sorted});

/* ================================================================ Démarrage */
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); App.installEvt=e; const b=$("installBtn"); if(b) b.hidden=false; });
async function boot(){
  try{ const s=await IO.KV.get("settings"); if(s) App.settings=Object.assign(App.settings,s); }catch(e){}
  try{ App.status=await Store.init(); }catch(e){ App.status="none"; }
  try{ await IO.Team.load(); }catch(e){}
  await loadAll();
  if("serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
  const ib=$("installBtn"); if(ib) ib.addEventListener("click",()=>{ if(App.installEvt){ App.installEvt.prompt(); App.installEvt=null; ib.hidden=true; } });
  setSaveState("ok"," ");
  route(); syncChip(); postePing();
  setInterval(refreshList,20000);
}
IO.boot=boot;
let lastRefresh=0;
async function refreshList(){
  if(document.hidden||App.status!=="ok"||Store.mode!=="folder"||Date.now()-lastRefresh<15000) return;
  const hsh=IO.navHash||"#/"; if(!/^#?\/?$|^#\/jeunes$/.test(hsh)) return;
  if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  lastRefresh=Date.now(); try{ await IO.Team.load(); await loadAll(); route(); postePing(); }catch(e){}
}
window.addEventListener("focus",refreshList);
document.addEventListener("visibilitychange",refreshList);
document.addEventListener("DOMContentLoaded",boot);
})();

</script>
<script>
/* InsertiO – suivi de l'accompagnement sur plusieurs mois :
   parcours (programme, dates, bilans), objectifs gradués, entretiens de suivi guidés, candidatures. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, $=U.$, live=IO.live;
const App=()=>IO.App;

/* ================================================================ Référentiels */
REF.MODELES=[
  {k:"suivi",t:"Entretien de suivi",d:"45 min · déroulé complet"},
  {k:"court",t:"Point rapide ou appel",d:"10 à 15 min · actions et prochaine étape"},
  {k:"bilan_mi",t:"Bilan à mi-parcours",d:"Objectifs, auto-évaluation, ajustements"},
  {k:"bilan_fin",t:"Bilan de fin",d:"Résultats, situation à la sortie, suite"},
];
REF.modeleLabel=k=>(REF.MODELES.find(m=>m.k===k)||REF.MODELES[0]).t;
REF.CANAUX=["Sur place","Téléphone","Visio","Message"];
REF.HUMEUR=[{k:1,t:"Difficile"},{k:2,t:"Moyen"},{k:3,t:"Ça va"},{k:4,t:"Bien"},{k:5,t:"Très bien"}];
REF.NIVEAUX=[{k:0,t:"Pas commencé"},{k:1,t:"Démarré"},{k:2,t:"En progrès"},{k:3,t:"Presque"},{k:4,t:"Atteint"}];
REF.DOMAINES=[{k:"projet",t:"Projet professionnel"},{k:"cv",t:"CV et candidatures"},{k:"emploi",t:"Emploi, stage, apprentissage"},{k:"entretiens",t:"Entretiens d'embauche"},{k:"admin",t:"Démarches et droits"},{k:"num",t:"Numérique"},{k:"francais",t:"Français"},{k:"autre",t:"Autre"}];
REF.AUTOEVAL=[{k:"confiance",t:"J'ai confiance en moi"},{k:"projet",t:"Je sais quel métier je vise"},{k:"recherche",t:"Je sais chercher un emploi ou un stage"},{k:"codes",t:"Je connais les codes du travail en Suisse"},{k:"num",t:"Je me débrouille avec les outils numériques"},{k:"entretien",t:"Je suis à l'aise en entretien"}];
REF.SORTIE=[{k:"emploi",t:"Emploi"},{k:"apprent",t:"Apprentissage"},{k:"stage",t:"Stage"},{k:"formation",t:"Formation ou études"},{k:"mesure",t:"Autre mesure d'insertion"},{k:"recherche",t:"En recherche, avec un projet clair"},{k:"sans",t:"Sans solution pour l'instant"},{k:"abandon",t:"A arrêté l'accompagnement"}];
REF.CAND_STATUTS=[{k:"prevue",t:"À envoyer"},{k:"envoyee",t:"Envoyée"},{k:"relancee",t:"Relancée"},{k:"entretien",t:"Entretien obtenu"},{k:"acceptee",t:"Acceptée"},{k:"refusee",t:"Refusée"},{k:"sans",t:"Sans réponse"}];
REF.CAND_OPEN=["prevue","envoyee","relancee","entretien"];
REF.CAND_TYPES=["Emploi","Stage","Apprentissage","Job","Formation"];
REF.PROG_DUREE={tremplin:5,elan:3,passerelles:null};
REF.REVIEW=[{k:"fait",t:"Fait"},{k:"cours",t:"En cours"},{k:"pas",t:"Pas fait"}];
REF.RDV_OBJETS=["Entretien de suivi","Point rapide","Bilan à mi-parcours","Bilan de fin","Atelier","Autre"];
const cstat=k=>(REF.CAND_STATUTS.find(x=>x.k===k)||{}).t||k;

/* ================================================================ Temps d'entretien */
REF.MODELE_BUDGET={suivi:45,court:15,bilan_mi:60,bilan_fin:60};
REF.SEC_BUDGET={suivi:{accueil:5,actions:10,objectifs:5,travail:15,documents:2,suite:5,message:3},court:{accueil:3,actions:5,suite:4,message:3},
  bilan_mi:{accueil:5,actions:8,objectifs:10,travail:10,bilan:15,documents:2,suite:5,message:5},bilan_fin:{accueil:5,actions:5,objectifs:10,travail:5,bilan:20,documents:2,suite:8,message:5}};
/* Durée d'un suivi en minutes : saisie manuelle prioritaire, sinon chrono. */
IO.svMinutes=sv=>{ if(sv.duree!==undefined&&sv.duree!==""&&sv.duree!=null) return +sv.duree; const c=sv.clock; if(!c) return null; let t=c.elapsed||0; if(c.since) t+=(Date.now()-Date.parse(c.since))/1000; return t>0?Math.round(t/60):null; };
/* Durée du premier entretien : temps passé dans les étapes de la grille (chrono démarré). */
IO.entMinutes=e=>{ if(!e||!e.data) return null; const d=e.data; if(d.duree!==undefined&&d.duree!==""&&d.duree!=null) return +d.duree; const st=(d.clock&&d.clock.steps)||{}; const t=Object.values(st).reduce((a,b)=>a+(+b||0),0); return t>60?Math.round(t/60):null; };
IO.timeStats=j=>{ const e=IO.premier(j), pm=IO.entMinutes(e); const sm=live(j.suivis).map(IO.svMinutes).filter(x=>x!=null&&x>0);
  const total=(pm||0)+sm.reduce((a,b)=>a+b,0); return {premier:pm,suivis:sm,moySuivi:sm.length?Math.round(sm.reduce((a,b)=>a+b,0)/sm.length):null,total}; };
const fmtMin=m=>m==null?"—":m<60?m+" min":Math.floor(m/60)+" h "+String(m%60).padStart(2,"0");
IO.fmtMin=fmtMin;

/* ================================================================ Logique */
function ensure(j){ j.objectifs=j.objectifs||[]; j.candidatures=j.candidatures||[]; j.parcours=j.parcours||{}; j.suivis=j.suivis||[]; j.actions=j.actions||[]; j.rdv=j.rdv||[]; j.docs=j.docs||{}; return j; }
function addMonths(iso,m){ const d=new Date(iso+"T12:00"); const whole=Math.floor(m); d.setMonth(d.getMonth()+whole); d.setDate(d.getDate()+Math.round((m-whole)*30)); return d.toISOString().slice(0,10); }
IO.parcours=j=>{
  ensure(j); const k=REF.decisionKey(j.programme), p=j.parcours, e=IO.premier(j);
  const debut=p.debut||(e&&e.data.date_ent)||"";
  const mois=(p.duree!==undefined&&p.duree!=="")?+p.duree:(k?REF.PROG_DUREE[k]:null);
  const fin=debut&&mois?addMonths(debut,mois):"", mi=debut&&mois?addMonths(debut,mois/2):"";
  const sv=live(j.suivis).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const done=sv.filter(s=>s.presence==="present");
  const elapsed=debut&&fin?Math.max(0,Math.min(1,(Date.now()-Date.parse(debut+"T12:00"))/(Date.parse(fin+"T12:00")-Date.parse(debut+"T12:00")))):null;
  return {k,debut,mois,fin,mi,elapsed,semaine:debut?Math.max(1,Math.floor((Date.now()-Date.parse(debut+"T12:00"))/(7*864e5))+1):null,
    biMi:sv.find(s=>s.modele==="bilan_mi"),biFin:sv.find(s=>s.modele==="bilan_fin"),suivis:sv,realises:done};
};
IO.bilanDu=j=>{ if(j.statut==="clos") return null; const p=IO.parcours(j);
  if(p.mi&&!p.biMi&&U.daysFrom(p.mi)<=14) return {modele:"bilan_mi",date:p.mi};
  if(p.fin&&!p.biFin&&U.daysFrom(p.fin)<=14) return {modele:"bilan_fin",date:p.fin}; return null; };
IO.objLevel=o=>{ const ev=(o.evals||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))); const last=ev[ev.length-1]; return {niveau:last?last.niveau:0,date:last?last.date:"",history:ev}; };
IO.suggestObjectifs=s=>{
  if(!s) return [];
  const c=IO.ctxOf(s), L=[], ch=c.cherche;
  if(s.projet==="aucun"||s.projet==="pistes") L.push({domaine:"projet",t:"Clarifier et valider un projet professionnel réaliste"});
  if(s.cv_has!=="ajour"||c.cv.ko>=2||s.cv_auteur==="autre") L.push({domaine:"cv",t:"Avoir un CV et une lettre aux standards suisses, et savoir les adapter"});
  const dom=s.domaine?" ("+s.domaine+")":"";
  if(ch.includes("stage")) L.push({domaine:"emploi",t:"Trouver un stage"+dom});
  else if(ch.includes("apprent")) L.push({domaine:"emploi",t:"Trouver une place d'apprentissage"+dom});
  else if(ch.includes("emploi")||ch.includes("job")) L.push({domaine:"emploi",t:"Trouver un emploi"+dom});
  if(c.attentes.includes("entretiens")) L.push({domaine:"entretiens",t:"Être à l'aise en entretien d'embauche"});
  if(s.dipl==="etranger"||c.needs.includes("recon")) L.push({domaine:"admin",t:"Obtenir la reconnaissance du diplôme"});
  if(c.numLevel&&c.numLevel!=="Autonome") L.push({domaine:"num",t:"Utiliser seul·e les outils de la recherche d'emploi"});
  if(s.fr==="a"||c.needs.includes("francais")) L.push({domaine:"francais",t:"Progresser en français pour le travail"});
  const adm=c.needs.filter(n=>["impots","lamal","permis"].includes(n)); if(adm.length) L.push({domaine:"admin",t:"Régler les démarches en cours : "+adm.map(n=>REF.NEEDS.find(x=>x.k===n).t.toLowerCase()).join(", ")});
  return L.slice(0,5);
};
function newObjectif(j,t,domaine,svId,date){ const o={id:U.uid("o"),t,domaine:domaine||"autre",statut:"actif",evals:[{date:date||U.today(),niveau:0,sv:svId||""}],createdAt:U.now(),updatedAt:U.now()}; ensure(j).objectifs.push(o); return o; }
function setLevel(o,niveau,date,svId){ o.evals=o.evals||[]; let e=svId?o.evals.find(x=>x.sv===svId):null; if(!e){ e={date,sv:svId||""}; o.evals.push(e); } e.niveau=niveau; e.date=date; if(niveau===4) o.statut="atteint"; else if(o.statut==="atteint") o.statut="actif"; IO.touch(o); }
IO.syncSuivi=(j,sv)=>{
  ensure(j); const rid="rdv-"+sv.id; let r=j.rdv.find(x=>x.id===rid);
  const objet=sv.rdv_objet||"Entretien de suivi";
  if(sv.rdv_date){ if(!r){ r={id:rid,statut:"prevu",source:sv.id}; j.rdv.push(r); }
    if(r.date!==sv.rdv_date||r.heure!==sv.rdv_heure||r.lieu!==sv.rdv_lieu||r.objet!==objet||r.deleted){ Object.assign(r,{date:sv.rdv_date,heure:sv.rdv_heure,lieu:sv.rdv_lieu,objet,accomp:sv.accomp,deleted:false}); IO.touch(r); } }
  else if(r&&!r.deleted){ r.deleted=true; IO.touch(r); }
  if(sv.rdvFor){ const src=j.rdv.find(x=>x.id===sv.rdvFor); const st=sv.presence==="present"?"fait":sv.presence==="excuse"?"excuse":sv.presence==="absent"?"absent":null; if(src&&st&&src.statut!==st){ src.statut=st; IO.touch(src); } }
  if(sv.modele==="bilan_fin"&&sv.sortie){ if(j.sortie!==sv.sortie){ j.sortie=sv.sortie; } }
  sv.updatedAt=U.now(); IO.touch(j);
};
function prevSuivi(j,sv){ return live(j.suivis).filter(s=>s.id!==sv.id&&String(s.date)<=String(sv.date)&&s.presence==="present").sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null; }
function relances(j,horizon){ const lim=new Date(); lim.setDate(lim.getDate()+(horizon||0)); const L=lim.toISOString().slice(0,10); return live(ensure(j).candidatures).filter(c=>c.relance&&c.relance<=L&&["envoyee","relancee"].includes(c.statut)); }

/* ---------------- Message au jeune (remplace la version simple) */
IO.Msg.suivi=(j,sv)=>{
  ensure(j); const L=["Bonjour"+(U.firstName(j.nom)?" "+U.firstName(j.nom):"")+",",""];
  const absent=sv.presence&&sv.presence!=="present";
  if(!absent){
    L.push((sv.canal==="Téléphone"?"Merci pour notre échange téléphonique du ":"Merci pour notre rendez-vous du ")+U.fmtDate(sv.date)+".");
    if(sv.modele==="bilan_mi") L.push("","On a fait ensemble le point à mi-parcours.");
    if(sv.modele==="bilan_fin") L.push("","On a fait ensemble le bilan de ton accompagnement chez Insertio.");
    const pts=(sv.points||[]).map(k=>(REF.POINTS.find(p=>p.k===k)||{}).t).filter(Boolean);
    if(pts.length) L.push("","Ce qu'on a travaillé : "+pts.map(U.lc).join(", ")+".");
    if(sv.resume&&sv.resume.trim()) L.push("",sv.resume.trim());
    const objs=live(j.objectifs);
    if(sv.modele&&sv.modele.startsWith("bilan")&&objs.length){
      const ok=objs.filter(o=>IO.objLevel(o).niveau===4).map(o=>o.t), enc=objs.filter(o=>o.statut==="actif"&&IO.objLevel(o).niveau<4).map(o=>o.t);
      if(ok.length){ L.push("","Ce que tu as atteint :"); ok.forEach(t=>L.push("- "+t)); }
      if(enc.length&&sv.modele==="bilan_mi"){ L.push("","Ce sur quoi on continue :"); enc.forEach(t=>L.push("- "+t)); }
    }
    if(sv.modele==="bilan_fin"&&sv.suite&&sv.suite.trim()) L.push("","La suite : "+sv.suite.trim());
  } else L.push("Tu n'as pas pu venir à notre rendez-vous du "+U.fmtDate(sv.date)+". Ce n'est pas grave, on garde le contact.");
  const acts=live(j.actions).filter(a=>!a.done&&(a.qui==="Le jeune"||a.qui==="Le jeune + Insertio")&&!a.docs);
  if(acts.length){ L.push("",sv.modele==="bilan_fin"?"Pour la suite, ce qu'il te reste à faire :":sv.rdv_date?"Ce que tu prépares d'ici le prochain rendez-vous :":"Ce que tu prépares :"); acts.forEach(a=>L.push("- "+a.a+(a.quand?" (d'ici le "+U.fmtDate(a.quand)+")":""))); }
  const rel=relances(j, sv.rdv_date?Math.max(0,U.daysFrom(sv.rdv_date)):7);
  if(rel.length){ L.push("","Candidatures à relancer :"); rel.forEach(c=>L.push("- "+c.entreprise+(c.poste?" ("+c.poste+")":"")+(c.relance?", d'ici le "+U.fmtDate(c.relance):""))); }
  const missing=Object.entries(j.docs||{}).filter(([k,v])=>v&&v.demande&&!v.recu).map(([k,v])=>v.label||REF.docLabel(k));
  if(missing.length){ L.push("","Documents encore à apporter :"); missing.forEach(x=>L.push("- "+x)); }
  if(sv.rdv_date){ const ob=sv.rdv_objet&&sv.rdv_objet!=="Entretien de suivi"?" ("+sv.rdv_objet.toLowerCase()+")":""; L.push("",(absent?"On te propose un nouveau rendez-vous"+ob+" : ":"Ton prochain rendez-vous"+ob+" : ")+IO.Msg.rdvLine(sv.rdv_date,sv.rdv_heure,sv.rdv_lieu)+"."); }
  L.push("","Si tu as une question ou un empêchement, réponds simplement à ce message.","","À bientôt,",sv.accomp?sv.accomp+" – Insertio":"L'équipe Insertio");
  const subj=absent?"Insertio – nouveau rendez-vous":sv.modele==="bilan_fin"?"Insertio – bilan de ton accompagnement":sv.modele==="bilan_mi"?"Insertio – bilan à mi-parcours":"Insertio – suite de notre rendez-vous du "+U.fmtDate(sv.date);
  return {subject:subj, body:L.join("\n")};
};

/* ---------------- Compte rendu imprimable */
IO.Fiche.suivi=(j,sv)=>{
  ensure(j); const e=esc, L=a=>a.map(x=>'<li>'+e(x)+'</li>').join(""), row=(k,v)=>v?'<tr><th>'+e(k)+'</th><td>'+e(v).replace(/\n/g,"<br>")+'</td></tr>':"";
  const p=IO.parcours(j);
  let o='<header class="fh"><div class="logo">Inserti<span>O</span></div><div><h1>'+e(REF.modeleLabel(sv.modele))+'</h1><div class="meta">'+e(j.nom||"")+(j.programme?" · "+e(j.programme):"")+(p.semaine?" · semaine "+p.semaine:"")+'<br>'+e(U.fmtDate(sv.date))+(sv.heure?" à "+e(U.fmtTime(sv.heure)):"")+(sv.canal?" · "+e(sv.canal):"")+(sv.accomp?" · avec "+e(sv.accomp):"")+'</div></div></header><table>';
  o+=row("Présence",(REF.PRESENCE.find(x=>x.k===sv.presence)||{}).t||"—");
  o+=row("Durée",IO.svMinutes(sv)!=null?fmtMin(IO.svMinutes(sv)):"");
  o+=row("Comment ça va",(REF.HUMEUR.find(x=>x.k===sv.humeur)||{}).t||"");
  o+=row("Depuis la dernière fois",sv.depuis);
  o+=row("Points travaillés",(sv.points||[]).map(k=>(REF.POINTS.find(x=>x.k===k)||{}).t).filter(Boolean).join(", "));
  o+=row("Résumé partagé avec le jeune",sv.resume); o+=row("Notes de l'accompagnant·e",sv.notes); o+='</table>';
  const rv=Object.entries(sv.review||{}).map(([id,r])=>{ const a=(j.actions||[]).find(x=>x.id===id); return a?[a.a,(REF.REVIEW.find(x=>x.k===r.etat)||{}).t||"",r.raison||""]:null; }).filter(Boolean);
  if(rv.length) o+='<h3>Retour sur les actions prévues</h3><table class="list"><tr><th>Action</th><th>État</th><th>Commentaire</th></tr>'+rv.map(r=>'<tr><td>'+e(r[0])+'</td><td>'+e(r[1])+'</td><td>'+e(r[2])+'</td></tr>').join("")+'</table>';
  const objs=live(j.objectifs); if(objs.length) o+='<h3>Objectifs</h3><table class="list"><tr><th>Objectif</th><th>Niveau</th><th>Commentaire</th></tr>'+objs.map(ob=>{ const ev=(ob.evals||[]).find(x=>x.sv===sv.id); const lv=ev?ev.niveau:IO.objLevel(ob).niveau; return '<tr><td>'+e(ob.t)+(ob.statut==="abandonne"?" (abandonné)":"")+'</td><td>'+e(REF.NIVEAUX[lv].t)+'</td><td>'+e((ev&&ev.com)||"")+'</td></tr>'; }).join("")+'</table>';

  sections.forEach(sx=>io&&io.observe(sx.el));
  const iv=setInterval(()=>{ if(running()){ tick(); renderClock(); save("clock"); } },10000);
  const onVis=()=>{ if(document.visibilityState==="hidden") tick(); else lastT=running()?Date.now():null; }; document.addEventListener("visibilitychange",onVis);
  if(running()) lastT=Date.now();
  const _applyVis=applyVis; applyVis=function(){ _applyVis(); renderClock(); };
  applyVis(); save("init");
  return { destroy(){ tick(); if(running()) save("clock"); clearInterval(iv); io&&io.disconnect(); document.removeEventListener("visibilitychange",onVis); } };
};

/* ---------------- Tableau de statistiques (Réglages) */
S.statsPanel=(box,jeunes)=>{
  const js=jeunes.map(ensure), all=js.length, act=js.filter(j=>j.statut==="actif").length;
  const prem=js.filter(j=>IO.premier(j)).length, svs=js.flatMap(j=>live(j.suivis)), ts=js.map(IO.timeStats);
  const pm=ts.map(t=>t.premier).filter(x=>x!=null), sm=ts.flatMap(t=>t.suivis), tot=ts.reduce((a,t)=>a+(t.total||0),0);
  const rdv=js.flatMap(j=>live(j.rdv)), hon=rdv.filter(r=>r.statut==="fait").length, man=rdv.filter(r=>r.statut==="absent"||r.statut==="excuse").length;
  const sorties=js.filter(j=>j.sortie), pos=sorties.filter(j=>["emploi","apprent","stage","formation"].includes(j.sortie)).length;
  const objs=js.flatMap(j=>live(j.objectifs)), cand=js.flatMap(j=>live(j.candidatures));
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const k=(n,l)=>'<div class="kpi"><b>'+n+'</b><span>'+esc(l)+'</span></div>';
  const progs={}; js.forEach(j=>{ const p=j.programme||"Non défini"; progs[p]=(progs[p]||0)+1; });
  box.innerHTML='<div class="kpis">'+k(all,"jeunes au total")+k(act,"dossiers actifs")+k(prem,"premiers entretiens")+k(svs.length,"suivis")+
    k(fmtMin(tot||null),"temps d'entretien total")+k(fmtMin(avg(pm)),"durée moyenne d'un premier entretien")+k(fmtMin(avg(sm)),"durée moyenne d'un suivi")+
    k(hon+man?Math.round(hon/(hon+man)*100)+" %":"—","présence aux rendez-vous")+k(objs.length?Math.round(objs.filter(o=>IO.objLevel(o).niveau===4).length/objs.length*100)+" %":"—","objectifs atteints")+
    k(cand.filter(c=>c.statut!=="prevue").length,"candidatures envoyées")+k(cand.filter(c=>c.statut==="acceptee").length,"candidatures acceptées")+k(sorties.length?pos+" / "+sorties.length:"—","sorties vers emploi, apprentissage, stage ou formation")+'</div>'+
    '<p class="sub-n" style="margin-top:8px">Par programme : '+Object.entries(progs).map(([p,n])=>esc(p)+" "+n).join(" · ")+'. Le temps compte le premier entretien (chrono de la grille) et les suivis (chrono ou durée saisie).</p>';
};

/* ---------------- Cartes de l'accueil */
S.homeCards=(js,card,list)=>{
  const bil=[]; js.forEach(j=>{ const d=IO.bilanDu(j); if(d) bil.push({j,d}); }); bil.sort((a,b)=>a.d.date.localeCompare(b.d.date));
  if(bil.length) card("Bilans à prévoir",bil.length,list(bil,x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom)+'</b><span class="faint">'+esc(REF.modeleLabel(x.d.modele))+' · vers le '+esc(U.fmtDate(x.d.date))+(U.daysFrom(x.d.date)<0?' · <span class="warn-t">en retard</span>':'')+'</span></div>';
    const r=h("div",{class:"racts"}); const b=h("button",{type:"button",class:"btn"},"Faire le bilan"); b.addEventListener("click",()=>S.create(x.j,null,x.d.modele)); r.append(b,h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier")); li.appendChild(r); return li; },""));
  const rel=[]; js.filter(j=>j.statut!=="clos").forEach(j=>relances(j,3).forEach(c=>rel.push({j,c}))); rel.sort((a,b)=>a.c.relance.localeCompare(b.c.relance));
  if(rel.length) card("Candidatures à relancer",rel.length,list(rel.slice(0,12),x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.c.entreprise)+(x.c.poste?" · "+esc(x.c.poste):"")+'</b><span class="faint">'+esc(x.j.nom)+' · relance le '+esc(U.fmtDate(x.c.relance))+'</span></div><div class="racts"><a class="btn" href="#/j/'+x.j.id+'/candidatures">Candidatures</a></div>'; return li; },""));
};
})();

</script>
<script>
/* InsertiO 6 – parcours en séances numérotées, coaching, Pôle numérique (passages),
   accueil épuré, dictée vocale, fiche PDF rangée automatiquement dans le dossier. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, live=IO.live;
const A=()=>IO.App;

/* ================================================================ Référentiels */
REF.SEANCES={elan:13,tremplin:16};
REF.COACH_POS=[5,6];
REF.COACHING=[{n:1,t:"Gestion du stress et sophrologie"},{n:2,t:"Simulation d'entretien"},{n:3,t:"Coaching"}];
REF.PRESENCE6=[{k:"present",t:"Présent·e"},{k:"absent",t:"Absent·e"},{k:"excuse",t:"Excusé·e"}];
REF.PROG_CHOIX=[{k:"elan",v:"Élan",t:"Élan",d:"13 séances"},{k:"tremplin",v:"Tremplin",t:"Tremplin",d:"16 séances"},{k:"pole",v:"Pôle numérique seulement",t:"Pôle numérique",d:"une fiche par passage"},{k:"",v:"",t:"À définir",d:"après le premier entretien"}];
const RAPPEL_RE=/^\s*(rappels?|à faire|a faire|penser à|penser a|il faudra|ne pas oublier( de)?|la prochaine fois|pour la prochaine (séance|fois)|prochaine séance|à transmettre|a transmettre)\b[\s:,.-]*/i;

/* ================================================================ Modèle */
const kind=j=>{ const k=REF.decisionKey(j.programme); if(k) return k; return /num/i.test(j.programme||"")?"pole":null; };
const ensure=j=>{ j.seances=j.seances||[]; j.passages=j.passages||[]; j.parcours=j.parcours||{}; j.rdv=j.rdv||[]; j.actions=j.actions||[]; j.docs=j.docs||{}; migrate(j); return j; };
function migrate(j){
  if(j.parcours.v6) return; j.parcours.v6=true;
  const done=live(j.suivis).filter(s=>s.presence==="present"||s.presence==="absent"||s.presence==="excuse").sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(kind(j)==="pole"){ done.forEach(s=>j.passages.push({id:U.uid("p"),date:s.date,fait:s.resume||s.depuis||s.notes||"",accomp:s.accomp||"",legacy:s.id,createdAt:U.now(),updatedAt:U.now()})); return; }
  done.forEach((s,i)=>j.seances.push({id:U.uid("se"),n:i+1,type:"suivi",date:s.date,heure:s.heure||"",presence:s.presence,accomp:s.accomp||"",
    resume:[s.depuis,s.resume].filter(Boolean).join("\n\n"),transmis:s.notes||"",rappels:[],legacy:s.id,createdAt:U.now(),updatedAt:U.now()}));
}
const nbSeances=j=>{ const p=j.parcours||{}; if(p.nb!=null&&p.nb!=="") return +p.nb; const k=kind(j); return REF.SEANCES[k]||null; };
const debutOf=j=>{ const p=j.parcours||{}; if(p.debut) return p.debut; const e=IO.premier(j); return (e&&e.data.date_ent)||String(j.createdAt||U.now()).slice(0,10); };
const addDays=(iso,d)=>{ const x=new Date(iso+"T12:00"); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
const plannedDate=(j,n)=>{
  const doneBefore=live(j.seances||[]).filter(s=>s.n<n&&s.date&&["present","absent","excuse"].includes(s.presence)).sort((a,b)=>b.n-a.n)[0];
  let d=doneBefore?addDays(doneBefore.date,7*(n-doneBefore.n)):addDays(debutOf(j),7*(n-1));
  const s=live(j.seances||[]).find(x=>x.n===n); if(s&&s.date&&["present","absent","excuse"].includes(s.presence)) return s.date;
  /* séance pas encore faite : la prochaine est au plus tôt cette semaine, les suivantes s'enchaînent */
  let first=null; for(let i=1;i<n;i++){ const x=live(j.seances||[]).find(y=>y.n===i); if(!(x&&x.date&&["present","absent","excuse"].includes(x.presence))){ first=i; break; } }
  const k=first||n; const lag=U.daysFrom(doneBefore&&doneBefore.n<k?addDays(doneBefore.date,7*(k-doneBefore.n)):addDays(debutOf(j),7*(k-1)));
  if(lag<0) d=addDays(d,-lag);
  return d;
};
const getS=(j,n)=>live(j.seances).find(s=>s.n===n)||null;
const isDone=s=>!!(s&&s.date&&["present","absent","excuse"].includes(s.presence));
const typeOf=(j,n)=>{ const s=getS(j,n); if(s&&s.type) return s.type; return REF.COACH_POS.includes(n)&&["elan","tremplin"].includes(kind(j))?"coaching":"suivi"; };
const coachIdx=(j,n)=>{ let c=0; for(let i=1;i<=n;i++) if(typeOf(j,i)==="coaching") c++; return c; };
const coachTheme=(j,n)=>{ const s=getS(j,n); if(s&&s.theme) return s.theme; const c=coachIdx(j,n); return (REF.COACHING[c-1]||REF.COACHING[2]).t; };
const maxN=j=>Math.max(nbSeances(j)||0,...live(j.seances).map(s=>s.n));
const doneCount=j=>live(j.seances).filter(s=>s.presence==="present"&&s.date).length;
const nextN=j=>{ const N=maxN(j); for(let n=1;n<=N;n++){ if(!isDone(getS(j,n))) return n; } return N?N+1:1; };
const finished=j=>j.statut==="clos";
function seanceFor(j,n){ ensure(j); let s=getS(j,n); if(!s){ s={id:U.uid("se"),n,type:typeOf(j,n),date:"",heure:"",presence:"",accomp:"",resume:"",transmis:"",rappels:[],createdAt:U.now(),updatedAt:U.now()}; if(s.type==="coaching") s.theme=coachTheme(j,n); j.seances.push(s); } return s; }
function prevDone(j,n){ return live(j.seances).filter(s=>s.n<n&&isDone(s)).sort((a,b)=>b.n-a.n)[0]||null; }
function openRappels(j){ const L=[]; live(j.seances).forEach(s=>(s.rappels||[]).forEach(r=>{ if(!r.done&&!r.deleted) L.push({j,s,r}); })); return L; }
const titleOf=(j,n)=>typeOf(j,n)==="coaching"?"Coaching "+coachIdx(j,n):"Séance "+n;
const label6=j=>{ const k=kind(j); return k==="pole"?"Pôle numérique":k?REF.PROGRAMMES[k].label:(j.programme||"Programme à définir"); };
IO.V6={kind,nbSeances,doneCount,nextN,ensure};

/* ================================================================ Composants */
function progress(j,big){
  const k=kind(j);
  if(k==="pole"){ const n=live(ensure(j).passages).length; return '<div class="prog"><span class="lbl">'+n+' passage'+(n>1?"s":"")+'</span></div>'; }
  const N=nbSeances(j); if(!N) return '<div class="prog"><span class="lbl">Programme à définir</span></div>';
  const d=doneCount(ensure(j)); const pct=Math.min(100,Math.round(d/N*100));
  return '<div class="prog"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="lbl">'+(big?"Séance ":"")+d+' / '+N+'</span></div>';
}
IO.V6.progressCell=j=>progress(j,false);
function segc(items,val,onPick){ const w=h("div",{class:"segc",role:"group"}); items.forEach(it=>{ const b=h("button",{type:"button","aria-pressed":String(it.k===val)},esc(it.t)); b.addEventListener("click",()=>{ val=it.k; w.querySelectorAll("button").forEach((x,i)=>x.setAttribute("aria-pressed",String(items[i].k===val))); onPick(val); }); w.appendChild(b); }); return w; }
function field(parent,lab,el,hint){ const d=h("div",{class:"field"}); const id=el.id||U.uid("f"); el.id=id; d.appendChild(h("label",{for:id},esc(lab))); d.appendChild(el); if(hint) d.appendChild(h("p",{class:"hint"},hint)); parent.appendChild(d); return d; }
function ta(val,ph,on){ const t=h("textarea",{class:"f",placeholder:ph||""}); t.value=val||""; t.addEventListener("input",()=>on(t.value)); return t; }
function inp(type,val,on,attrs){ const i=h("input",Object.assign({class:"f",type},attrs||{})); i.value=val||""; i.addEventListener("input",()=>on(i.value)); i.addEventListener("change",()=>on(i.value)); return i; }
const me=()=>(IO.Team.me&&IO.Team.me.nom)||A().settings.accomp||"";

/* ================================================================ Nouveau jeune (avec programme) */
IO.V6.newJeune=()=>{
  A().modal('<div class="sheet-h"><h2>Nouveau jeune</h2></div><form id="nj6"><div class="row2"><div><label class="flab" for="nj_nom">Prénom et nom</label><input class="f" id="nj_nom" required autocomplete="off"></div><div><label class="flab" for="nj_nai">Date de naissance</label><input class="f" id="nj_nai" type="date"></div></div>'+
    '<div class="field"><label>Programme</label><div id="nj_prog"></div><p class="hint" id="nj_hint"></p></div>'+
    '<div class="row2"><div><label class="flab" for="nj_deb">Début de l\'accompagnement</label><input class="f" id="nj_deb" type="date"></div></div>'+
    '<p class="sub-n" id="njDup"></p><div class="btn-row"><button class="btn primary" type="submit" data-a="ent">Créer et commencer le premier entretien</button><button class="btn" type="submit" data-a="only">Créer le dossier</button><button class="btn" type="button" id="njCancel">Annuler</button></div></form>',
  (sh,close)=>{
    let prog="", action="ent"; const nom=sh.querySelector("#nj_nom"); nom.focus(); sh.querySelector("#nj_deb").value=U.today();
    const hint=sh.querySelector("#nj_hint"); const setHint=()=>{ const c=REF.PROG_CHOIX.find(x=>x.k===prog); hint.textContent=c?(c.k&&c.k!=="pole"?c.t+" : "+c.d+" planifiées automatiquement, une par semaine. Le nombre se modifie à tout moment.":c.d.charAt(0).toUpperCase()+c.d.slice(1)+"."):""; };
    sh.querySelector("#nj_prog").appendChild(segc(REF.PROG_CHOIX.map(c=>({k:c.k,t:c.t})),prog,v=>{ prog=v; setHint(); })); setHint();
    nom.addEventListener("input",()=>{ const v=U.slug(nom.value).toLowerCase(); const d=v.length>3?A().sorted().filter(j=>U.slug(j.nom).toLowerCase()===v):[]; sh.querySelector("#njDup").innerHTML=d.length?'Un dossier existe déjà à ce nom : <a href="#/j/'+d[0].id+'">ouvrir '+esc(d[0].nom)+'</a>':''; });
    sh.querySelectorAll("button[type=submit]").forEach(b=>b.addEventListener("click",()=>{ action=b.dataset.a; }));
    sh.querySelector("#njCancel").addEventListener("click",close);
    sh.querySelector("#nj6").addEventListener("submit",async e=>{ e.preventDefault(); if(!nom.value.trim()) return;
      const j=IO.blankJeune(A().settings); j.nom=nom.value.trim(); j.naissance=sh.querySelector("#nj_nai").value; if(IO.Team.me) j.referent=IO.Team.me.nom;
      const c=REF.PROG_CHOIX.find(x=>x.k===prog); j.programme=c?c.v:""; j.parcours={debut:sh.querySelector("#nj_deb").value||U.today(),v6:true}; ensure(j);
      A().jeunes.set(j.id,j); await A().save(j,true); close();
      if(action==="ent"){ const en={id:U.uid("e"),type:"premier",createdAt:U.now(),updatedAt:U.now(),data:IO.blankEntretien(j,A().settings)}; j.entretiens.push(en); A().save(j); A().go("#/j/"+j.id+"/e/"+en.id); }
      else A().go("#/j/"+j.id); });
  });
};

/* ================================================================ Accueil */
IO.V6.home=main=>{
  const App=A(); const blocked=App.banner(main);
  const name=me(); const hd=h("div",{class:"v-head"});
  hd.innerHTML='<div><h1>'+(name?"Bonjour "+esc(U.firstName(name)):"Bonjour")+'</h1><div class="meta">'+esc(new Date().toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long"}))+'</div></div>';
  const nb=h("button",{type:"button",class:"btn primary",id:"newJeune"},"Nouveau jeune"); nb.disabled=blocked; nb.addEventListener("click",IO.V6.newJeune); hd.appendChild(nb); main.appendChild(hd);
  if(blocked) return;
  if(IO.Store.mode!=="folder") main.appendChild(h("div",{class:"alert info",style:"margin-bottom:20px"},'Les dossiers sont enregistrés sur cet ordinateur seulement. Pour les partager avec l\'équipe : <a href="#/reglages">Réglages → dossier partagé</a>.'));
  const js=App.sorted().map(ensure), today=U.today(), active=js.filter(j=>j.statut!=="clos");
  const grid=h("div",{class:"home-grid"}); const L=h("div",{class:"stack"}), R=h("div",{class:"stack"}); grid.append(L,R); main.appendChild(grid);
  const card=(parent,title,count)=>{ const c=h("section",{class:"dcard"}); c.appendChild(h("h2",null,esc(title)+(count?' <span class="count">'+count+'</span>':''))); parent.appendChild(c); return c; };
  // Cette semaine
  const wk=[]; js.forEach(j=>live(j.rdv).forEach(r=>{ if(r.statut==="prevu"&&r.date&&r.date>=today&&U.daysFrom(r.date)<=7) wk.push({j,r}); }));
  wk.sort((a,b)=>(a.r.date+(a.r.heure||"")).localeCompare(b.r.date+(b.r.heure||"")));
  const late=[]; js.forEach(j=>live(j.rdv).forEach(r=>{ if(r.statut==="prevu"&&r.date&&r.date<today&&!live(j.seances).some(s=>s.date===r.date&&isDone(s))) late.push({j,r}); }));
  const c1=card(L,"Cette semaine",wk.length); const u1=h("ul",{class:"rows"}); c1.appendChild(u1);
  if(!wk.length) u1.appendChild(h("li",{class:"empty"},"Aucun rendez-vous dans les 7 prochains jours."));
  wk.forEach(x=>{ const n=nextN(x.j); const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom||"Sans nom")+'</b><span class="faint">'+esc(App.rdvWhen(x.r))+' · '+esc(kind(x.j)==="pole"?"Pôle numérique":titleOf(x.j,n))+'</span></div>';
    const a=h("div",{class:"racts"}); a.appendChild(h("a",{class:"btn"+(x.r.date===today?" primary":""),href:kind(x.j)==="pole"?"#/j/"+x.j.id:"#/j/"+x.j.id+"/seance/"+n},x.r.date===today?"Commencer":"Préparer")); li.appendChild(a); u1.appendChild(li); });
  if(late.length){ const p=h("p",{class:"sub-n",style:"margin-top:12px"}); p.innerHTML=late.length+' rendez-vous passé'+(late.length>1?"s":"")+' sans séance renseignée : '+late.slice(0,4).map(x=>'<a href="#/j/'+x.j.id+'/seance/'+nextN(x.j)+'">'+esc(x.j.nom)+'</a>').join(", ")+(late.length>4?"…":""); c1.appendChild(p); }
  // Rappels de la veille (Outlook)
  IO.Team.homeCards(js,(t,cnt,body)=>{ const c=card(L,t,cnt); c.appendChild(body); },(items,render,empty)=>{ const ul=h("ul",{class:"rows"}); if(!items.length) ul.appendChild(h("li",{class:"empty"},esc(empty))); items.forEach(x=>ul.appendChild(render(x))); return ul; });
  // Jeunes en cours
  const c2=card(L,"Jeunes en cours",active.length); const u2=h("ul",{class:"rows"}); c2.appendChild(u2);
  if(!active.length) u2.appendChild(h("li",{class:"empty"},"Aucun jeune en cours. Commence par « Nouveau jeune »."));
  active.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,10).forEach(j=>{ const li=h("li",{class:"row"});
    li.innerHTML='<div class="rmain"><a href="#/j/'+j.id+'"><b>'+esc(j.nom||"Sans nom")+'</b></a><span class="faint">'+esc(label6(j))+(j.referent?" · "+esc(j.referent):"")+'</span></div><div style="flex:0 0 200px">'+progress(j)+'</div>'; u2.appendChild(li); });
  if(js.length>10) c2.appendChild(h("a",{class:"more",href:"#/jeunes"},"Tous les jeunes →"));
  // À reprendre (rappels transmis)
  const rp=openRappels({seances:[]}); js.filter(j=>j.statut!=="clos").forEach(j=>openRappels(j).forEach(x=>rp.push(x)));
  const c3=card(R,"À reprendre",rp.length);
  if(!rp.length) c3.appendChild(h("p",{class:"empty"},"Rien à reprendre. Les rappels notés en fin de séance apparaissent ici."));
  else { const ul=h("ul",{class:"rlist"}); rp.slice(0,15).forEach(x=>{ const li=h("li"); const cb=h("input",{type:"checkbox","aria-label":"Fait"}); cb.addEventListener("change",()=>{ x.r.done=cb.checked; x.r.doneAt=U.now(); IO.touch(x.s); App.save(x.j); li.classList.toggle("done",cb.checked); });
      const sp=h("span"); sp.innerHTML=esc(x.r.t)+'<br><a class="faint" style="font-size:13px" href="#/j/'+x.j.id+'/seance/'+x.s.n+'">'+esc(x.j.nom)+' · '+esc(titleOf(x.j,x.s.n))+'</a>'; li.append(cb,sp); ul.appendChild(li); }); c3.appendChild(ul); }
  // Actions en retard et relances
  const lateA=[]; active.forEach(j=>live(j.actions).forEach(a=>{ if(!a.done&&a.quand&&a.quand<today) lateA.push({j,a}); }));
  if(lateA.length){ const c4=card(R,"Actions en retard",lateA.length); const ul=h("ul",{class:"rows"}); lateA.slice(0,8).forEach(x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.a.a)+'</b><span class="faint"><a href="#/j/'+x.j.id+'/objectifs">'+esc(x.j.nom)+'</a> · '+esc(x.a.qui)+' · '+esc(U.fmtDate(x.a.quand))+'</span></div>'; ul.appendChild(li); }); c4.appendChild(ul); }

  const dd=h("div"); dd.appendChild(h("span",{class:"flab"},"Date")); const di=inp("date",s.date||U.today(),v=>{ s.date=v; save(); },{"aria-label":"Date de la séance"}); if(!s.date) s.date=di.value; dd.appendChild(di); g.appendChild(dd);
  const ad=h("div"); ad.appendChild(h("span",{class:"flab"},"Avec")); ad.appendChild(inp("text",s.accomp,v=>{ s.accomp=v; save(); },{"aria-label":"Accompagnant·e"})); g.appendChild(ad);
  card.appendChild(g);
  const pf=h("div",{class:"field"}); pf.appendChild(h("label",null,"Présence")); pf.appendChild(segc(REF.PRESENCE6,s.presence||"",v=>{ s.presence=v; save(); })); card.appendChild(pf);
  { const qr=h("div",{class:"btn-row",style:"margin-top:-6px;margin-bottom:14px"}); const rdv=()=>({date:s.date||U.today(),heure:s.heure});
