<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>InsertiO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4459BD">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600;700&display=swap">
<style>
/* InsertiO – application d'entretien. Colonne de travail centrée, barre de navigation en haut,
   cartes pour le tableau de bord, grille d'entretien pas à pas avec barre Précédent / Suivant en bas. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#ECEEF7; --border:#D9DDEC;
  --text:#1C2135; --text-dim:#545B76; --text-faint:#737A95;
  --navy:#26306B; --blue:#4459BD; --blue-dim:#E7EAFA; --pink:#BF3F6C; --pink-dim:#FAE7EE;
  --good:#1C7C53; --good-dim:#E1F2E9; --warn:#965F06; --warn-dim:#FBEFD8; --crit:#B0323A; --crit-dim:#FBE5E6;
  --shadow:0 1px 2px rgba(28,33,53,.06),0 6px 18px rgba(28,33,53,.07); --on-accent:#FFFFFF;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif; --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1A1D29; --surface-2:#232737; --border:#343955; --text:#ECEEF7; --text-dim:#AEB3CB; --text-faint:#8A90AD;
  --navy:#B3BCF5; --blue:#8E9CF1; --blue-dim:#262B48; --pink:#EE8AB0; --pink-dim:#3B2230; --good:#62D3A0; --good-dim:#173127; --warn:#EDC064; --warn-dim:#33290C; --crit:#F08A8E; --crit-dim:#3A1E21;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); --on-accent:#12141C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1A1D29; --surface-2:#232737; --border:#343955; --text:#ECEEF7; --text-dim:#AEB3CB; --text-faint:#8A90AD;
  --navy:#B3BCF5; --blue:#8E9CF1; --blue-dim:#262B48; --pink:#EE8AB0; --pink-dim:#3B2230; --good:#62D3A0; --good-dim:#173127; --warn:#EDC064; --warn-dim:#33290C; --crit:#F08A8E; --crit-dim:#3A1E21;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); --on-accent:#12141C; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.faint{color:var(--text-faint)} .warn-t{color:var(--warn);font-weight:600}

/* Barre d'application */
.topbar{background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:600;font-size:24px;color:var(--navy);letter-spacing:-.01em;line-height:1;text-decoration:none}
.logo span{color:var(--pink)}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav a{text-decoration:none;color:var(--text-dim);font-weight:600;font-size:13.5px;padding:7px 11px;border-radius:8px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--blue-dim);color:var(--blue)}
.save-state{font-size:12px;color:var(--text-faint);white-space:nowrap}
.save-state[data-state="err"]{color:var(--crit);font-weight:600}
.save-state[data-state="saving"]{color:var(--text-dim)}

.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.wrap-grille{max-width:900px;padding-bottom:150px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.page-h h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,4vw,30px);margin:0;text-wrap:balance;line-height:1.15}
.back{display:inline-block;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:4px}
.lead{font-size:15.5px;color:var(--text-dim);max-width:68ch}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:80;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px}

/* Tableau de bord, cartes, lignes */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0}
.dcard h2{font-size:15px;font-weight:650;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:700;background:var(--surface-2);color:var(--text-dim);border-radius:999px;padding:1px 8px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.rows .row:first-child{border-top:none}
.row.done .rmain b{text-decoration:line-through;color:var(--text-faint)}
.rmain{flex:1;min-width:180px;display:flex;flex-direction:column;gap:1px}
.chk.rmain{flex-direction:row;align-items:flex-start;gap:10px}
.rmain a{text-decoration:none;color:var(--text)}
.rmain .faint{font-size:12.5px}
.racts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.more{display:inline-block;margin-top:8px;font-weight:600;font-size:13px;text-decoration:none}
.inline-add{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.inline-add .f{flex:1;min-width:140px}
.act-add .f[type=date]{flex:0 0 150px} .act-add select{flex:0 0 170px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .f[type=search]{flex:1;min-width:200px} .filters select{flex:0 0 160px}
.tablewrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-top:1px solid var(--border);font-size:13.5px;vertical-align:top}
.tbl thead th{border-top:none;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim)}
.tbl td a{text-decoration:none;color:var(--text)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs a{text-decoration:none;color:var(--text-dim);font-weight:600;padding:9px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--blue);border-bottom-color:var(--blue)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--border);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface);color:var(--text-dim)}
.drop b{color:var(--text)} .drop.over{border-color:var(--blue);background:var(--blue-dim)}
.g2{font-size:17px;margin:24px 0 6px} .glist{margin:0;padding-left:20px;line-height:1.6;max-width:75ch}
.msgbox{margin-top:6px}
.msg-sub{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;font-size:13.5px}
.msg-sub .flab{margin:0}
pre.msg{white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:0;max-height:380px;overflow:auto}
.confirm-inline{display:inline-flex;gap:6px;flex-wrap:wrap}

/* Pastilles, boutons, champs */
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.tremplin{background:var(--pink-dim);color:var(--pink)} .pill.elan{background:var(--blue-dim);color:var(--blue)}
.pill.passerelles{background:var(--good-dim);color:var(--good)} .pill.attente{background:var(--warn-dim);color:var(--warn)} .pill.num{background:var(--surface-2);color:var(--text-dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);min-height:38px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue)} .btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.danger{color:var(--crit)} .btn.danger:hover{border-color:var(--crit)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-dim);white-space:nowrap}
.tbtn:hover{border-color:var(--blue);color:var(--text)}
input.f,textarea.f,select.f{width:100%;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;padding:9px 10px;min-height:42px}
textarea.f{min-height:64px;resize:vertical;field-sizing:content;max-height:420px}
.flab{font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:4px;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.8px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.chk input{accent-color:var(--blue);width:18px;height:18px;margin-top:1px;flex-shrink:0}
.chk.plain{background:none;border:none;padding:0}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 14px;margin-top:14px}
.row2 > *{min-width:0} .row2 > [hidden]{display:none}
.q{margin-top:16px} .q > .label{font-size:14.5px;font-weight:600} .q > .hint{font-size:12.5px;color:var(--text-faint);margin-top:1px} .q > .ctl{margin-top:8px}
.sub-h{font-size:15px;font-weight:650;margin:22px 0 2px}
.sub-n{font-size:12.5px;color:var(--text-faint);margin:2px 0 6px}
.empty{color:var(--text-faint);font-size:13px;font-style:italic;padding:6px 0}
.alert{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;background:var(--warn-dim);color:var(--text)}
.alert b{color:var(--warn)} .alert.info{background:var(--blue-dim)} .alert.info b{color:var(--blue)} .alert.crit{background:var(--crit-dim)} .alert.crit b{color:var(--crit)} .alert a{color:inherit}

/* Options et grille */
.opts{display:flex;flex-direction:column;gap:6px} .opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
.opts.inline .opt{width:auto} .opt:hover{border-color:var(--blue)}
.opt .box{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text-faint);flex-shrink:0;display:grid;place-items:center}
.opt.multi .box{border-radius:4px}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--blue);background:var(--blue-dim)}
.opt[aria-pressed="true"] .box,.opt[aria-checked="true"] .box{border-color:var(--blue);background:var(--blue)}
.opt[aria-checked="true"] .box::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--surface)}
.opt.multi[aria-pressed="true"] .box::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.opt .t{flex:1;font-size:13.8px} .opt .m{font-size:12px;font-weight:700} .opt .m.good{color:var(--good)} .opt .m.warn{color:var(--warn)}
.sug{font-size:10.5px;font-weight:700;color:var(--pink);background:var(--pink-dim);border-radius:999px;padding:1px 7px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.g-head{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);margin-inline:-16px;padding:10px 16px 8px}
.ab-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{flex:1;min-width:140px;display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .who small{font-size:12px;color:var(--text-faint)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg2{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg2 button{border:none;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-dim)}
.seg2 button+button{border-left:1px solid var(--border)} .seg2 button[aria-pressed="true"]{background:var(--blue-dim);color:var(--blue)}
.clock{font-variant-numeric:tabular-nums} .clock.over{color:var(--warn);border-color:var(--warn)}
.steps{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px} .steps::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px 4px 5px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer}
.chip b{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:50%;background:var(--surface-2);font-size:11px}
.chip.part b{background:var(--blue-dim);color:var(--blue)} .chip.done b{background:var(--good-dim);color:var(--good)} .chip.cur{border-color:var(--blue);color:var(--text);box-shadow:0 0 0 1px var(--blue) inset}
.live{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--text-dim)}
.live .lbl{color:var(--text-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
@media (max-width:600px){.g-head .live{display:none}.tools{width:100%}.tools .seg2{flex:1}.tools .seg2 button{flex:1}}
.panel{padding-top:22px;scroll-margin-top:130px}
.grille.mode-step .panel{display:none} .grille.mode-step .panel.cur{display:block}
.grille.mode-all .panel + .panel{margin-top:22px;border-top:1px dashed var(--border)}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph .num{font-family:var(--f-display);font-weight:600;color:var(--pink);font-size:19px}
.ph h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.6vw,24px);margin:0;text-wrap:balance;flex:1;min-width:200px}
.ph .budget{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums} .ph .budget.over{color:var(--warn);font-weight:600}
.intent{font-size:13.5px;color:var(--text-dim);margin:6px 0 4px;max-width:70ch}
.ask{margin-top:10px;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text-dim)}
.ask b{color:var(--text);font-weight:600} .ask ul{margin:4px 0 0;padding-left:18px} .key{background:var(--pink-dim);color:var(--text)}
.cvt{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.cvr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 12px;border-top:1px solid var(--border);align-items:center} .cvr:first-child{border-top:none}
.cvr .ct{font-size:13.8px;font-weight:600;min-width:0} .cvr .cd{font-size:12.3px;color:var(--text-faint);font-weight:400;margin-top:1px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap}
.seg button + button{border-left:1px solid var(--border)} .seg button[aria-pressed="true"].ok{background:var(--good-dim);color:var(--good)} .seg button[aria-pressed="true"].ko{background:var(--warn-dim);color:var(--warn)}
@media (max-width:520px){.cvr{grid-template-columns:1fr}}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--text-dim);flex-wrap:wrap}
.meter .track{flex:1;min-width:80px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:220px} .meter .track i{display:block;height:100%;background:var(--good);border-radius:3px}
.slots{overflow-x:auto} .slots table{border-collapse:separate;border-spacing:4px;font-size:12.5px}
.slots th{font-weight:600;color:var(--text-dim);padding:2px 4px;text-align:center} .slots th.r{text-align:right}
.slot{width:54px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer} .slot[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.card .top{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.card .top .pill{font-size:13px;padding:5px 12px} .card .top p{margin:0;flex:1;min-width:200px;color:var(--text-dim);font-size:13.8px}
.card .body{padding:12px 16px 14px;display:grid;gap:12px}
.card h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint)}
.card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6} .card .vig li::marker{color:var(--warn)}
.recap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px} @media (max-width:640px){.recap{grid-template-columns:1fr}}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.rc h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em} .rc.good h3{color:var(--good)} .rc.warn h3{color:var(--warn)}
.rc ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65}
details.rules{margin-top:10px;font-size:13px} details.rules summary{cursor:pointer;color:var(--text-dim);font-weight:600}
details.rules table{border-collapse:collapse;width:100%;margin-top:6px;font-size:12.5px} details.rules td{border-top:1px solid var(--border);padding:5px 6px;vertical-align:top}
details.rules td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--text-faint);white-space:nowrap;width:1%} .rulewrap{overflow-x:auto}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13.5px}
.checklist .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.checklist .ok .st{background:var(--good-dim);color:var(--good)} .checklist .ko .st{background:var(--warn-dim);color:var(--warn)}
.checklist li span.t{flex:1} .checklist button{border:none;background:none;color:var(--blue);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px}
.plan{display:flex;flex-direction:column;gap:6px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px 38px;gap:6px;align-items:center}
@media (max-width:640px){.pr{grid-template-columns:1fr 1fr 38px}.pr .a{grid-column:1/-1}}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-faint);font-size:17px;line-height:1}
.icon-btn:hover{color:var(--crit);border-color:var(--crit)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .bar{pointer-events:auto;width:100%;max-width:868px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:6px}
.bottom .mid{flex:1;min-width:0;text-align:center;font-size:12.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    rdv_date:"", rdv_heure:"", rdv_lieu:(settings&&settings.lieu)||"Locaux Insertio, rue Le-Royer 24, Les Acacias", notes:"", quicknotes:"",

IO.ctxOf = s => {
  s = s || {};
  const n=["n1","n2","n3","n4"].reduce((a,k)=>{ if(s[k]!==undefined&&s[k]!==""){a.n+=+s[k];a.answered++;} return a; },{n:0,answered:0});
  let ok=0,ko=0; REF.CV_ITEMS.forEach(c=>{ const v=(s.cvcheck||{})[c.k]; if(v==="ok") ok++; else if(v==="ko") ko++; });
  const arr=k=>Array.isArray(s[k])?s[k]:[];
  const c={ s, age:U.ageOf(s.naissance, s.date_ent), snf:["f","n","s"].includes(s.permis), digital:n,
    numLevel: n.answered ? (n.n<=2?"Non autonome":n.n<=5?"Semi-autonome":"Autonome") : null,
    cv:{ok,ko,total:REF.CV_ITEMS.length}, needs:arr("needs"), attentes:arr("attentes"), cherche:arr("cherche"),
    any:!!(s.permis||s.projet||s.cv_has), nbCand:+s.nb_cand||0, nbRep:+s.nb_rep||0, taux:+s.taux||0 };
  c.cvSupport = (()=>{
    if(!s.cv_has && !n.answered) return null;
    if(s.cv_has==="non" || (n.answered&&n.n<=2)) return {level:"Non autonome",text:"Construire le CV et la lettre en individuel avec l'accompagnant·e.",action:"Construire le CV en individuel",qui:"Le jeune + Insertio"};
    if(["autre","aide"].includes(s.cv_auteur) || (n.answered&&n.n<=5) || ko>=3) return {level:"Semi-autonome",text:"Finaliser CV et lettre avec un appui ponctuel : "+REF.POLE_NUM+" ou atelier collectif.",action:"Finaliser le CV au "+REF.POLE_NUM,qui:"Le jeune"};
    return {level:"Autonome",text:"Le jeune retravaille seul son CV et sa lettre d'ici le prochain rendez-vous, avec les pistes données en entretien.",action:"Retravailler le CV avec les pistes données",qui:"Le jeune"};
  })();
  c.ready = s.projet==="clair" && s.exp_level==="signif" && s.fr!=="a" && s.cv_has==="ajour" && ko<=1 && (!n.answered||n.n>=6);
  c.studentOver = s.permis==="b_etu" && c.taux>36;
  return c;
};

/* Fusion de deux versions d'un même dossier (dossier partagé, import de tablette).
   Champs simples : la version la plus récente gagne. Listes : élément par élément (id), le plus récent gagne. */
IO.merge = (a, b) => {
  if(!a) return b; if(!b) return a;
  const newer = (Date.parse(b.updatedAt||0) > Date.parse(a.updatedAt||0)) ? b : a, older = newer===a?b:a;
  const out = Object.assign({}, older, newer);
  ["entretiens","suivis","rdv","actions","documents","objectifs","candidatures"].forEach(k=>{
    const map=new Map();
    [...(older[k]||[]),...(newer[k]||[])].forEach(x=>{ const p=map.get(x.id); if(!p || Date.parse(x.updatedAt||0)>=Date.parse(p.updatedAt||0)) map.set(x.id,x); });
    out[k]=[...map.values()];
  });
  out.docs = Object.assign({}, older.docs||{});
  Object.entries(newer.docs||{}).forEach(([k,v])=>{ const p=out.docs[k]; if(!p || Date.parse(v.updatedAt||0)>=Date.parse(p.updatedAt||0)) out.docs[k]=v; });
  return out;
};
/* Fusion à trois voies (dossier partagé modifié par un·e collègue pendant qu'on travaillait) :
   pour chaque champ simple, ce que j'ai modifié depuis l'ouverture l'emporte ; sinon la version du disque. */
IO.merge3 = (disk, mine, base) => {
  const out = IO.merge(disk, mine);
  const skip = new Set(["entretiens","suivis","rdv","actions","documents","objectifs","candidatures","docs","updatedAt"]);
  const keys = new Set([...Object.keys(disk), ...Object.keys(mine)]);
  keys.forEach(k=>{ if(skip.has(k)||k[0]==="_") return;
    const changedByMe = !base || JSON.stringify(mine[k])!==JSON.stringify(base[k]);
    out[k] = changedByMe ? mine[k] : disk[k]; });
  return out;
};

  if(s.rdv_date){ if(!r){ r={id:rid,statut:"prevu",objet:"Suivi après le premier entretien",source:ent.id}; j.rdv.push(r); }
    if(r.date!==s.rdv_date||r.heure!==s.rdv_heure||r.lieu!==s.rdv_lieu||r.deleted){ r.date=s.rdv_date; r.heure=s.rdv_heure; r.lieu=s.rdv_lieu; r.accomp=s.accomp; r.deleted=false; IO.touch(r); } }
  else if(r && !r.deleted){ r.deleted=true; IO.touch(r); }
  const ids=new Set();
  (s.plan||[]).forEach(p=>{ if(!p.id) p.id=U.uid("p"); const aid="act-"+p.id; ids.add(aid); let a=j.actions.find(x=>x.id===aid);
    if(!p.a||!p.a.trim()){ if(a&&!a.deleted){ a.deleted=true; IO.touch(a);} return; }
    if(!a){ a={id:aid,source:ent.id,done:false,createdAt:U.now()}; j.actions.push(a); }
    if(a.a!==p.a||a.qui!==p.qui||a.quand!==p.quand||a.deleted||a.docs!==!!p.docs){ a.a=p.a; a.qui=p.qui; a.quand=p.quand||""; a.docs=!!p.docs; a.deleted=false; IO.touch(a); } });
  j.actions.forEach(a=>{ if(a.source===ent.id && a.id.startsWith("act-") && !ids.has(a.id) && !a.deleted){ a.deleted=true; IO.touch(a); } });
  j.docs=j.docs||{};
  REF.DOCS.forEach(d=>{ const want=!!(s.docs||{})[d.k], cur=j.docs[d.k];
    if(want && (!cur||!cur.demande)){ j.docs[d.k]=Object.assign(cur||{}, {demande:true,label:d.t,recu:cur?cur.recu:false,updatedAt:U.now()}); }
    else if(!want && cur && cur.demande && cur.source===ent.id && !cur.recu){ cur.demande=false; cur.updatedAt=U.now(); }
    if(want) j.docs[d.k].source=j.docs[d.k].source||ent.id; });
  if(s.docs_autre && s.docs_autre.trim()){ const k="autre-"+ent.id; const cur=j.docs[k]; if(!cur||cur.label!==s.docs_autre){ j.docs[k]=Object.assign(cur||{recu:false},{demande:true,label:s.docs_autre.trim(),source:ent.id,updatedAt:U.now()}); } }
  ent.updatedAt=U.now(); IO.touch(j);
};
IO.syncSuivi = (j, sv) => {
  const rid="rdv-"+sv.id; let r=(j.rdv||[]).find(x=>x.id===rid);
  if(sv.rdv_date){ if(!r){ r={id:rid,statut:"prevu",objet:"Entretien de suivi",source:sv.id}; j.rdv.push(r); }
    if(r.date!==sv.rdv_date||r.heure!==sv.rdv_heure||r.lieu!==sv.rdv_lieu||r.deleted){ r.date=sv.rdv_date; r.heure=sv.rdv_heure; r.lieu=sv.rdv_lieu; r.accomp=sv.accomp; r.deleted=false; IO.touch(r); } }
  else if(r && !r.deleted){ r.deleted=true; IO.touch(r); }
  if(sv.rdvFor){ const src=(j.rdv||[]).find(x=>x.id===sv.rdvFor); const st= sv.presence==="present"?"fait":sv.presence==="excuse"?"excuse":sv.presence==="absent"?"absent":null;
    if(src && st && src.statut!==st){ src.statut=st; IO.touch(src); } }
  sv.updatedAt=U.now(); IO.touch(j);
};
IO.nextRdv = j => IO.live(j.rdv).filter(r=>r.statut==="prevu"&&r.date&&U.daysFrom(r.date)>=0).sort((a,b)=>(a.date+(a.heure||"")).localeCompare(b.date+(b.heure||"")))[0]||null;
IO.lastContact = j => { const d=[...IO.live(j.entretiens).map(e=>e.data&&e.data.date_ent),...IO.live(j.suivis).map(s=>s.date)].filter(Boolean).sort(); return d[d.length-1]||""; };
IO.premier = j => IO.live(j.entretiens).find(e=>e.type==="premier")||null;
IO.ageBand = a => a==null?"":a<16?"<16":a<=17?"16-17":a<=20?"18-20":a<=25?"21-25":a<=30?"26-30":">30";
IO.statsCsv = jeunes => {
  const head=["date_premier_entretien","tranche_age","statut_sejour","occupation","formation","oriente_par","programme_propose","programme_retenu","adhesion","autonomie_numerique","appui_cv","besoins","nb_suivis","nb_rdv_honores","nb_rdv_manques","nb_actions","nb_actions_faites","statut_dossier"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"', I=IO.ITEMS;
  const rows=jeunes.map(j=>{ const e=IO.premier(j), s=e?e.data:{}, c=IO.ctxOf(s), ev=IO.evaluate(s), rdv=IO.live(j.rdv), acts=IO.live(j.actions);
    return [s.date_ent||"",IO.ageBand(U.ageOf(j.naissance||s.naissance, s.date_ent)),s.permis?U.optLabel(I.permis,s.permis):"",s.activite?U.optLabel(I.activite,s.activite):"",s.niveau_form?U.optLabel(I.niveau_form,s.niveau_form):"",j.oriente||s.oriente||"",
      e?ev.main.label:"",j.programme||s.decision||"",s.adhesion||"",c.numLevel||"",c.cvSupport?c.cvSupport.level:"",c.needs.map(n=>REF.NEEDS.find(x=>x.k===n).t).join(" | "),
      IO.live(j.suivis).length,rdv.filter(r=>r.statut==="fait").length,rdv.filter(r=>r.statut==="absent").length,acts.length,acts.filter(a=>a.done).length,(REF.STATUTS.find(x=>x.k===j.statut)||{}).t||""]; });
  return "﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n")+"\r\n";
};

<script>
/* InsertiO – stockage.
   Deux modes, même interface :
   - "folder" : un dossier partagé choisi sur l'ordinateur (synchronisé par kDrive, OneDrive…), via l'API File System Access (Chrome, Edge).
       <dossier choisi>/Jeunes/<Nom_Prenom>__<id>/jeune.json + Documents/ + Fiches/
   - "local"  : dans l'application (IndexedDB), pour tablette ou navigateur sans accès aux dossiers.
   Échange entre appareils : export / import .zip avec la même arborescence (fusion élément par élément). */
(function(){
"use strict";
const IO=window.IO, U=IO.U;
const SUBS=["Documents","Fiches"];

/* ---------------- IndexedDB minimal */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open("insertio-app",1);
  r.onupgradeneeded=()=>{ const d=r.result; ["kv","files"].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); if(!d.objectStoreNames.contains("jeunes")) d.createObjectStore("jeunes",{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbp; }
const rq=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const os=async(n,m)=>(await db()).transaction(n,m||"readonly").objectStore(n);
const idb={
  get:async(n,k)=>rq((await os(n)).get(k)), put:async(n,v,k)=>rq((await os(n,"readwrite")).put(v,k)), del:async(n,k)=>rq((await os(n,"readwrite")).delete(k)),
  all:async n=>rq((await os(n)).getAll()), keys:async n=>rq((await os(n)).getAllKeys()),
};
IO.KV={ get:k=>idb.get("kv",k).catch(()=>undefined), set:(k,v)=>idb.put("kv",v,k).catch(()=>{}) };

const clean = j => { const o={}; Object.keys(j).forEach(k=>{ if(k[0]!=="_") o[k]=j[k]; }); return o; };
const dirNameFor = j => (U.slug(j.nom)||"Jeune")+"__"+j.id.slice(-6);
async function uniqueName(exists, name){ if(!(await exists(name))) return name; const m=name.match(/^(.*?)(\.[^.]*)?$/); for(let i=2;i<999;i++){ const n=m[1]+" ("+i+")"+(m[2]||""); if(!(await exists(n))) return n; } return Date.now()+"_"+name; }
const typeOf = n => { const e=(n.split(".").pop()||"").toLowerCase(); return ({pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",html:"text/html",htm:"text/html",txt:"text/plain",json:"application/json",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",doc:"application/msword",heic:"image/heic"})[e]||"application/octet-stream"; };

/* ---------------- Mode local (IndexedDB) */
const Local = {
  kind:"local", label:"Sur cet appareil",
  async status(){ return "ok"; },
  async list(){ return (await idb.all("jeunes")).map(j=>Object.assign(j,{_dir:dirNameFor(j)})); },
  async get(id){ const j=await idb.get("jeunes",id); if(j) j._dir=dirNameFor(j); return j||null; },
  async save(j){ await idb.put("jeunes",clean(j)); return j; },
  async remove(id){ await idb.del("jeunes",id); const ks=(await idb.keys("files")).filter(k=>String(k).startsWith(id+"|")); for(const k of ks) await idb.del("files",k); },
  async listFiles(id){ const ks=(await idb.keys("files")).filter(k=>String(k).startsWith(id+"|")); const out=[]; for(const k of ks){ const v=await idb.get("files",k); if(v) out.push({sub:v.sub,name:v.name,size:v.size,type:v.type,lastModified:v.addedAt}); } return out.sort((a,b)=>b.lastModified-a.lastModified); },
  async addFile(id, sub, blob, name, overwrite){
    const key=n=>id+"|"+sub+"|"+n;
    const final = overwrite ? name : await uniqueName(async n=>!!(await idb.get("files",key(n))), name);
    await idb.put("files",{jid:id,sub,name:final,blob,size:blob.size,type:blob.type||typeOf(final),addedAt:Date.now()},key(final)); return final; },
  async readFile(id, sub, name){ const v=await idb.get("files",id+"|"+sub+"|"+name); return v?v.blob:null; },
  async deleteFile(id, sub, name){ await idb.del("files",id+"|"+sub+"|"+name); },
};

/* ---------------- Mode dossier partagé (File System Access) */
let root=null; const dirMap=new Map();
async function perm(h, ask){ if(!h.queryPermission) return "granted"; const o={mode:"readwrite"}; let p=await h.queryPermission(o); if(p!=="granted"&&ask) p=await h.requestPermission(o); return p; }
/* Dossier des jeunes : « 06 Les Jeunes » s'il existe dans le dossier choisi, sinon « Jeunes ».
   Un sous-dossier par jeune, à son nom (« Prénom Nom »). Les documents sont rangés directement dedans,
   les fiches d'entretien dans « Fiches ». Le fichier jeune.json contient le dossier de l'application. */
let jdName=null;
async function jeunesDir(){
  if(!jdName){ jdName="Jeunes"; for await (const [n,h] of root.entries()){ if(h.kind==="directory" && /^\d*\s*les jeunes$/i.test(n.trim())){ jdName=n; break; } } }
  return root.getDirectoryHandle(jdName,{create:true});
}
const safeName = s => String(s||"").normalize("NFC").replace(/[\\/:*?"<>|\u0000-\u001f]/g," ").replace(/\s+/g," ").trim().replace(/[. ]+$/,"").slice(0,80) || "Jeune";
const SKIP = n => n==="jeune.json"||n==="desktop.ini"||n.startsWith(".")||n.startsWith("~$");
async function readJson(dir){ try{ const fh=await dir.getFileHandle("jeune.json"); const f=await fh.getFile(); return JSON.parse(await f.text()); }catch(e){ return null; } }
async function writeFile(dir, name, data){ const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(data); await w.close(); }
async function exists(dir, name){ try{ await dir.getFileHandle(name); return true; }catch(e){ return false; } }
async function dirExists(dir, name){ try{ await dir.getDirectoryHandle(name); return true; }catch(e){ return false; } }
async function dirOf(j, create){
  const jd=await jeunesDir();
  let name=dirMap.get(j.id);
  if(!name){ // dossier créé par un·e collègue : on cherche le jeune.json qui porte cet identifiant
    for await (const [n,h] of jd.entries()){ if(h.kind!=="directory") continue; const d=await readJson(h); if(d&&d.id===j.id){ name=n; break; } }
  }
  if(!name){
    if(!create||!j.nom) return null;
    const base=safeName(j.nom); name=base;
    // dossier déjà existant au même nom : on le reprend s'il n'appartient à aucun autre jeune
    for(let i=2; await dirExists(jd,name); i++){ const d=await readJson(await jd.getDirectoryHandle(name)); if(!d||d.id===j.id) break; name=base+" ("+i+")"; }
  }
  dirMap.set(j.id,name);
  return jd.getDirectoryHandle(name,{create:!!create});
}
async function subDir(d, sub, create){ return sub==="Fiches" ? d.getDirectoryHandle("Fiches",{create:!!create}) : d; }
const Folder = {
  kind:"folder", get label(){ return root?("Dossier partagé « "+root.name+" »"):"Dossier partagé"; },
  async status(){ if(!root) return "none"; try{ return (await perm(root,false))==="granted"?"ok":"permission"; }catch(e){ return "permission"; } },
  async list(){
    const jd=await jeunesDir(), out=[];
    for await (const [n,h] of jd.entries()){ if(h.kind!=="directory") continue; const j=await readJson(h); if(j&&j.id){ j._dir=n; j._base=j.updatedAt; j._snap=JSON.stringify(j); dirMap.set(j.id,n); out.push(j); } }
    return out;
  },
  async get(id){ const d=await dirOf({id},false); if(!d) return null; const j=await readJson(d); if(j){ j._dir=dirMap.get(id); j._base=j.updatedAt; j._snap=JSON.stringify(j); } return j; },
  async save(j){
    const d=await dirOf(j,true); if(!d) throw new Error("dossier introuvable"); const disk=await readJson(d);
    let out=j;
    if(disk && disk.updatedAt && disk.updatedAt!==j._base && Date.parse(disk.updatedAt)>Date.parse(j._base||0)){ out=IO.merge3(disk,j,j._snap?JSON.parse(j._snap):null); out.updatedAt=U.now(); out._merged=true; }
    const txt=JSON.stringify(clean(out),null,2);
    await writeFile(d,"jeune.json",txt);
    out._dir=dirMap.get(j.id); out._base=out.updatedAt; out._snap=JSON.stringify(clean(out)); return out;
  },
  async remove(id){ const name=dirMap.get(id); if(!name) return; await (await jeunesDir()).removeEntry(name,{recursive:true}); dirMap.delete(id); },
  async listFiles(id){
    const d=await dirOf({id},false); if(!d) return []; const out=[];
    const scan=async(dir,sub)=>{ for await (const [n,h] of dir.entries()){ if(h.kind!=="file"||SKIP(n)) continue; const f=await h.getFile(); out.push({sub,name:n,size:f.size,type:f.type||typeOf(n),lastModified:f.lastModified}); } };
    await scan(d,"Documents");
    try{ await scan(await d.getDirectoryHandle("Fiches"),"Fiches"); }catch(e){}
    return out.sort((a,b)=>b.lastModified-a.lastModified);
  },
  async addFile(id, sub, blob, name, overwrite){
    const j=IO.App&&IO.App.jeunes.get(id); const d=await dirOf(j||{id},true); if(!d) throw new Error("dossier introuvable"); const sd=await subDir(d,sub,true);
    const final= overwrite?name:await uniqueName(n=>exists(sd,n),name);
    await writeFile(sd,final,blob); return final; },
  async readFile(id, sub, name){ const d=await dirOf({id},false); if(!d) return null; const sd=await subDir(d,sub); return (await sd.getFileHandle(name)).getFile(); },
  async deleteFile(id, sub, name){ const d=await dirOf({id},false); const sd=await subDir(d,sub); await sd.removeEntry(name); },
};

/* ---------------- Façade */
const Store = IO.Store = {
  a: Local,
  supportsFolder: typeof window.showDirectoryPicker==="function",
  async getShared(name){
    if(this.a.kind==="folder"&&root){ try{ const d=await root.getDirectoryHandle("Reglages"); return await (await d.getFileHandle(name)).getFile(); }catch(e){ return null; } }
    const v=await IO.KV.get("shared:"+name); return v||null; },
  async putShared(name, blob){
    if(this.a.kind==="folder"&&root){ const d=await root.getDirectoryHandle("Reglages",{create:true}); await writeFile(d,name,blob); return; }
    await IO.KV.set("shared:"+name, blob); },
  async removeShared(name){
    if(this.a.kind==="folder"&&root){ try{ const d=await root.getDirectoryHandle("Reglages"); await d.removeEntry(name); }catch(e){} return; }
    await IO.KV.set("shared:"+name, null); },
  get mode(){ return this.a.kind; },
  get label(){ return this.a.label; },
  async init(){
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    const mode=await IO.KV.get("mode"); const h=await IO.KV.get("rootHandle");
    if(mode==="folder" && h){ root=h; this.a=Folder; }
    return this.status();
  },
  status(){ return this.a.status(); },
  async pickFolder(){
    const h=await window.showDirectoryPicker({id:"insertio-jeunes",mode:"readwrite"});
    if((await perm(h,true))!=="granted") throw new Error("permission");
    root=h; jdName=null; dirMap.clear(); this.a=Folder; await IO.KV.set("rootHandle",h); await IO.KV.set("mode","folder"); return h.name;
  },
  async useHandle(h){ root=h; dirMap.clear(); this.a=Folder; await IO.KV.set("mode","folder"); try{ await IO.KV.set("rootHandle",h); }catch(e){} }, // tests
  async reconnect(){ if(!root) return "none"; const p=await perm(root,true); return p==="granted"?"ok":"permission"; },
  async useLocal(){ this.a=Local; await IO.KV.set("mode","local"); },
  list(){ return this.a.list(); }, get(id){ return this.a.get(id); }, save(j){ return this.a.save(j); }, remove(id){ return this.a.remove(id); },
  listFiles(id){ return this.a.listFiles(id); }, addFile(id,sub,blob,name,ow){ return this.a.addFile(id,sub,blob,name,ow); },
  readFile(id,sub,name){ return this.a.readFile(id,sub,name); }, deleteFile(id,sub,name){ return this.a.deleteFile(id,sub,name); },
  localAdapter: Local,

  /* Export .zip : Jeunes/<dossier>/jeune.json + Documents/ + Fiches/ */
  async exportZip(ids, from){
    const A=from||this.a; const zip=new JSZip(); const all=await A.list(); let n=0;
    for(const j of all){ if(ids && !ids.includes(j.id)) continue; const dir="Jeunes/"+(j._dir||dirNameFor(j))+"/";
      zip.file(dir+"jeune.json",JSON.stringify(clean(j),null,2));
      for(const f of await A.listFiles(j.id)){ const b=await A.readFile(j.id,f.sub,f.name); if(b) zip.file(dir+f.sub+"/"+f.name,b,{date:new Date(f.lastModified||Date.now())}); }
      n++; }
    zip.file("LISEZMOI.txt","Export de l'application InsertiO ("+new Date().toLocaleString("fr-CH")+"). Contient des données personnelles et sensibles : à conserver dans un espace protégé et à supprimer après import.\r\n");
    return {blob:await zip.generateAsync({type:"blob",compression:"DEFLATE"}), count:n};
  },
  /* Import .zip : fusion avec les dossiers existants ; les fichiers déjà présents (même nom, même taille) sont ignorés. */
  async importZip(file, into){
    const A=into||this.a; const zip=await JSZip.loadAsync(file); const rep={jeunes:0,nouveaux:0,fichiers:0};
    const dirs={}; zip.forEach((p,e)=>{ const m=p.match(/^(?:.*\/)?Jeunes\/([^/]+)\/(.+)$/); if(!m||e.dir) return; (dirs[m[1]]=dirs[m[1]]||[]).push({rel:m[2],e}); });
    for(const name of Object.keys(dirs)){
      const js=dirs[name].find(x=>x.rel==="jeune.json"); if(!js) continue;
      let inc; try{ inc=JSON.parse(await js.e.async("string")); }catch(e){ continue; } if(!inc||!inc.id) continue;
      const cur=await A.get(inc.id); let m=cur?IO.merge(cur,inc):inc; if(cur){ m._base=cur._base; m._dir=cur._dir; m._snap=cur._snap; } else rep.nouveaux++;
      m.updatedAt = cur ? U.now() : (inc.updatedAt||U.now());
      await A.save(m); rep.jeunes++;
      const have=new Set((await A.listFiles(inc.id)).map(f=>f.sub+"/"+f.name+"/"+f.size));
      for(const f of dirs[name]){ const mm=f.rel.match(/^(Documents|Fiches)\/([^/]+)$/); if(!mm) continue; const b=await f.e.async("blob");
        if(have.has(mm[1]+"/"+mm[2]+"/"+b.size)) continue; await A.addFile(inc.id,mm[1],new Blob([b],{type:typeOf(mm[2])}),mm[2],false); rep.fichiers++; }
    }
    return rep;
  },
  /* Copie des dossiers de cet appareil (mode local) vers le dossier partagé. */
  async copyLocalToFolder(){
    const {blob,count}=await this.exportZip(null, Local); if(!count) return {jeunes:0,nouveaux:0,fichiers:0};
    return this.importZip(blob, Folder);
  },
};
})();

<script>

(function(){
"use strict";
const IO=window.IO, U=IO.U;
/* PDF : texte vectoriel (sélectionnable), construit à partir de la fiche HTML */
IO.pdfBlob=async html=>{
  const J=window.jspdf&&window.jspdf.jsPDF; if(!J) throw new Error("module PDF absent");
  const doc=new J({unit:"mm",format:"a4"}); const W=210,H=297,M=16,CW=W-2*M; let y=M;
  const clean=t=>String(t||"").replace(/[  ]/g," ").replace(/→/g,"->").replace(/[✓✔]/g,"").replace(/≈/g,"env.").replace(/[“”]/g,'"').replace(/\s+/g," ").trim();
  const NAVY=[38,48,107], PINK=[191,63,108], INK=[28,33,53], DIM=[84,91,118], LINE=[217,221,236];
  const need=h=>{ if(y+h>H-M-6){ doc.addPage(); y=M; } };
  const text=(t,{size=10,bold=false,color=INK,x=M,w=CW,lh=0.42,after=1.2}={})=>{ t=clean(t); if(!t) return; doc.setFont("helvetica",bold?"bold":"normal"); doc.setFontSize(size); doc.setTextColor(...color);
    const lines=doc.splitTextToSize(t,w); const step=size*lh; lines.forEach(l=>{ need(step); doc.text(l,x,y+size*0.35); y+=step; }); y+=after; };
  const rule=()=>{ doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M,y,W-M,y); y+=2; };
  const dom=new DOMParser().parseFromString(html,"text/html");
  const walk=el=>{ for(const n of el.children){ const tag=n.tagName.toLowerCase(), cls=n.className||"";
    if(cls.includes("html2pdf__page-break")){ doc.addPage(); y=M; continue; }
    if(tag==="header"){ doc.setFont("times","bold"); doc.setFontSize(20); doc.setTextColor(...NAVY); doc.text("Inserti",M,y+7); const lw=doc.getTextWidth("Inserti"); doc.setTextColor(...PINK); doc.text("O",M+lw,y+7); y+=12;
      const h1=n.querySelector("h1"); if(h1) text(h1.textContent,{size:15,bold:true,after:1}); const meta=n.querySelector(".meta"); if(meta) meta.innerHTML.split(/<br\s*\/?>/i).forEach(l=>text(l.replace(/<[^>]+>/g,""),{size:9.5,color:DIM,after:0.4})); y+=2; rule(); continue; }
    if(cls.includes("decision")){ [...n.children].forEach(c=>{ const k=c.querySelector(".k"); const lab=k?k.textContent:""; const val=clean(c.textContent.replace(lab,"")); text(lab.toUpperCase()+" : "+val,{size:9.5,bold:false,after:0.6}); }); y+=2; continue; }
    if(cls.includes("two")){ walk(n); continue; }
    if(tag==="div"){ walk(n); continue; }
    if(tag==="h1"){ text(n.textContent,{size:15,bold:true}); continue; }
    if(tag==="h2"){ y+=2; need(12); text(n.textContent,{size:12,bold:true,color:NAVY,after:0.6}); rule(); continue; }
    if(tag==="h3"){ y+=1; need(10); text(n.textContent,{size:10.5,bold:true,after:0.8}); continue; }
    if(tag==="p"){ n.innerHTML.split(/<br\s*\/?>/i).forEach((l,i,a)=>text(new DOMParser().parseFromString(l,"text/html").body.textContent,{size:10,after:i===a.length-1?1.6:0.3})); continue; }
    if(tag==="ul"||tag==="ol"){ [...n.querySelectorAll(":scope > li")].forEach(li=>{ doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...INK); need(4.2); doc.text("•",M+1,y+3.5); text(li.textContent,{size:10,x:M+5,w:CW-5,after:0.6}); }); y+=1; continue; }
    if(tag==="table"){ const rows=[...n.querySelectorAll("tr")]; const isList=n.classList.contains("list")||(rows[0]&&rows[0].querySelectorAll("th").length>1);
      if(isList){ const nc=Math.max(...rows.map(r=>r.children.length)); const cw=CW/nc;
        rows.forEach((r,ri)=>{ const cells=[...r.children]; doc.setFontSize(9.5); const hts=cells.map(c=>doc.splitTextToSize(clean(c.textContent)||" ",cw-2).length); const rh=Math.max(...hts)*4+2; need(rh);
          if(ri===0){ doc.setFillColor(243,244,250); doc.rect(M,y,CW,rh,"F"); }
          cells.forEach((c,ci)=>{ doc.setFont("helvetica",ri===0?"bold":"normal"); doc.setTextColor(...(ri===0?DIM:INK)); doc.splitTextToSize(clean(c.textContent)||"",cw-2).forEach((l,li)=>doc.text(l,M+ci*cw+1,y+4+li*4)); });
          y+=rh; doc.setDrawColor(...LINE); doc.line(M,y,W-M,y); }); y+=3; continue; }
      rows.forEach(r=>{ const th=r.querySelector("th"), td=r.querySelector("td"); if(!th&&!td) return; const lw=58, vw=CW-lw-2;
        doc.setFontSize(9.5); const lab=doc.splitTextToSize(clean(th?th.textContent:""),lw-2); const vals=(td?td.innerHTML.split(/<br\s*\/?>/i):[""]).flatMap(v=>doc.splitTextToSize(clean(new DOMParser().parseFromString(v,"text/html").body.textContent)||" ",vw));
        const rh=Math.max(lab.length,vals.length)*4.1+2; need(rh);
        doc.setFont("helvetica","bold"); doc.setTextColor(...DIM); lab.forEach((l,i)=>doc.text(l,M,y+4+i*4.1));
        doc.setFont("helvetica","normal"); doc.setTextColor(...INK); vals.forEach((l,i)=>doc.text(l,M+lw+2,y+4+i*4.1));
        y+=rh; doc.setDrawColor(236,238,246); doc.line(M,y,W-M,y); }); y+=3; continue; }
    if(tag==="footer"){ y+=4; text(n.textContent,{size:8.5,color:DIM}); continue; }
    if(n.children.length) walk(n); else text(n.textContent);
  } };
  walk(dom.body);
  const pages=doc.getNumberOfPages(); for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...DIM); doc.text("InsertIA · Insertio Genève · confidentiel · page "+i+" / "+pages,W/2,H-8,{align:"center"}); }
  return doc.output("blob");
};
U.openHtml=async(html,print,filename)=>{
  U.toast("Préparation du PDF…",6000);
  try{ const b=await IO.pdfBlob(html); await U.download(filename||("Insertio_fiche_"+U.today()+".pdf"),b); }
  catch(e){ U.toast("PDF impossible : "+((e&&e.message)||e)+". Recharge la page.",6000); }
};
/* Reprise des entretiens faits avec l'ancienne grille en ligne (même lien) */
IO.oldDrafts=()=>{ const out=[]; try{
    const idx=JSON.parse(localStorage.getItem("insertio-grille-v3-index")||"[]");
    idx.forEach(e=>{ try{ const d=JSON.parse(localStorage.getItem("insertio-grille-v3-d:"+e.id)||"null"); if(d) out.push(d); }catch(x){} });
    const v2=JSON.parse(localStorage.getItem("insertio-premier-entretien-v2")||"null"); if(v2&&(v2.nom||v2.cv_has||v2.permis)) out.push(v2);
  }catch(e){} return out; };
IO.migrateOld=async(force)=>{
  try{ if(!force&&localStorage.getItem("insertia-migrated")) return 0; }catch(e){ return 0; }
  const drafts=IO.oldDrafts(); if(!drafts.length){ try{ localStorage.setItem("insertia-migrated","1"); }catch(e){} return 0; }
  const st=(await IO.KV.get("settings"))||{}; const existing=await IO.Store.list(); let n=0;
  for(const d of drafts){
    const nom=(d.nom||"Sans nom").trim(), date=d.date_ent||"";
    if(existing.some(j=>(j.nom||"").trim()===nom&&(j.entretiens||[]).some(e=>e.data&&e.data.date_ent===date))) continue;
    const j=IO.blankJeune(st); j.nom=nom;
    const data=Object.assign(IO.blankEntretien(j,st),d); ["id","_v","created","updated","_saved","_format"].forEach(k=>delete data[k]);
    data.cvcheck=data.cvcheck||{}; data.slots=data.slots||{}; data.docs=data.docs||{}; data.plan=Array.isArray(data.plan)?data.plan:[]; data.clock=data.clock||{start:null,steps:{}};
    data.plan.forEach(p=>{ if(!p.id) p.id=U.uid("p"); if(p.quand&&!/^\d{4}-\d{2}-\d{2}$/.test(p.quand)) p.quand=""; });
    const ent={id:U.uid("e"),type:"premier",createdAt:d.created||U.now(),updatedAt:U.now(),data};
    j.entretiens.push(ent); IO.syncEntretien(j,ent); await IO.Store.save(j); existing.push(j); n++; }
  try{ localStorage.setItem("insertia-migrated","1"); }catch(e){}
  if(n) setTimeout(()=>U.toast(n+" entretien(s) de l'ancienne grille repris : voir « Jeunes »",6000),1200);
  return n;
};
})();
