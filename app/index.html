<script>
/* InsertiO – interface de la grille du premier entretien (pas à pas). */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, $=U.$;

IO.Grille = { mount };

function mount(root, data, opts){
  const S=data; opts=opts||{};
  S.cvcheck=S.cvcheck||{}; S.slots=S.slots||{}; S.docs=S.docs||{}; S.plan=S.plan||[]; S.clock=S.clock||{start:null,steps:{}}; S.clock.steps=S.clock.steps||{};
  let MODE="step"; try{ const m=localStorage.getItem("insertio-grille-mode"); if(m==="all"||m==="step") MODE=m; }catch(e){}
  let lastTick=S.clock.start?Date.now():null;
  const STEPS=IO.STEPS, ITEMS=IO.ITEMS;
  const fmtBudget=st=>S.format==="1 h 30"?st.budget[1]:st.budget[0];
  const totalBudget=()=>S.format==="1 h 30"?90:60;

  root.innerHTML="";
  root.classList.add("grille");
  const head=h("div",{class:"g-head"},
    '<div class="ab-row"><div class="who"><b id="gWho"></b><small id="gWhoSub"></small></div><div class="tools">'+
    '<button type="button" class="tbtn clock" id="clockBtn" title="Démarrer le chrono de l\'entretien">Chrono</button>'+
    '<div class="seg2" role="group" aria-label="Affichage"><button type="button" id="modeStep">Pas à pas</button><button type="button" id="modeAll">Tout voir</button></div>'+
    '</div></div><nav class="steps" id="steps" aria-label="Étapes de l\'entretien"></nav><div class="live" id="live"></div>');
  const panels=h("div",{id:"panels"});
  const bottom=h("div",{class:"bottom"},'<div class="bar"><button type="button" class="navb" id="prevBtn">← <span class="lbl-l">Précédent</span></button><div class="mid" id="midInfo"></div><button type="button" class="notesbtn" id="notesBtn" aria-expanded="false" aria-controls="notesDrawer">Notes</button><button type="button" class="navb next" id="nextBtn"></button></div>');
  const drawer=h("div",{class:"drawer",id:"notesDrawer",hidden:true},'<h3>Notes en vrac</h3><textarea class="f" id="f_quicknotes" placeholder="Tout ce qui se dit et qu\'on rangera plus tard. Reprises dans la fiche."></textarea>');
  const youth=h("div",{class:"modal",id:"youthModal",hidden:true,role:"dialog","aria-modal":"true","aria-labelledby":"youthTitle"},'<div class="sheet youth" id="youthSheet"></div>');
  root.append(head,panels,bottom,drawer,youth);

  /* ---------- champs */
  function syncOpts(it,w){ w.querySelectorAll(".opt").forEach(b=>{ const k=b.dataset.k; const on=it.type==="radio"?S[it.id]===k:Array.isArray(S[it.id])&&S[it.id].includes(k); b.setAttribute(it.type==="radio"?"aria-checked":"aria-pressed",on?"true":"false"); }); }
  function control(it){
    const v=S[it.id];
    switch(it.type){
      case "text": case "date": case "number":{ const i=h("input",{class:"f",id:"f_"+it.id,type:it.type==="text"?"text":it.type,placeholder:it.ph,inputmode:it.inputmode,autocomplete:it.ac||"off",min:it.min,max:it.max,step:it.step}); i.value=v==null?"":v; i.addEventListener("input",()=>{ S[it.id]=i.value; changed(it.id); }); return i; }
      case "textarea":{ const t=h("textarea",{class:"f",id:"f_"+it.id,placeholder:it.ph}); t.value=v||""; t.addEventListener("input",()=>{ S[it.id]=t.value; changed(it.id); }); return t; }
      case "select":{ const s=h("select",{class:"f",id:"f_"+it.id}); s.innerHTML='<option value="">—</option>'+it.options.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join(""); s.addEventListener("change",()=>{ S[it.id]=s.value; changed(it.id); }); return s; }
      case "check":{ const l=h("label",{class:"chk"+(it.plain?" plain":"")}); const c=h("input",{type:"checkbox",id:"f_"+it.id}); c.checked=!!v; c.addEventListener("change",()=>{ S[it.id]=c.checked; changed(it.id); }); l.appendChild(c); l.appendChild(h("span",null,esc(it.label)+(it.hint?'<br><small class="faint">'+esc(it.hint)+'</small>':''))); return l; }
      case "radio": case "multi":{
        const radio=it.type==="radio", w=h("div",{class:"opts"+(it.inline?" inline":""),role:radio?"radiogroup":"group","aria-labelledby":"lbl_"+it.id});
        it.options.forEach(o=>{ const b=h("button",{type:"button",class:"opt"+(radio?"":" multi"),id:"f_"+it.id+"_"+o.k,role:radio?"radio":null}); b.dataset.k=o.k;
          b.innerHTML='<span class="box"></span><span class="t">'+esc(o.t)+'</span>'+(o.m?'<span class="m '+o.m+'" aria-hidden="true">'+(o.m==="good"?"✓":"!")+'</span>':'');
          b.addEventListener("click",()=>{ if(radio) S[it.id]=S[it.id]===o.k?"":o.k; else { let a=Array.isArray(S[it.id])?S[it.id].slice():[]; if(a.includes(o.k)) a=a.filter(x=>x!==o.k); else { if(it.exclusive&&o.k===it.exclusive) a=[]; else if(it.exclusive) a=a.filter(x=>x!==it.exclusive); a.push(o.k);} S[it.id]=a; } syncOpts(it,w); changed(it.id); });
          w.appendChild(b); });
        syncOpts(it,w); return w; }
      case "cvcheck":{
        const box=h("div"), t=h("div",{class:"cvt"});
        REF.CV_ITEMS.forEach(ci=>{ const r=h("div",{class:"cvr"}); r.innerHTML='<div class="ct">'+esc(ci.t)+'<div class="cd">'+esc(ci.d)+'</div></div>';
          const seg=h("div",{class:"seg",role:"group","aria-label":ci.t});
          [["ok","Conforme"],["ko","À retravailler"]].forEach(([k,l])=>{ const b=h("button",{type:"button",class:k,id:"f_cv_"+ci.k+"_"+k},l); b.setAttribute("aria-pressed",S.cvcheck[ci.k]===k?"true":"false");
            b.addEventListener("click",()=>{ S.cvcheck[ci.k]=S.cvcheck[ci.k]===k?undefined:k; seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",S.cvcheck[ci.k]===x.className?"true":"false")); changed("cvcheck"); }); seg.appendChild(b); });
          r.appendChild(seg); t.appendChild(r); });
        box.appendChild(t); box.appendChild(h("div",{class:"meter",id:"cvMeter"})); return box; }
      case "slots":{
        const w=h("div",{class:"slots"}); let html='<table><thead><tr><th></th>'+REF.DAYS.map(d=>'<th>'+d+'</th>').join("")+'</tr></thead><tbody>';
        REF.HALF.forEach(([hk,hl])=>{ html+='<tr><th class="r">'+hl+'</th>'+REF.DAYS.map((d,i)=>{ const k=i+hk; return '<td><button type="button" class="slot" id="f_slot_'+k+'" data-k="'+k+'" aria-label="'+REF.DAYS_L[i]+' '+hl.toLowerCase()+'" aria-pressed="'+(S.slots[k]?"true":"false")+'"></button></td>'; }).join("")+'</tr>'; });
        w.innerHTML=html+'</tbody></table>';
        w.querySelectorAll(".slot").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.k; S.slots[k]=!S.slots[k]; b.setAttribute("aria-pressed",S.slots[k]?"true":"false"); changed("slots"); })); return w; }
      case "docs": return h("div",{class:"opts",id:"docsWrap"});
    }
  }
  function renderDocs(){ const w=$("docsWrap"); if(!w) return; w.innerHTML="";
    REF.DOCS.forEach(d=>{ const sug=d.sug(S); const b=h("button",{type:"button",class:"opt multi",id:"f_doc_"+d.k}); b.setAttribute("aria-pressed",S.docs[d.k]?"true":"false");
      b.innerHTML='<span class="box"></span><span class="t">'+esc(d.t)+(sug?'<span class="sug">suggéré</span>':'')+'</span>';
      b.addEventListener("click",()=>{ S.docs[d.k]=!S.docs[d.k]; b.setAttribute("aria-pressed",S.docs[d.k]?"true":"false"); changed("docs"); }); w.appendChild(b); }); }

  /* ---------- étapes */
  function build(){
    panels.innerHTML="";
    STEPS.forEach((st,i)=>{
      const p=h("section",{class:"panel",id:"step-"+st.id,"aria-labelledby":"h-"+st.id}); p.dataset.i=i;
      p.appendChild(h("div",{class:"ph"},'<span class="num">'+(i+1)+'</span><h2 id="h-'+st.id+'">'+esc(st.title)+'</h2><span class="budget" id="bud-'+i+'"></span>'));
      p.appendChild(h("div",{class:"intent"+(st.key?" ask key":"")},esc(st.intent)));
      if(st.ask) p.appendChild(h("div",{class:"ask"},'<b>À dire</b><ul>'+st.ask.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ul>'));
      if(st.id==="cv" && opts.addDocs){ const br=h("div",{class:"btn-row"}); const b=h("button",{type:"button",class:"btn",id:"addCvBtn"},"Ajouter le CV ou un document au dossier du jeune"); b.addEventListener("click",()=>opts.addDocs()); br.appendChild(b); p.appendChild(br); }
      if(st.custom==="proposition") buildProposition(p);
      else if(st.custom==="cloture") buildCloture(p);
      else {
        let rowEl=null,rowKey=null;
        st.items.forEach(it=>{
          if(it.row){ if(rowKey!==it.row){ rowEl=h("div",{class:"row2"}); p.appendChild(rowEl); rowKey=it.row; }
            const q=h("div",{id:"q_"+it.id}); q.appendChild(h("label",{class:"flab",for:"f_"+it.id},esc(it.label))); q.appendChild(control(it)); rowEl.appendChild(q); return; }
          rowKey=null; const q=h("div",{class:"q",id:"q_"+it.id});
          if(it.type!=="check"){ q.appendChild(h("div",{class:"label",id:"lbl_"+it.id},esc(it.label))); q.appendChild(h("div",{class:"hint",id:"hint_"+it.id},esc(it.hint||""))); }
          const c=h("div",{class:"ctl"}); c.appendChild(control(it)); q.appendChild(c); p.appendChild(q);
        });
        (st.slots||[]).forEach(sid=>p.appendChild(h("div",{id:sid})));
      }
      panels.appendChild(p);
    });
    renderDocs(); $("f_quicknotes").value=S.quicknotes||"";
  }
  function buildProposition(p){
    p.appendChild(h("div",{class:"recap"},'<div class="rc good"><h3>Points forts</h3><ul id="goodList"></ul></div><div class="rc warn"><h3>Points à travailler</h3><ul id="warnList"></ul></div>'));
    p.appendChild(h("div",{class:"card",id:"propCard"}));
    p.appendChild(h("details",{class:"rules",id:"rulesBox"}));
    p.appendChild(h("div",{class:"sub-h"},"Décision prise ensemble"));
    p.appendChild(h("div",{class:"sub-n"},"Peut différer de la proposition : c'est le jeune qui s'engage."));
    const row=h("div",{class:"row2"});
    const dec=h("select",{class:"f",id:"f_decision"}); dec.innerHTML='<option value="">—</option>'+REF.DECISIONS.map(o=>'<option'+(o===S.decision?' selected':'')+'>'+o+'</option>').join("");
    dec.addEventListener("change",()=>{ S.decision=dec.value; changed("decision"); });
    const adh=h("select",{class:"f",id:"f_adhesion"}); adh.innerHTML='<option value="">—</option>'+["D'accord","Hésite, à reprendre","Pas d'accord"].map(o=>'<option'+(o===S.adhesion?' selected':'')+'>'+o+'</option>').join("");
    adh.addEventListener("change",()=>{ S.adhesion=adh.value; changed("adhesion"); });
    const a=h("div"); a.append(h("label",{class:"flab",for:"f_decision"},"Programme retenu"),dec);
    const b=h("div"); b.append(h("label",{class:"flab",for:"f_adhesion"},"Adhésion du jeune"),adh);
    row.append(a,b); p.appendChild(row);
    const use=h("div",{class:"btn-row"}); const ub=h("button",{type:"button",class:"btn",id:"useProp"},"Reprendre la proposition");
    ub.addEventListener("click",()=>{ const m=IO.evaluate(S).main; if(m.code==="attente"){ U.toast("Pas encore de proposition"); return; } S.decision=m.label; dec.value=m.label; changed("decision"); });
    use.appendChild(ub); p.appendChild(use);
  }
  function buildCloture(p){
    p.appendChild(h("div",{class:"sub-h"},"Avant de se quitter")); p.appendChild(h("ul",{class:"checklist",id:"checkList"}));
    p.appendChild(h("div",{class:"sub-h"},"Plan d'action")); p.appendChild(h("div",{class:"sub-n"},"Une étape concrète et datée par action. Le plan est repris dans le suivi du jeune."));
    p.appendChild(h("div",{class:"plan",id:"planRows"}));
    const br=h("div",{class:"btn-row"}); const sug=h("button",{type:"button",class:"btn primary",id:"sugAction"},"Ajouter les actions suggérées"); const add=h("button",{type:"button",class:"btn",id:"addAction"},"Ajouter une action");
    sug.addEventListener("click",()=>{ const n=addSuggested(); renderPlan(); changed("plan"); U.toast(n?n+" action(s) ajoutée(s)":"Aucune nouvelle action à suggérer"); });
    add.addEventListener("click",()=>{ S.plan.push({id:U.uid("p"),a:"",qui:"Le jeune",quand:""}); renderPlan(true); changed("plan"); });
    br.append(sug,add); p.appendChild(br);
    p.appendChild(h("div",{class:"sub-h"},"Prochain rendez-vous"));
    const rdv=h("div",{class:"row2"});
    [["rdv_date","Date","date"],["rdv_heure","Heure","time"],["rdv_lieu","Lieu","text"]].forEach(([k,l,t])=>{ const d=h("div"); d.appendChild(h("label",{class:"flab",for:"f_"+k},l)); const i=h("input",{class:"f",id:"f_"+k,type:t}); i.value=S[k]||""; i.addEventListener("input",()=>{ S[k]=i.value; changed(k); }); d.appendChild(i); rdv.appendChild(d); });
    p.appendChild(rdv);
    p.appendChild(h("div",{class:"sub-h"},"Récapitulatif et message au jeune"));
    p.appendChild(h("div",{class:"sub-n"},"Montre le récapitulatif à l'écran, puis envoie le message (résumé, documents, rendez-vous)."));
    const yr=h("div",{class:"btn-row"}); const yb=h("button",{type:"button",class:"btn",id:"youthBtn"},"Montrer le récapitulatif au jeune"); yb.addEventListener("click",openYouth); yr.appendChild(yb); p.appendChild(yr);
    p.appendChild(h("div",{class:"msgbox",id:"msgBox"}));
    p.appendChild(h("div",{class:"sub-h"},"Notes de l'accompagnant·e"));
    const nt=h("textarea",{class:"f",id:"f_notes",placeholder:"Observations, à transmettre au ou à la responsable du programme"}); nt.value=S.notes||""; nt.addEventListener("input",()=>{ S.notes=nt.value; changed("notes"); }); p.appendChild(nt);
    p.appendChild(h("div",{class:"sub-h"},"Durée de l'entretien"));
    const dr=h("div",{class:"row2"}); const dd=h("div"); dd.appendChild(h("label",{class:"flab",for:"f_duree"},"Durée en minutes (calculée par le chrono, modifiable)")); const di=h("input",{class:"f",type:"number",min:0,max:300,id:"f_duree"}); di.value=S.duree||""; di.placeholder=(()=>{ const t=Object.values(S.clock.steps||{}).reduce((a,b)=>a+(+b||0),0); return t>60?String(Math.round(t/60)):"lance le chrono en haut"; })();
    di.addEventListener("input",()=>{ S.duree=di.value; opts.onChange&&opts.onChange("duree"); }); dd.appendChild(di); dr.appendChild(dd); p.appendChild(dr);
    p.appendChild(h("div",{class:"sub-h"},"Enregistrer"));
    p.appendChild(h("div",{class:"sub-n"},"La fiche est rangée dans le dossier du jeune (sous-dossier Fiches). Les réponses, elles, sont enregistrées automatiquement."));
    const er=h("div",{class:"btn-row"});
    const f1=h("button",{type:"button",class:"btn primary",id:"saveFiche"},"Enregistrer la fiche dans le dossier"); f1.addEventListener("click",()=>opts.saveFiche&&opts.saveFiche());
    const f2=h("button",{type:"button",class:"btn",id:"printFiche"},"Télécharger la fiche en PDF"); f2.addEventListener("click",()=>U.openHtml(IO.Fiche.entretien(S),true,"Premier_entretien_"+(U.slug(S.nom)||"jeune")+"_"+(S.date_ent||U.today())+".pdf"));
    const f3=h("button",{type:"button",class:"btn",id:"backJeune"},"Retour au dossier du jeune"); f3.addEventListener("click",()=>opts.onDone&&opts.onDone());
    er.append(f1,f2,f3); p.appendChild(er);
  }
  function addSuggested(){ const have=new Set(S.plan.map(r=>(r.a||"").trim().toLowerCase())); let n=0;
    IO.evaluate(S).actions.forEach(a=>{ if(!have.has(a.a.toLowerCase())){ const q=a.days!=null?(()=>{ const d=new Date(); d.setDate(d.getDate()+a.days); return d.toISOString().slice(0,10); })():(S.rdv_date&&a.qui==="Le jeune"?S.rdv_date:""); S.plan.push({id:U.uid("p"),a:a.a,qui:a.qui,quand:q,docs:!!a.docs}); have.add(a.a.toLowerCase()); n++; } }); return n; }
  function renderPlan(focusLast){ const box=$("planRows"); if(!box) return; box.innerHTML="";
    if(!S.plan.length){ box.appendChild(h("div",{class:"empty"},"Aucune action. « Ajouter les actions suggérées » part des réponses de l'entretien.")); return; }
    S.plan.forEach((r,i)=>{ if(!r.id) r.id=U.uid("p"); const row=h("div",{class:"pr"});
      const a=h("input",{class:"f a",id:"f_plan_a_"+i,placeholder:"Action","aria-label":"Action"}); a.value=r.a||"";
      const q=h("select",{class:"f",id:"f_plan_q_"+i,"aria-label":"Qui"}); q.innerHTML=REF.QUI.map(o=>'<option'+(o===r.qui?' selected':'')+'>'+o+'</option>').join("");
      const d=h("input",{class:"f",id:"f_plan_d_"+i,type:"date","aria-label":"Échéance"}); d.value=r.quand||"";
      const x=h("button",{type:"button",class:"icon-btn","aria-label":"Supprimer l'action"},"×");
      a.addEventListener("input",()=>{ r.a=a.value; changed("plan"); }); q.addEventListener("change",()=>{ r.qui=q.value; changed("plan"); }); d.addEventListener("input",()=>{ r.quand=d.value; changed("plan"); });
      x.addEventListener("click",()=>{ S.plan.splice(i,1); renderPlan(); changed("plan"); }); row.append(a,q,d,x); box.appendChild(row); });
    if(focusLast){ const l=box.querySelectorAll("input.a"); l[l.length-1].focus(); } }

  /* ---------- message */
  function renderMsg(){ const box=$("msgBox"); if(!box) return; const m=IO.Msg.premier(S); IO.UI.messageBox(box, m, S.mail, S.nom); }

  /* ---------- vue jeune */
  function openYouth(){
    const c=IO.ctxOf(S), ev=IO.evaluate(S), sw=IO.strengthsWarnings(S,c), k=REF.decisionKey(S.decision)||(ev.main.code!=="attente"?ev.main.code:null), a=IO.Msg.youthActions(S), d=IO.docsOf(S), goods=sw.goods.slice(0,5);
    let html='<div class="sheet-h"><h2 id="youthTitle">'+(U.firstName(S.nom)?esc(U.firstName(S.nom))+", voici ce qu'on a vu ensemble":"Ce qu'on a vu ensemble")+'</h2><button type="button" class="btn" id="youthClose">Fermer</button></div>';
    if(goods.length) html+='<div class="yb"><h3>Tes atouts</h3><ul>'+goods.map(g=>'<li>'+esc(g)+'</li>').join("")+'</ul></div>';
    if(k) html+='<div class="yb"><h3>Le programme qu\'on te propose</h3><p class="prog">'+esc(REF.PROGRAMMES[k].label)+'</p><p>'+esc(REF.PROGRAMMES[k].jeune)+'</p></div>'; else if(S.decision) html+='<div class="yb"><h3>La suite</h3><p class="prog">'+esc(S.decision)+'</p></div>';
    if(ev.extras.some(x=>x.startsWith("Pôle numérique"))) html+='<div class="yb"><h3>Le Pôle numérique</h3><p>Les lundis et jeudis de 13 h à 17 h : ordinateurs en libre accès et aide pour ton CV et tes démarches en ligne.</p></div>';
    if(a.length) html+='<div class="yb"><h3>Ce que tu prépares</h3><ul>'+a.map(r=>'<li>'+esc(r.a)+(r.quand?' (d\'ici le '+esc(U.fmtDate(r.quand))+')':'')+'</li>').join("")+'</ul></div>';
    if(d.length) html+='<div class="yb"><h3>À apporter</h3><ul>'+d.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
    if(S.rdv_date) html+='<div class="yb"><h3>Prochain rendez-vous</h3><p>'+esc(IO.Msg.rdvLine(S.rdv_date,S.rdv_heure,S.rdv_lieu))+'</p></div>';
    if(!goods.length&&!k&&!a.length&&!S.rdv_date) html+='<p>Le récapitulatif se remplit au fil de l\'entretien.</p>';
    $("youthSheet").innerHTML=html; youth.hidden=false; $("youthClose").addEventListener("click",()=>{ youth.hidden=true; }); $("youthClose").focus();
  }
  youth.addEventListener("click",e=>{ if(e.target===youth) youth.hidden=true; });

  /* ---------- navigation, chrono */
  function stepProgress(i){
    const st=STEPS[i], c=IO.ctxOf(S);
    if(st.custom==="proposition") return {done:S.decision&&S.adhesion?1:0,total:1,part:!!S.decision};
    if(st.custom==="cloture"){ const L=IO.completeness(S,c); return {done:L.filter(x=>x.ok).length,total:L.length}; }
    let total=0,done=0;
    st.items.forEach(it=>{ if(it.type==="check"&&it.plain) return; if(it.when&&!it.when(c)) return; if(IO.OPTIONAL.has(it.id)) return; total++; const v=S[it.id]; let ok;
      if(it.type==="cvcheck") ok=Object.values(S.cvcheck).some(Boolean); else if(it.type==="docs") ok=Object.values(S.docs).some(Boolean);
      else if(Array.isArray(v)) ok=v.length>0; else ok=v!==undefined&&v!==null&&v!==false&&String(v).trim()!==""; if(ok) done++; });
    return {done,total};
  }
  function tick(){ if(!S.clock.start){ lastTick=null; return; } const now=Date.now(); if(lastTick!=null&&document.visibilityState!=="hidden"){ const k=String(S.step||0); S.clock.steps[k]=(S.clock.steps[k]||0)+(now-lastTick)/1000; } lastTick=now; }
  function renderClock(){ const b=$("clockBtn"); if(!b) return;
    if(!S.clock.start){ b.textContent="Chrono"; b.classList.remove("over"); } else { const min=Math.floor((Date.now()-Date.parse(S.clock.start))/60000); b.textContent=min+" / "+totalBudget()+" min"; b.classList.toggle("over",min>totalBudget()); }
    STEPS.forEach((st,i)=>{ const el=$("bud-"+i); if(!el) return; const spent=Math.round((S.clock.steps[String(i)]||0)/60), bud=fmtBudget(st); el.textContent=S.clock.start?spent+" / "+bud+" min":"≈ "+bud+" min"; el.classList.toggle("over",!!S.clock.start&&spent>bud); }); }
  function goStep(i, o){ i=Math.max(0,Math.min(STEPS.length-1,i)); tick(); S.step=i; opts.onChange&&opts.onChange("step");
    panels.querySelectorAll(".panel").forEach(p=>p.classList.toggle("cur",+p.dataset.i===i));
    if(MODE==="all") $("step-"+STEPS[i].id).scrollIntoView({behavior:"smooth",block:"start"}); else if(!o||!o.keep) window.scrollTo({top:0});
    renderChrome();
    if(o&&o.focus){ const el=$("f_"+o.focus)||$("q_"+o.focus); if(el){ el.scrollIntoView({block:"center"}); if(el.focus) el.focus(); } } }
  function setMode(m){ MODE=m; root.classList.toggle("mode-step",m==="step"); root.classList.toggle("mode-all",m==="all");
    $("modeStep").setAttribute("aria-pressed",m==="step"?"true":"false"); $("modeAll").setAttribute("aria-pressed",m==="all"?"true":"false");
    try{ localStorage.setItem("insertio-grille-mode",m); }catch(e){} goStep(S.step||0,{keep:m==="all"}); }
  function renderChrome(){
    const steps=$("steps"); steps.innerHTML="";
    STEPS.forEach((st,i)=>{ const p=stepProgress(i); const cls=p.total&&p.done>=p.total?" done":(p.done>0||p.part)?" part":"";
      const b=h("button",{type:"button",class:"chip"+cls+(i===S.step?" cur":""),"aria-current":i===S.step?"step":null},'<b>'+(cls===" done"?"✓":(i+1))+'</b>'+esc(st.short)); b.addEventListener("click",()=>goStep(i)); steps.appendChild(b); });
    const cur=steps.querySelector(".cur"); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:"nearest",inline:"nearest"});
    const i=S.step||0; $("prevBtn").disabled=i===0;
    $("nextBtn").innerHTML=i===STEPS.length-1?'<span class="lbl-l">Dossier du jeune</span> →':'<span class="lbl-l">'+esc(STEPS[i+1].short)+'</span> →';
    $("midInfo").textContent=(i+1)+" / "+STEPS.length+" · "+STEPS[i].title; renderClock();
  }
  function renderWho(){ $("gWho").textContent=(S.nom||"").trim()||"Premier entretien"; const c=IO.ctxOf(S), b=[]; if(c.age!=null) b.push(c.age+" ans"); if(S.date_ent) b.push("premier entretien du "+U.fmtDate(S.date_ent)); if(opts.statusText) b.push(opts.statusText()); $("gWhoSub").textContent=b.join(" · "); }

  /* ---------- rafraîchissement */
  function refresh(){
    const c=IO.ctxOf(S), ev=IO.evaluate(S);
    Object.values(ITEMS).forEach(it=>{ if(it.when){ const q=$("q_"+it.id); if(q) q.hidden=!it.when(c); } if(it.hintFn){ const e=$("hint_"+it.id); if(e) e.textContent=it.hintFn(c); } });
    $("live").innerHTML='<span class="lbl">Proposition</span><span class="pill '+ev.main.code+'">'+esc(ev.main.label)+'</span>'+(S.decision?'<span class="lbl">Retenu</span><span class="pill num">'+esc(S.decision)+'</span>':'')+
      '<span class="lbl">Numérique</span><span class="pill num">'+(c.numLevel?esc(c.numLevel)+' · '+c.digital.n+'/8':'—')+'</span>'+(S.cv_has&&S.cv_has!=="non"?'<span class="lbl">CV</span><span class="pill num">'+c.cv.ok+'/'+c.cv.total+'</span>':'');
    const ai=$("ageInfo"); if(ai){ let x=""; if(c.age!=null){ if(c.age<16||c.age>30) x='<div class="alert"><b>'+c.age+' ans.</b> Hors du public statutaire d\'Insertio (16 à 30 ans) : à discuter en équipe.</div>'; else if(c.age<18) x='<div class="alert"><b>'+c.age+' ans, mineur·e.</b> Noter le représentant légal. Formation obligatoire jusqu\'à 18 ans (FO18) : vérifier que le jeune est inscrit·e dans une formation.</div>'; else x='<div class="alert info"><b>'+c.age+' ans.</b> Dans le public d\'Insertio (16 à 30 ans).</div>'; } ai.innerHTML=x; }
    const as=$("alertSituation"); if(as){ let x="";
      if(S.permis==="b_etu") x+='<div class="alert"><b>Permis B études.</b> Activité accessoire : 15 h par semaine au maximum pendant les cours, 40 h pendant les vacances, sur autorisation de l\'OCPM (formulaire E signé avec l\'employeur)'+(S.etu_origine==="hors"?". Hors UE/AELE : 6 mois après le début des études, lettre de l\'école et décision de l\'OCPM avant de commencer.":".")+' <a href="https://www.ge.ch/demander-permis-sejour-etudiant/activite-accessoire-etudiant" target="_blank" rel="noopener">Règles sur ge.ch</a></div>';
      else if(c.snf) x+='<div class="alert info"><b>Permis '+S.permis.toUpperCase()+'.</b> Public prioritaire de Tremplin.</div>';
      if(IO.isMinor(c)&&S.activite&&S.activite!=="formation") x+='<div class="alert crit"><b>FO18.</b> Mineur·e sans formation : la formation est obligatoire jusqu\'à 18 ans à Genève. Coordonner avec CAP Formations (DIP).</div>';
      as.innerHTML=x; }
    const ap=$("alertProjet"); if(ap) ap.innerHTML=c.studentOver?'<div class="alert"><b>Attention au taux.</b> '+esc(S.taux)+' % dépasse les 15 h hebdomadaires autorisées en période de cours avec un permis études (environ 36 % d\'un plein temps). À vérifier, surtout si le stage fait partie du cursus.</div>':"";
    const m=$("cvMeter"); if(m) m.innerHTML='<span>'+c.cv.ok+' conforme(s), '+c.cv.ko+' à retravailler</span><span class="track"><i style="width:'+Math.round(c.cv.ok/c.cv.total*100)+'%"></i></span><span>'+(c.cv.total-c.cv.ok-c.cv.ko)+' non vérifié(s)</span>';
    const sw=IO.strengthsWarnings(S,c), li=a=>a.map(x=>'<li>'+esc(x)+'</li>').join("");
    $("goodList").innerHTML=sw.goods.length?li(sw.goods):'<span class="empty">Rien pour l\'instant</span>';
    $("warnList").innerHTML=sw.warns.length?li(sw.warns):'<span class="empty">Rien pour l\'instant</span>';
    let body=""; if(ev.reasons.length) body+='<div><h4>Pourquoi</h4><ul>'+li(ev.reasons)+'</ul></div>'; if(ev.extras.length) body+='<div><h4>En complément</h4><ul>'+li(ev.extras)+'</ul></div>';
    if(c.cvSupport) body+='<div><h4>CV et lettre · '+esc(c.cvSupport.level)+'</h4><ul><li>'+esc(c.cvSupport.text)+'</li></ul></div>'; if(ev.vig.length) body+='<div class="vig"><h4>Points de vigilance</h4><ul>'+li(ev.vig)+'</ul></div>';
    $("propCard").innerHTML='<div class="top"><span class="pill '+ev.main.code+'">'+esc(ev.main.label)+'</span><p>'+esc(ev.main.why)+'</p></div>'+(body?'<div class="body">'+body+'</div>':'');
    const rb=$("rulesBox"), open=rb.open;
    rb.innerHTML='<summary>Comment la proposition est calculée ('+ev.fired.length+' règle'+(ev.fired.length>1?'s':'')+')</summary><div class="rulewrap"><table>'+(ev.fired.map(f=>'<tr><td>'+esc(f.id)+'</td><td>'+esc(f.t)+'</td></tr>').join("")||'<tr><td></td><td>Aucune règle pour l\'instant.</td></tr>')+'</table></div><p class="sub-n">Priorité : statut à vérifier, puis permis S, N, F (Tremplin), puis profil prêt (Passerelles), sinon Élan.</p>'; rb.open=open;
    const cl=$("checkList"); if(cl){ cl.innerHTML=""; IO.completeness(S,c).forEach(x=>{ const it=ITEMS[x.f]; const l=h("li",{class:x.ok?"ok":"ko"},'<span class="st">'+(x.ok?"✓":"!")+'</span><span class="t">'+esc(x.t)+'</span>');
      if(!x.ok){ const b=h("button",{type:"button"},"Compléter"); b.addEventListener("click",()=>goStep(it?it.step:x.step,{focus:x.f})); l.appendChild(b); } cl.appendChild(l); }); }
    renderMsg(); renderChrome(); renderWho();
  }
  function changed(id){
    if(["cv_has","cv_auteur","dipl","exp_level","permis","lm","projet","activite"].includes(id)) renderDocs();
    if(id==="format") renderClock();
    refresh(); opts.onChange&&opts.onChange(id);
  }

  /* ---------- événements */
  const notesBtn=$("notesBtn");
  function toggleNotes(f){ const open=f!==undefined?f:drawer.hidden; drawer.hidden=!open; notesBtn.setAttribute("aria-expanded",open?"true":"false"); if(open) $("f_quicknotes").focus(); }
  notesBtn.addEventListener("click",()=>toggleNotes());
  $("f_quicknotes").addEventListener("input",e=>{ S.quicknotes=e.target.value; opts.onChange&&opts.onChange("quicknotes"); });
  $("prevBtn").addEventListener("click",()=>goStep((S.step||0)-1));
  $("nextBtn").addEventListener("click",()=>{ if((S.step||0)>=STEPS.length-1){ opts.onDone&&opts.onDone(); return; } goStep((S.step||0)+1); });
  $("modeStep").addEventListener("click",()=>setMode("step")); $("modeAll").addEventListener("click",()=>setMode("all"));
  $("clockBtn").addEventListener("click",()=>{ if(!S.clock.start){ S.clock.start=U.now(); lastTick=Date.now(); U.toast("Chrono démarré"); } else { tick(); U.toast("Durée : "+Math.round((Date.now()-Date.parse(S.clock.start))/60000)+" min"); } renderClock(); opts.onChange&&opts.onChange("clock"); });
  const onKey=e=>{ if(e.key==="Escape"){ if(!youth.hidden) youth.hidden=true; else if(!drawer.hidden) toggleNotes(false); } };
  const onVis=()=>{ if(document.visibilityState==="hidden") tick(); else lastTick=S.clock.start?Date.now():null; };
  document.addEventListener("keydown",onKey); document.addEventListener("visibilitychange",onVis);
  const iv=setInterval(()=>{ if(S.clock.start){ tick(); renderClock(); opts.onChange&&opts.onChange("clock"); } },15000);

  build(); refresh(); setMode(MODE);
  return { destroy(){ tick(); clearInterval(iv); document.removeEventListener("keydown",onKey); document.removeEventListener("visibilitychange",onVis); root.classList.remove("grille","mode-step","mode-all"); },
           refreshWho:renderWho };
}
})();

</script>
<script>
/* InsertiO – équipe, profils, signature, logo, Calendly, rappels.
   Les réglages communs sont rangés dans le dossier partagé : Reglages/equipe.json et Reglages/logo.png.
   Le profil choisi (« qui utilise cet ordinateur ») reste propre à l'appareil. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, h=U.h, esc=U.esc;
const DEFAULTS={membres:[],lieu:"Locaux Insertio, rue Le-Royer 24, Les Acacias",adresse:"Rue Le-Royer 24, 1227 Les Acacias",tel:"+41 76 207 60 60",mail:"contact@insertio.ch",site:"insertio.ch",calendly:"https://calendly.com/contact-insertio",signature:true};
const EQUIPE=[
  {nom:"Ela Öztürk",fonction:"Coordinatrice des programmes d'insertion",mail:"e.ozturk@insertio.ch"},
  {nom:"Tulin Bulen",fonction:"Directrice et coach emploi",mail:"t.bulen@insertio.ch"},
  {nom:"Jannah Zidane",fonction:"",mail:"j.zidane@insertio.ch"},
];
const blobToData=b=>new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(b); });
async function hash(id,pin){ const d=new TextEncoder().encode("insertio:"+id+":"+pin); const b=await crypto.subtle.digest("SHA-256",d); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

const T = IO.Team = {
  data:Object.assign({},DEFAULTS), me:null, logoUrl:"logo.png", logoCustom:false, logoData:null,

  async load(){
    try{ const f=await IO.Store.getShared("equipe.json"); this.data=Object.assign({},DEFAULTS,f?JSON.parse(await f.text()):{}); }
    catch(e){ this.data=Object.assign({},DEFAULTS); }
    this.data.membres=this.data.membres||[];
    let id=null; try{ id=sessionStorage.getItem("insertio_me"); }catch(e){}
    this.me=this.data.membres.find(m=>m.id===id)||null;
    await this.loadLogo(); this.apply();
  },
  async save(){
    try{ await IO.Store.putShared("equipe.json",new Blob([JSON.stringify(this.data,null,2)],{type:"application/json"})); }
    catch(e){ U.toast("Réglages d'équipe non enregistrés : "+(e.message||e),5000); }
    if(this.me) this.me=this.data.membres.find(m=>m.id===this.me.id)||null;
    this.apply();
  },
  async loadLogo(){
    let f=null; try{ f=await IO.Store.getShared("logo.png"); }catch(e){}
    if(this.logoUrl.startsWith("blob:")) URL.revokeObjectURL(this.logoUrl);
    if(f){ this.logoUrl=URL.createObjectURL(f); this.logoCustom=true; this.logoData=await blobToData(f); }
    else { this.logoUrl="logo.png"; this.logoCustom=false; this.logoData=null; }
    const im=document.getElementById("logoImg"); if(im) im.src=this.logoUrl;
  },
  apply(){
    const S=IO.App.settings;
    if(this.me) S.accomp=this.me.nom;
    if(this.data.lieu) S.lieu=this.data.lieu;
    const b=document.getElementById("whoBtn");
    if(b){ b.hidden=!this.me; b.textContent=this.me?(U.firstName(this.me.nom)+" · changer"):""; }
  },
  async login(m){ this.me=m; try{ sessionStorage.setItem("insertio_me",m.id); }catch(e){} this.apply(); },
  async logout(){ this.me=null; try{ sessionStorage.removeItem("insertio_me"); }catch(e){} this.apply(); },
  needsLogin(){ return this.data.membres.length>0 && !this.me; },
  isMine(j){ if(!this.me) return true; const f=U.slug(U.firstName(this.me.nom)).toLowerCase(); return !!f && U.slug(j.referent||"").toLowerCase().split("_").includes(f); },

  /* ---------- Signature et messages */
  sigLines(){
    const m=this.me||{}, d=this.data;
    return [m.nom||"L'équipe Insertio", (m.fonction?m.fonction+" · ":"")+"Insertio Genève",
      [m.tel||d.tel, m.mail||d.mail].filter(Boolean).join(" · "), [d.adresse,d.site].filter(Boolean).join(" · ")].filter(Boolean);
  },
  stripSignoff(body){ const L=body.split("\n"); const last=(L[L.length-1]||"").trim(); if(/ – Insertio$/.test(last)||last==="L'équipe Insertio") L.pop(); return L.join("\n"); },
  withSig(body){ if(!this.data.signature) return body; return this.stripSignoff(body)+"\n"+this.sigLines().join("\n"); },
  html(body){
    const main=this.data.signature?this.stripSignoff(body):body;
    const para=esc(main).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>').replace(/\n/g,"<br>");
    let out='<div style="font-family:Segoe UI,Arial,sans-serif;font-size:11pt;color:#1C2135;line-height:1.45">'+para+'</div>';
    if(this.data.signature){
      const logo=this.logoCustom&&this.logoData?this.logoData:new URL("logo.png",location.href).href, L=this.sigLines();
      out+='<table cellpadding="0" cellspacing="0" style="margin-top:14px;font-family:Segoe UI,Arial,sans-serif;font-size:10pt;color:#545B76"><tr>'+
        '<td style="padding-right:14px;border-right:2px solid #5568DB;vertical-align:middle"><img src="'+logo+'" width="130" alt="InsertiO" style="display:block"></td>'+
        '<td style="padding-left:14px;vertical-align:middle"><b style="color:#1C2135;font-size:11pt">'+esc(L[0])+'</b><br>'+L.slice(1).map(x=>esc(x).replace(esc(this.data.site),'<a href="https://'+esc(this.data.site)+'" style="color:#5568DB">'+esc(this.data.site)+'</a>')).join("<br>")+'</td></tr></table>';
    }
    return out;
  },
  async copyRich(text, html){
    try{ await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]); U.toast("Copié avec le logo : colle-le dans un nouveau mail Outlook (Ctrl+V)",4500); }
    catch(e){ U.copy(text); }
  },
  calBase(){ return (this.me&&this.me.calendly)||this.data.calendly||""; },
  calLink(nom,mail){ const b=this.calBase(); if(!b) return ""; try{ const u=new URL(b); if(nom) u.searchParams.set("name",nom); if(mail) u.searchParams.set("email",mail); return u.toString(); }catch(e){ return b; } },
  insertCal(body,link){ if(!link) return body; const line="Pour choisir ton prochain rendez-vous, réserve le créneau qui te convient ici :\n"+link; const k=["\n\nSi tu as une question","\n\nÀ bientôt"].find(x=>body.includes(x)); return k?body.replace(k,"\n\n"+line+k):body+"\n\n"+line; },
  calMsg(j){ const L=["Bonjour"+(U.firstName(j.nom)?" "+U.firstName(j.nom):"")+",","","Pour fixer ton prochain rendez-vous chez Insertio, choisis le créneau qui te convient ici :",this.calLink(j.nom,j.mail),"","Tu recevras une confirmation par e-mail. Si aucun créneau ne te va, réponds simplement à ce message.","","À bientôt,",(IO.App.settings.accomp||"L'équipe")+" – Insertio"];
    return {subject:"Insertio – choisis ton prochain rendez-vous", body:L.join("\n")}; },
  reminder(j,r){ const when=U.daysFrom(r.date)===1?"demain":U.dateLong(r.date);
    const L=["Bonjour"+(U.firstName(j.nom)?" "+U.firstName(j.nom):"")+",","","Petit rappel : on se voit "+when+(r.heure?" à "+U.fmtTime(r.heure):"")+(r.lieu?", "+r.lieu:"")+(r.objet?" ("+r.objet.toLowerCase()+")":"")+".","","Si tu as un empêchement, préviens-nous en répondant à ce message.","","À bientôt,",(IO.App.settings.accomp||"L'équipe")+" – Insertio"];
    return {subject:"Insertio – rappel de ton rendez-vous "+(when==="demain"?"de demain":"du "+U.fmtDate(r.date)), body:L.join("\n")}; },
  mailLink(to,m){ return U.mailto(to,m.subject,this.withSig(m.body)); },

  /* ---------- Boîte « message au jeune » */
  messageBox(box, m, mail, nom){
    let withCal=false;
    const draw=()=>{
      box.innerHTML="";
      const body=withCal?this.insertCal(m.body,this.calLink(nom,mail)):m.body, full=this.withSig(body);
      box.appendChild(h("div",{class:"msg-sub"},'<span class="flab">Objet</span><span>'+esc(m.subject)+'</span>'));
      const pre=h("pre",{class:"msg"}); pre.textContent=full; box.appendChild(pre);
      if(this.calBase()){ const c=h("label",{class:"chk plain",style:"margin-top:8px"},'<input type="checkbox"'+(withCal?" checked":"")+'><span>Ajouter le lien Calendly pour que le jeune choisisse son prochain rendez-vous</span>'); c.querySelector("input").addEventListener("change",e=>{ withCal=e.target.checked; draw(); }); box.appendChild(c); }
      const r=h("div",{class:"btn-row"});
      const o=h("a",{class:"btn primary",href:U.mailto(mail,m.subject,full)},"Ouvrir dans Outlook");
      const c=h("button",{type:"button",class:"btn"},"Copier avec le logo"); c.addEventListener("click",()=>this.copyRich(full,this.html(body)));
      const s=h("button",{type:"button",class:"btn"},"Copier l'objet"); s.addEventListener("click",()=>U.copy(m.subject));
      r.append(o,c,s); box.appendChild(r);
      box.appendChild(h("p",{class:"sub-n"},(mail?"":"Ajoute l'e-mail du jeune dans son profil pour que le destinataire soit rempli. ")+"Dans Outlook, vérifie le champ « De » : choisis ton adresse @insertio.ch. Pour le logo : « Copier avec le logo », puis colle dans un nouveau mail."));
    };
    draw();
  },
  calButtons(j){
    if(!this.calBase()) return [];
    const a=h("a",{class:"btn",href:this.mailLink(j.mail,this.calMsg(j))},"Envoyer le lien Calendly");
    const b=h("a",{class:"btn",href:this.calLink(j.nom,j.mail),target:"_blank",rel:"noopener"},"Réserver sur Calendly");
    return [a,b];
  },

  /* ---------- Accueil : rappels de la veille */
  homeCards(js,card,list){
    const today=U.today(), d=new Date(); const dow=d.getDay(); const span=dow===5?3:dow===6?2:1;
    const items=[]; js.filter(j=>j.statut!=="clos").forEach(j=>IO.live(j.rdv).forEach(r=>{ const n=U.daysFrom(r.date); if(r.statut==="prevu"&&r.date>today&&n>=1&&n<=span&&!r.rappel) items.push({j,r}); }));
    if(!items.length) return;
    items.sort((a,b)=>(a.r.date+(a.r.heure||"")).localeCompare(b.r.date+(b.r.heure||"")));
    card("Rappels à envoyer",items.length,list(items,x=>{ const li=h("li",{class:"row"});
      li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom||"Sans nom")+'</b><span class="faint">'+esc(IO.App.rdvWhen(x.r))+(x.j.mail?"":' · <span class="warn-t">pas d\'e-mail</span>')+'</span></div>';
      const ra=h("div",{class:"racts"}); const a=h("a",{class:"btn primary",href:this.mailLink(x.j.mail,this.reminder(x.j,x.r))},"Envoyer le rappel");
      a.addEventListener("click",()=>{ x.r.rappel=U.now(); IO.touch(x.r); IO.App.save(x.j); setTimeout(()=>{ li.classList.add("done"); a.textContent="Rappel ouvert dans Outlook"; },300); });
      ra.append(a,h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier")); li.appendChild(ra); return li; },""));
  },

  /* ---------- Écran « Qui es-tu ? » */
  loginView(main){
    const box=h("div",{class:"login"});
    box.innerHTML='<img src="'+esc(this.logoUrl)+'" alt="InsertiO"><h1>Qui utilise l\'application ?</h1><p class="sub-n">Ton nom signe les messages et les comptes rendus. Tu vois tous les jeunes de l\'équipe.</p>';
    const list=h("div",{class:"who-list"}); box.appendChild(list);
    this.data.membres.forEach(m=>{ const b=h("button",{type:"button",class:"btn who"},'<b>'+esc(m.nom)+'</b><span class="faint">'+esc(m.fonction||m.mail||"")+'</span>');
      b.addEventListener("click",()=>{ if(!m.pin){ this.login(m).then(()=>IO.App.route()); return; } pinForm(m); }); list.appendChild(b); });
    const pinBox=h("form",{class:"pinbox",hidden:true}); box.appendChild(pinBox);
    const pinForm=m=>{ pinBox.hidden=false; pinBox.innerHTML='<label class="flab" for="pinIn">Code de '+esc(U.firstName(m.nom))+'</label><input class="f" id="pinIn" type="password" inputmode="numeric" autocomplete="off"><div class="btn-row"><button class="btn primary" type="submit">Entrer</button></div><p class="sub-n" id="pinErr"></p>';
      const i=pinBox.querySelector("#pinIn"); i.focus();
      pinBox.onsubmit=async e=>{ e.preventDefault(); if(await hash(m.id,i.value)===m.pin){ await this.login(m); IO.App.route(); } else { pinBox.querySelector("#pinErr").textContent="Code incorrect."; i.select(); } }; };
    box.appendChild(h("p",{class:"sub-n"},'<a href="#/reglages">Réglages de l\'équipe</a>'));
    main.appendChild(box);
  },

  /* ---------- Réglages */
  settingsSections(main){
    const save=U.debounce(()=>this.save(),700);
    // Mon profil
    const me=h("section",{class:"dcard"}); me.appendChild(h("h2",null,"Mon profil sur cet ordinateur"));
    if(this.me){ me.appendChild(h("p",null,'Connectée : <b>'+esc(this.me.nom)+'</b>'+(this.me.fonction?' · '+esc(this.me.fonction):''))); const b=h("button",{type:"button",class:"btn"},"Changer de profil"); b.addEventListener("click",async()=>{ await this.logout(); IO.App.go("#/"); }); me.appendChild(h("div",{class:"btn-row"})).appendChild(b); }
    else if(this.data.membres.length){ me.appendChild(h("p",{class:"sub-n"},"Aucun profil choisi sur cet ordinateur.")); const b=h("button",{type:"button",class:"btn primary"},"Choisir mon profil"); b.addEventListener("click",()=>IO.App.go("#/")); me.appendChild(h("div",{class:"btn-row"})).appendChild(b); }
    else me.appendChild(h("p",{class:"sub-n"},"Crée d'abord les profils de l'équipe ci-dessous."));
    main.appendChild(me);

    // Équipe
    const eq=h("section",{class:"dcard"}); eq.appendChild(h("h2",null,"Équipe et signatures"));
    eq.appendChild(h("p",{class:"sub-n"},IO.Store.mode==="folder"?"Enregistré dans le dossier partagé (Reglages / equipe.json) : les mêmes profils sur tous les ordinateurs.":"Enregistré sur cet ordinateur. Choisis le dossier partagé plus bas pour que l'équipe ait les mêmes profils partout."));
    const wrap=h("div",{class:"members"}); eq.appendChild(wrap);
    const render=()=>{ wrap.innerHTML="";
      if(!this.data.membres.length){ const b=h("button",{type:"button",class:"btn primary"},"Créer les profils d'Ela, Tulin et Jannah"); b.addEventListener("click",async()=>{ this.data.membres=EQUIPE.map(x=>Object.assign({id:U.uid("m"),tel:"",calendly:"",pin:""},x)); await this.save(); render(); }); wrap.appendChild(b); }
      this.data.membres.forEach((m,i)=>{ const c=h("div",{class:"member"}); const g=h("div",{class:"row2"});
        [["nom","Prénom et nom"],["fonction","Fonction (dans la signature)"],["mail","E-mail @insertio.ch"],["tel","Téléphone (sinon celui du bureau)"],["calendly","Lien Calendly personnel (facultatif)"]].forEach(([k,l])=>{ const d=h("div"); const id="m_"+i+"_"+k; d.appendChild(h("label",{class:"flab",for:id},l)); const inp=h("input",{class:"f",id,type:k==="mail"?"email":"text"}); inp.value=m[k]||""; inp.addEventListener("input",()=>{ m[k]=inp.value; save(); }); d.appendChild(inp); g.appendChild(d); });
        c.appendChild(g);
        const r=h("div",{class:"btn-row"});
        const pin=h("input",{class:"f",type:"password",inputmode:"numeric",placeholder:m.pin?"Nouveau code":"Code (facultatif)","aria-label":"Code d'accès",style:"max-width:180px"});
        const pb=h("button",{type:"button",class:"btn"},m.pin?"Changer le code":"Définir un code"); pb.addEventListener("click",async()=>{ if(!pin.value.trim()){ pin.focus(); return; } m.pin=await hash(m.id,pin.value.trim()); pin.value=""; await this.save(); U.toast("Code enregistré"); render(); });
        r.append(pin,pb);
        if(m.pin){ const rm=h("button",{type:"button",class:"btn"},"Retirer le code"); rm.addEventListener("click",async()=>{ m.pin=""; await this.save(); render(); }); r.appendChild(rm); }
        const del=h("button",{type:"button",class:"btn danger"},"Supprimer"); del.addEventListener("click",()=>IO.UI.confirmInline(del,"Supprimer "+(m.nom||"ce profil"),async()=>{ this.data.membres.splice(i,1); await this.save(); render(); })); r.appendChild(del);
        c.appendChild(r); wrap.appendChild(c); });
      if(this.data.membres.length){ const a=h("button",{type:"button",class:"btn"},"Ajouter une personne"); a.addEventListener("click",async()=>{ this.data.membres.push({id:U.uid("m"),nom:"",fonction:"",mail:"",tel:"",calendly:"",pin:""}); await this.save(); render(); }); wrap.appendChild(h("div",{class:"btn-row"})).appendChild(a); }
    };
    render();
    eq.appendChild(h("p",{class:"sub-n"},"Le code n'est pas un mot de passe sécurisé : il évite seulement de signer au nom d'une collègue par erreur. La vraie protection, c'est la session Windows de chacune et le partage du dossier OneDrive."));
    main.appendChild(eq);

    // Association
    const as=h("section",{class:"dcard"}); as.appendChild(h("h2",null,"Association, messages et Calendly"));
    const g=h("div",{class:"row2"});
    [["lieu","Lieu de rendez-vous par défaut"],["adresse","Adresse (signature)"],["tel","Téléphone du bureau"],["mail","E-mail de contact"],["site","Site internet"],["calendly","Lien Calendly de l'association"]].forEach(([k,l])=>{ const d=h("div"); d.appendChild(h("label",{class:"flab",for:"a_"+k},l)); const i=h("input",{class:"f",id:"a_"+k}); i.value=this.data[k]||""; i.addEventListener("input",()=>{ this.data[k]=i.value; save(); }); d.appendChild(i); g.appendChild(d); });
    as.appendChild(g);
    const sg=h("label",{class:"chk",style:"margin-top:12px"},'<input type="checkbox"'+(this.data.signature?" checked":"")+'><span>Ajouter ma signature (nom, fonction, coordonnées, logo) aux messages<br><small class="faint">À décocher si une signature est déjà réglée dans Outlook, pour éviter les doublons.</small></span>');
    sg.querySelector("input").addEventListener("change",e=>{ this.data.signature=e.target.checked; save(); }); as.appendChild(sg);
    as.appendChild(h("p",{class:"sub-n"},"Calendly : le lien s'ouvre avec le nom et l'e-mail du jeune déjà remplis. Avec l'offre gratuite de Calendly, les rappels automatiques ne sont pas inclus : l'accueil affiche donc chaque jour les rappels à envoyer pour les rendez-vous du lendemain."));
    main.appendChild(as);

    // Logo
    const lg=h("section",{class:"dcard"}); lg.appendChild(h("h2",null,"Logo"));
    const pv=h("div",{class:"logo-prev"}); const im=h("img",{src:this.logoUrl,alt:"Logo actuel"}); pv.appendChild(im);
    const lab=h("label",{class:"btn",for:"logoIn"},"Remplacer le logo"); const inp=h("input",{type:"file",id:"logoIn",accept:"image/png,image/jpeg,image/svg+xml",hidden:true});
    inp.addEventListener("change",async()=>{ const f=inp.files[0]; if(!f) return; try{ await IO.Store.putShared("logo.png",f); await this.loadLogo(); im.src=this.logoUrl; U.toast("Logo enregistré"); }catch(e){ U.toast("Logo non enregistré : "+(e.message||e),5000); } inp.value=""; });
    pv.append(lab,inp);
    if(this.logoCustom){ const rs=h("button",{type:"button",class:"btn"},"Revenir au logo InsertiO"); rs.addEventListener("click",async()=>{ await IO.Store.removeShared("logo.png"); await this.loadLogo(); im.src=this.logoUrl; }); pv.appendChild(rs); }
    lg.appendChild(pv); lg.appendChild(h("p",{class:"sub-n"},"Affiché en haut de l'application et dans la signature des messages."));
    main.appendChild(lg);
  },
};
document.addEventListener("click",e=>{ if(e.target&&e.target.id==="whoBtn"){ T.logout().then(()=>IO.App.go("#/")); } });
})();

</script>
<script>
/* InsertiO – application : navigation, accueil, dossiers des jeunes, suivis, documents, guide, réglages. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, $=U.$, Store=IO.Store;

/* ================================================================ État */
const App = IO.App = { settings:{accomp:"",lieu:"Locaux Insertio, rue Le-Royer 24, Les Acacias"}, jeunes:new Map(), view:null, status:"ok", installEvt:null };
const live = IO.live;

/* ================================================================ Composants partagés */
IO.UI = {
  messageBox(box, m, mail, nom){ IO.Team.messageBox(box, m, mail, nom); },
  confirmInline(btn, label, onYes){
    const wrap=h("span",{class:"confirm-inline"}); const y=h("button",{type:"button",class:"btn danger"},label||"Confirmer"); const n=h("button",{type:"button",class:"btn"},"Annuler");
    y.addEventListener("click",onYes); n.addEventListener("click",()=>wrap.replaceWith(btn)); wrap.append(y,n); btn.replaceWith(wrap); y.focus();
  },
};
function modal(html, onMount){
  const m=h("div",{class:"modal",role:"dialog","aria-modal":"true"}); const sh=h("div",{class:"sheet"},html); m.appendChild(sh); document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener("keydown",k); }; const k=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",k); m.addEventListener("click",e=>{ if(e.target===m) close(); });
  if(onMount) onMount(sh, close); return close;
}
function fileSize(n){ return n<1024?n+" o":n<1048576?Math.round(n/1024)+" ko":(n/1048576).toFixed(1)+" Mo"; }
function pill(code,label){ return '<span class="pill '+(code||"num")+'">'+esc(label)+'</span>'; }
function progPill(j){ const k=REF.decisionKey(j.programme); if(k) return pill(k,REF.PROGRAMMES[k].label); if(j.programme) return pill("num",j.programme); const e=IO.premier(j); if(e){ const ev=IO.evaluate(e.data); if(ev.main.code!=="attente") return pill(ev.main.code,ev.main.label+" ?"); } return '<span class="faint">—</span>'; }
function statutLabel(k){ return (REF.STATUTS.find(s=>s.k===k)||{}).t||k; }
function rdvWhen(r){ return U.dateShort(r.date)+(r.heure?" · "+U.fmtTime(r.heure):""); }

/* ================================================================ Enregistrement */
const timers=new Map();
function setSaveState(s, msg){ const el=$("saveState"); if(!el) return; el.dataset.state=s; el.textContent=msg||({saving:"Enregistrement…",ok:"Enregistré",err:"Non enregistré"})[s]; }
function save(j, now){
  j.updatedAt=U.now(); setSaveState("saving");
  clearTimeout(timers.get(j.id));
  const run=async()=>{ timers.delete(j.id);
    try{ const out=await Store.save(j); if(out!==j){ Object.keys(j).forEach(k=>{ if(!(k in out)) delete j[k]; }); Object.assign(j,out); }
      if(j._merged){ delete j._merged; U.toast("Dossier fusionné avec les modifications d'un·e collègue"); }
      App.jeunes.set(j.id,j); setSaveState("ok"); }
    catch(e){ console.error(e); setSaveState("err"); U.toast("Enregistrement impossible : "+(App.status!=="ok"?"reconnecte le dossier partagé (Réglages)":e.message||e),5000); } };
  if(now) return run(); timers.set(j.id,setTimeout(run,600));
}
async function flushAll(){ for(const [id,t] of timers){ clearTimeout(t); const j=App.jeunes.get(id); if(j) await save(j,true); } }
window.addEventListener("pagehide",()=>{ flushAll(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushAll(); });

async function loadAll(){ App.jeunes.clear(); if(App.status!=="ok") return; try{ (await Store.list()).forEach(j=>App.jeunes.set(j.id,j)); }catch(e){ console.error(e); U.toast("Lecture des dossiers impossible : "+(e.message||e),5000); } }
function sorted(){ return [...App.jeunes.values()].sort((a,b)=>(a.nom||"").localeCompare(b.nom||"","fr")); }

/* ================================================================ Navigation */
const routes=[
  [/^#?\/?$/, viewHome], [/^#\/jeunes$/, viewJeunes], [/^#\/j\/([^/]+)(?:\/(parcours|suivi|suivis|candidatures|documents|profil))?$/, viewJeune],
  [/^#\/j\/([^/]+)\/e\/([^/]+)$/, viewEntretien], [/^#\/j\/([^/]+)\/s\/([^/]+)$/, (m,id,sid)=>IO.Suivi.view(m,id,sid)], [/^#\/guide$/, viewGuide], [/^#\/reglages$/, viewSettings],
];
function go(hash){ IO.navHash=hash; route(); }
document.addEventListener("click",e=>{ const a=e.target.closest&&e.target.closest('a[href^="#/"]'); if(a){ e.preventDefault(); go(a.getAttribute("href")); } });
async function route(){
  if(App.view&&App.view.destroy) App.view.destroy(); App.view=null;
  await flushAll();
  const hsh=IO.navHash||"#/"; const main=$("main"); main.innerHTML=""; main.className="wrap";
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on", hsh===a.getAttribute("href") || (a.getAttribute("href")==="#/jeunes" && hsh.startsWith("#/j/"))));
  if(App.status==="ok" && IO.Team.needsLogin() && !hsh.startsWith("#/reglages")){ IO.Team.loginView(main); return; }
  for(const [re,fn] of routes){ const m=hsh.match(re); if(m){ App.view=(await fn(main,...m.slice(1)))||null; window.scrollTo(0,0); return; } }
  go("#/");
}


function banner(main){
  if(App.status==="permission"){ const b=h("div",{class:"alert crit banner"},'<b>Dossier partagé à reconnecter.</b> Pour des raisons de sécurité, le navigateur demande ton accord à chaque ouverture. '); const btn=h("button",{type:"button",class:"btn primary"},"Reconnecter"); btn.addEventListener("click",async()=>{ App.status=await Store.reconnect(); if(App.status==="ok"){ await IO.Team.load(); await loadAll(); route(); } }); b.appendChild(btn); main.appendChild(b); return true; }
  if(App.status==="none"){ main.appendChild(h("div",{class:"alert banner"},'<b>Aucun dossier choisi.</b> Va dans <a href="#/reglages">Réglages</a> pour choisir le dossier partagé ou utiliser cet appareil.')); return true; }
  return false;
}

/* ================================================================ Accueil */
function viewHome(main){
  const blocked=banner(main);
  const hello=h("div",{class:"page-h"},'<div><h1>'+(App.settings.accomp?"Bonjour "+esc(U.firstName(App.settings.accomp)):"Bonjour")+'</h1><p class="sub-n">'+esc(new Date().toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))+' · '+esc(Store.label)+'</p></div>');
  const acts=h("div",{class:"btn-row"}); const nb=h("button",{type:"button",class:"btn primary",id:"newJeune"},"Nouveau jeune"); nb.addEventListener("click",newJeuneDialog); nb.disabled=blocked; acts.appendChild(nb);
  hello.appendChild(acts); main.appendChild(hello);
  if(Store.mode!=="folder") main.appendChild(h("div",{class:"alert info"},'<b>Dossiers enregistrés sur cet ordinateur seulement.</b> Pour les partager avec l\'équipe et les retrouver dans l\'Explorateur de fichiers, choisis le dossier OneDrive commun dans <a href="#/reglages">Réglages</a>.'));
  if(blocked) return;
  if(!App.settings.accomp) main.appendChild(h("div",{class:"alert info"},'<b>Première utilisation ?</b> Indique ton nom dans <a href="#/reglages">Réglages</a> : il signe les messages aux jeunes. Le <a href="#/guide">guide</a> explique le déroulé des entretiens.'));
  const js=sorted(); const today=U.today();
  const allRdv=[]; js.forEach(j=>live(j.rdv).forEach(r=>{ if(r.date) allRdv.push({j,r}); }));
  const up=allRdv.filter(x=>x.r.statut==="prevu"&&x.r.date>=today&&U.daysFrom(x.r.date)<=14).sort((a,b)=>(a.r.date+(a.r.heure||"")).localeCompare(b.r.date+(b.r.heure||"")));
  const past=allRdv.filter(x=>x.r.statut==="prevu"&&x.r.date<today).sort((a,b)=>b.r.date.localeCompare(a.r.date));
  const late=[]; js.filter(j=>j.statut!=="clos").forEach(j=>live(j.actions).forEach(a=>{ if(!a.done&&a.quand&&a.quand<today) late.push({j,a}); }));
  const grid=h("div",{class:"dash"});
  const card=(title,count,body)=>{ const c=h("section",{class:"dcard"}); c.appendChild(h("h2",null,esc(title)+(count!=null?' <span class="count">'+count+'</span>':''))); c.appendChild(body); grid.appendChild(c); };
  const list=(items,render,empty)=>{ const ul=h("ul",{class:"rows"}); if(!items.length) ul.appendChild(h("li",{class:"empty"},esc(empty))); items.forEach(x=>ul.appendChild(render(x))); return ul; };
  const rdvRow=(x,late)=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom||"Sans nom")+'</b><span class="faint">'+esc(rdvWhen(x.r))+(x.r.objet?" · "+esc(x.r.objet):"")+'</span></div>';
    const a=h("div",{class:"racts"}); const s=h("button",{type:"button",class:"btn"+(late||x.r.date===today?" primary":"")},"Faire le suivi"); s.addEventListener("click",()=>startSuivi(x.j,x.r.id));
    const o=h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier"); if(late||x.r.date===today) a.appendChild(s); a.appendChild(o); li.appendChild(a); return li; };
  card("Rendez-vous des deux prochaines semaines",up.length,list(up,x=>rdvRow(x,false),"Aucun rendez-vous prévu."));
  if(past.length) card("Rendez-vous passés à renseigner",past.length,list(past,x=>rdvRow(x,true),""));
  card("Actions en retard",late.length,list(late.slice(0,12),x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.a.a)+'</b><span class="faint">'+esc(x.j.nom)+' · '+esc(x.a.qui)+' · prévu le '+esc(U.fmtDate(x.a.quand))+'</span></div>'; const o=h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier"); const r=h("div",{class:"racts"}); r.appendChild(o); li.appendChild(r); return li; },"Rien en retard."));
  const recent=js.filter(j=>j.statut!=="clos").sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,8);

<script>
/* InsertiO – suivi de l'accompagnement sur plusieurs mois :
   parcours (programme, dates, bilans), objectifs gradués, entretiens de suivi guidés, candidatures. */
(function(){
"use strict";
const IO=window.IO, U=IO.U, REF=IO.REF, h=U.h, esc=U.esc, $=U.$, live=IO.live;
const App=()=>IO.App;

/* ================================================================ Référentiels */
REF.MODELES=[
  {k:"suivi",t:"Entretien de suivi",d:"45 min · déroulé complet"},
  {k:"court",t:"Point rapide ou appel",d:"10 à 15 min · actions et prochaine étape"},
  {k:"bilan_mi",t:"Bilan à mi-parcours",d:"Objectifs, auto-évaluation, ajustements"},
  {k:"bilan_fin",t:"Bilan de fin",d:"Résultats, situation à la sortie, suite"},
];
REF.modeleLabel=k=>(REF.MODELES.find(m=>m.k===k)||REF.MODELES[0]).t;
REF.CANAUX=["Sur place","Téléphone","Visio","Message"];
REF.HUMEUR=[{k:1,t:"Difficile"},{k:2,t:"Moyen"},{k:3,t:"Ça va"},{k:4,t:"Bien"},{k:5,t:"Très bien"}];
REF.NIVEAUX=[{k:0,t:"Pas commencé"},{k:1,t:"Démarré"},{k:2,t:"En progrès"},{k:3,t:"Presque"},{k:4,t:"Atteint"}];
REF.DOMAINES=[{k:"projet",t:"Projet professionnel"},{k:"cv",t:"CV et candidatures"},{k:"emploi",t:"Emploi, stage, apprentissage"},{k:"entretiens",t:"Entretiens d'embauche"},{k:"admin",t:"Démarches et droits"},{k:"num",t:"Numérique"},{k:"francais",t:"Français"},{k:"autre",t:"Autre"}];
REF.AUTOEVAL=[{k:"confiance",t:"J'ai confiance en moi"},{k:"projet",t:"Je sais quel métier je vise"},{k:"recherche",t:"Je sais chercher un emploi ou un stage"},{k:"codes",t:"Je connais les codes du travail en Suisse"},{k:"num",t:"Je me débrouille avec les outils numériques"},{k:"entretien",t:"Je suis à l'aise en entretien"}];
REF.SORTIE=[{k:"emploi",t:"Emploi"},{k:"apprent",t:"Apprentissage"},{k:"stage",t:"Stage"},{k:"formation",t:"Formation ou études"},{k:"mesure",t:"Autre mesure d'insertion"},{k:"recherche",t:"En recherche, avec un projet clair"},{k:"sans",t:"Sans solution pour l'instant"},{k:"abandon",t:"A arrêté l'accompagnement"}];
REF.CAND_STATUTS=[{k:"prevue",t:"À envoyer"},{k:"envoyee",t:"Envoyée"},{k:"relancee",t:"Relancée"},{k:"entretien",t:"Entretien obtenu"},{k:"acceptee",t:"Acceptée"},{k:"refusee",t:"Refusée"},{k:"sans",t:"Sans réponse"}];
REF.CAND_OPEN=["prevue","envoyee","relancee","entretien"];
REF.CAND_TYPES=["Emploi","Stage","Apprentissage","Job","Formation"];
REF.PROG_DUREE={tremplin:5,elan:3,passerelles:null};
REF.REVIEW=[{k:"fait",t:"Fait"},{k:"cours",t:"En cours"},{k:"pas",t:"Pas fait"}];
REF.RDV_OBJETS=["Entretien de suivi","Point rapide","Bilan à mi-parcours","Bilan de fin","Atelier","Autre"];
const cstat=k=>(REF.CAND_STATUTS.find(x=>x.k===k)||{}).t||k;

/* ================================================================ Temps d'entretien */
REF.MODELE_BUDGET={suivi:45,court:15,bilan_mi:60,bilan_fin:60};
REF.SEC_BUDGET={suivi:{accueil:5,actions:10,objectifs:5,travail:15,documents:2,suite:5,message:3},court:{accueil:3,actions:5,suite:4,message:3},
  bilan_mi:{accueil:5,actions:8,objectifs:10,travail:10,bilan:15,documents:2,suite:5,message:5},bilan_fin:{accueil:5,actions:5,objectifs:10,travail:5,bilan:20,documents:2,suite:8,message:5}};
/* Durée d'un suivi en minutes : saisie manuelle prioritaire, sinon chrono. */
IO.svMinutes=sv=>{ if(sv.duree!==undefined&&sv.duree!==""&&sv.duree!=null) return +sv.duree; const c=sv.clock; if(!c) return null; let t=c.elapsed||0; if(c.since) t+=(Date.now()-Date.parse(c.since))/1000; return t>0?Math.round(t/60):null; };
/* Durée du premier entretien : temps passé dans les étapes de la grille (chrono démarré). */
IO.entMinutes=e=>{ if(!e||!e.data) return null; const d=e.data; if(d.duree!==undefined&&d.duree!==""&&d.duree!=null) return +d.duree; const st=(d.clock&&d.clock.steps)||{}; const t=Object.values(st).reduce((a,b)=>a+(+b||0),0); return t>60?Math.round(t/60):null; };
IO.timeStats=j=>{ const e=IO.premier(j), pm=IO.entMinutes(e); const sm=live(j.suivis).map(IO.svMinutes).filter(x=>x!=null&&x>0);
  const total=(pm||0)+sm.reduce((a,b)=>a+b,0); return {premier:pm,suivis:sm,moySuivi:sm.length?Math.round(sm.reduce((a,b)=>a+b,0)/sm.length):null,total}; };
const fmtMin=m=>m==null?"—":m<60?m+" min":Math.floor(m/60)+" h "+String(m%60).padStart(2,"0");
IO.fmtMin=fmtMin;

/* ================================================================ Logique */
function ensure(j){ j.objectifs=j.objectifs||[]; j.candidatures=j.candidatures||[]; j.parcours=j.parcours||{}; j.suivis=j.suivis||[]; j.actions=j.actions||[]; j.rdv=j.rdv||[]; j.docs=j.docs||{}; return j; }
function addMonths(iso,m){ const d=new Date(iso+"T12:00"); const whole=Math.floor(m); d.setMonth(d.getMonth()+whole); d.setDate(d.getDate()+Math.round((m-whole)*30)); return d.toISOString().slice(0,10); }
IO.parcours=j=>{
  ensure(j); const k=REF.decisionKey(j.programme), p=j.parcours, e=IO.premier(j);
  const debut=p.debut||(e&&e.data.date_ent)||"";
  const mois=(p.duree!==undefined&&p.duree!=="")?+p.duree:(k?REF.PROG_DUREE[k]:null);
  const fin=debut&&mois?addMonths(debut,mois):"", mi=debut&&mois?addMonths(debut,mois/2):"";
  const sv=live(j.suivis).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const done=sv.filter(s=>s.presence==="present");
  const elapsed=debut&&fin?Math.max(0,Math.min(1,(Date.now()-Date.parse(debut+"T12:00"))/(Date.parse(fin+"T12:00")-Date.parse(debut+"T12:00")))):null;
  return {k,debut,mois,fin,mi,elapsed,semaine:debut?Math.max(1,Math.floor((Date.now()-Date.parse(debut+"T12:00"))/(7*864e5))+1):null,
    biMi:sv.find(s=>s.modele==="bilan_mi"),biFin:sv.find(s=>s.modele==="bilan_fin"),suivis:sv,realises:done};
};
IO.bilanDu=j=>{ if(j.statut==="clos") return null; const p=IO.parcours(j);
  if(p.mi&&!p.biMi&&U.daysFrom(p.mi)<=14) return {modele:"bilan_mi",date:p.mi};
  if(p.fin&&!p.biFin&&U.daysFrom(p.fin)<=14) return {modele:"bilan_fin",date:p.fin}; return null; };
IO.objLevel=o=>{ const ev=(o.evals||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))); const last=ev[ev.length-1]; return {niveau:last?last.niveau:0,date:last?last.date:"",history:ev}; };
IO.suggestObjectifs=s=>{
  if(!s) return [];
  const c=IO.ctxOf(s), L=[], ch=c.cherche;
  if(s.projet==="aucun"||s.projet==="pistes") L.push({domaine:"projet",t:"Clarifier et valider un projet professionnel réaliste"});
  if(s.cv_has!=="ajour"||c.cv.ko>=2||s.cv_auteur==="autre") L.push({domaine:"cv",t:"Avoir un CV et une lettre aux standards suisses, et savoir les adapter"});
  const dom=s.domaine?" ("+s.domaine+")":"";

  const fin=h("div",{id:"finBox"}); s5.appendChild(fin);
  const g5=h("div",{class:"row2"}); fin.appendChild(g5);
  const dso=h("div"); dso.appendChild(h("label",{class:"flab",for:"s_sortie"},"Situation à la sortie")); const so=h("select",{class:"f",id:"s_sortie"}); so.innerHTML='<option value="">—</option>'+REF.SORTIE.map(x=>'<option value="'+x.k+'"'+(x.k===sv.sortie?" selected":"")+'>'+x.t+'</option>').join(""); so.addEventListener("change",()=>{ sv.sortie=so.value; save("sortie"); }); dso.appendChild(so); g5.appendChild(dso);
  field(g5,"suite","La suite (orientation, relais, contact gardé)","text");
  const clo=h("label",{class:"chk",for:"s_clore"},'<input type="checkbox" id="s_clore"'+(j.statut==="clos"?" checked":"")+'><span>Clore le dossier après ce bilan<br><small class="faint">Le dossier reste consultable dans la liste « Clos ».</small></span>');
  clo.querySelector("input").addEventListener("change",e=>{ j.statut=e.target.checked?"clos":"actif"; save("statut"); }); fin.appendChild(clo);

  /* 6. Documents */
  const s6=sec("documents","6. Documents",2,()=>!absent());
  const db=h("div"); s6.appendChild(db);
  function renderDocs(){ db.innerHTML=""; const pend=Object.entries(j.docs||{}).filter(([k,v])=>v&&v.demande&&(!v.recu||v.recuIn===sv.id));
    if(!pend.length) db.appendChild(h("p",{class:"empty"},"Aucun document en attente."));
    const ul=h("ul",{class:"rows"}); pend.forEach(([k,v])=>{ const li=h("li",{class:"row"}); const id="sd_"+U.slug(k); li.innerHTML='<label class="chk plain rmain" for="'+id+'"><input type="checkbox" id="'+id+'"'+(v.recu?" checked":"")+'><span>'+esc(v.label||REF.docLabel(k))+'</span></label>';
      li.querySelector("input").addEventListener("change",e=>{ v.recu=e.target.checked; v.recuIn=v.recu?sv.id:""; v.updatedAt=U.now(); save("docs"); }); ul.appendChild(li); }); db.appendChild(ul);
    const w=h("div",{class:"inline-add"}); const i=h("input",{class:"f",placeholder:"Nouveau document à demander","aria-label":"Nouveau document à demander"}); const b=h("button",{type:"button",class:"btn"},"Demander"); b.addEventListener("click",()=>{ if(!i.value.trim()) return; j.docs["autre-"+U.uid("d")]={demande:true,recu:false,label:i.value.trim(),source:sv.id,updatedAt:U.now()}; save("docs"); renderDocs(); });
    const f=h("button",{type:"button",class:"btn"},"Ajouter des fichiers au dossier"); f.addEventListener("click",()=>A.pickFiles(j)); w.append(i,b,f); db.appendChild(w); }
  renderDocs();

  /* 7. Prochaines étapes */
  const s7=sec("suite","7. Prochaines étapes",5,()=>true);
  s7.appendChild(h("div",{class:"label"},"Nouvelles actions"));
  const nl=h("ul",{class:"rows"}); s7.appendChild(nl);
  function renderNew(){ nl.innerHTML=""; live(j.actions).filter(a=>a.source===sv.id).forEach(a=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(a.a)+'</b><span class="faint">'+esc(a.qui)+(a.quand?" · d'ici le "+esc(U.fmtDate(a.quand)):"")+'</span></div>'; const x=h("button",{type:"button",class:"icon-btn","aria-label":"Retirer"},"×"); x.addEventListener("click",()=>{ a.deleted=true; IO.touch(a); save("act"); renderNew(); }); li.appendChild(x); nl.appendChild(li); }); }
  renderNew(); s7.appendChild(A.actionAdder(j,sv,()=>{ renderNew(); renderMsg(); }));
  s7.appendChild(h("div",{class:"label q"},"Prochain rendez-vous"));
  const du=IO.bilanDu(j); if(du&&du.modele!==sv.modele) s7.appendChild(h("div",{class:"alert info"},'<b>'+esc(REF.modeleLabel(du.modele))+'</b> prévu vers le '+esc(U.fmtDate(du.date))+' : pense à le planifier.'));
  const g7=h("div",{class:"row2"}); s7.appendChild(g7);
  field(g7,"rdv_date","Date","date"); field(g7,"rdv_heure","Heure","time");
  const dob=h("div"); dob.appendChild(h("label",{class:"flab",for:"s_rdv_objet"},"Objet")); const ob=h("select",{class:"f",id:"s_rdv_objet"}); ob.innerHTML=REF.RDV_OBJETS.map(x=>'<option'+(x===sv.rdv_objet?" selected":"")+'>'+x+'</option>').join(""); ob.addEventListener("change",()=>{ sv.rdv_objet=ob.value; save("rdv"); }); dob.appendChild(ob); g7.appendChild(dob);
  field(g7,"rdv_lieu","Lieu","text");

  /* 8. Message et compte rendu */
  const s8=sec("message","8. Message et compte rendu",5,()=>true);
  const rs=h("div",{class:"q"}); field(rs,"resume","Résumé pour le jeune (repris dans le message)","textarea",{placeholder:"Ex. On a terminé ton CV et choisi trois entreprises à contacter."}); s8.appendChild(rs);
  const ns=h("div",{class:"q"}); field(ns,"notes","Notes de l'accompagnant·e (internes)","textarea",{placeholder:"Observations, points de vigilance, à transmettre à l'équipe"}); s8.appendChild(ns);
  const mb=h("div",{class:"msgbox q"}); s8.appendChild(mb);
  function renderMsg(){ IO.UI.messageBox(mb,IO.Msg.suivi(j,sv),j.mail,j.nom); }
  const er=h("div",{class:"btn-row"});
  const f1=h("button",{type:"button",class:"btn primary",id:"saveCR"},"Enregistrer le compte rendu dans le dossier"); f1.addEventListener("click",async()=>{ try{ await A.flushAll(); await IO.Store.addFile(j.id,"Fiches",new Blob([IO.Fiche.suivi(j,sv)],{type:"text/html"}),(sv.date||U.today())+"_"+U.slug(REF.modeleLabel(sv.modele)).toLowerCase()+"_"+sv.id.slice(-4)+".html",true); U.toast("Compte rendu enregistré dans « Fiches »"); }catch(e){ U.toast("Non enregistré : "+(e.message||e),5000); } });
  const f2=h("button",{type:"button",class:"btn"},"Télécharger le compte rendu en PDF"); f2.addEventListener("click",()=>U.openHtml(IO.Fiche.suivi(j,sv),true,U.slug(REF.modeleLabel(sv.modele))+"_"+(U.slug(j.nom)||"jeune")+"_"+(sv.date||U.today())+".pdf"));
  const f3=h("a",{class:"btn",href:"#/j/"+j.id},"Retour au parcours");
  const f4=h("button",{type:"button",class:"btn danger"},"Supprimer ce suivi"); f4.addEventListener("click",()=>IO.UI.confirmInline(f4,"Supprimer le suivi",()=>{ sv.deleted=true; IO.touch(sv); const r=j.rdv.find(x=>x.id==="rdv-"+sv.id); if(r){ r.deleted=true; IO.touch(r); } A.save(j); A.go("#/j/"+j.id+"/suivis"); }));
  er.append(f1,f2,f3,f4); s8.appendChild(er);

  /* Navigation et visibilité */
  function applyVis(){ let n=0; nav.innerHTML="";
    sections.forEach(s=>{ const on=s.show(); s.el.hidden=!on; if(!on) return; n++; const t=s.el.querySelector("h2"); t.textContent=n+". "+s.title.replace(/^\d+\.\s*/,"");
      const a=h("a",{href:"#",class:"chip"},'<b>'+n+'</b>'+esc(s.title.replace(/^\d+\.\s*/,""))); a.addEventListener("click",e=>{ e.preventDefault(); s.el.scrollIntoView({behavior:"smooth",block:"start"}); }); nav.appendChild(a); });
    $("humBox").hidden=absent(); $("finBox").hidden=sv.modele!=="bilan_fin"; renderMsg(); }
  /* Chrono : démarrer, pause, terminer ; temps par étape selon la section visible */
  let curSec="accueil", lastT=null;
  const running=()=>!!sv.clock.since;
  function tick(){ const now=Date.now(); if(running()&&lastT!=null&&document.visibilityState!=="hidden"){ sv.clock.sections[curSec]=(sv.clock.sections[curSec]||0)+(now-lastT)/1000; } lastT=running()?now:null; }
  function elapsedMin(){ let t=sv.clock.elapsed||0; if(sv.clock.since) t+=(Date.now()-Date.parse(sv.clock.since))/1000; return Math.floor(t/60); }
  function renderClock(){
    const bud=REF.MODELE_BUDGET[sv.modele]||45, m=elapsedMin(), started=sv.clock.started;
    clk.innerHTML="";
    const lab=h("span",{class:"clk"+(m>bud?" over":"")},started?(m+" / "+bud+" min"):"≈ "+bud+" min");
    clk.appendChild(lab);
    const btn=(t,cls,fn)=>{ const b=h("button",{type:"button",class:"btn "+(cls||"")},t); b.addEventListener("click",fn); clk.appendChild(b); };
    if(!started) btn("Démarrer le chrono","primary",()=>{ sv.clock.started=U.now(); sv.clock.since=U.now(); lastT=Date.now(); save("clock"); renderClock(); });
    else if(running()){ btn("Pause","",()=>{ tick(); sv.clock.elapsed=(sv.clock.elapsed||0)+(Date.now()-Date.parse(sv.clock.since))/1000; sv.clock.since=null; lastT=null; save("clock"); renderClock(); });
      btn("Terminer","",()=>{ tick(); sv.clock.elapsed=(sv.clock.elapsed||0)+(Date.now()-Date.parse(sv.clock.since))/1000; sv.clock.since=null; lastT=null; sv.duree=String(Math.max(1,Math.round(sv.clock.elapsed/60))); dI.value=sv.duree; save("clock"); renderClock(); U.toast("Durée enregistrée : "+fmtMin(+sv.duree)); }); }
    else btn("Reprendre","",()=>{ sv.clock.since=U.now(); lastT=Date.now(); sv.duree=""; dI.value=""; save("clock"); renderClock(); });
    const dl=h("label",{class:"dur"},"Durée (min) "); const dI2=dI; dl.appendChild(dI2); clk.appendChild(dl);
    sections.forEach(sx=>{ const el=sx.el.querySelector(".budget"); if(!el) return; const b=(REF.SEC_BUDGET[sv.modele]||{})[sx.id]; const spent=Math.round((sv.clock.sections[sx.id]||0)/60);
      el.textContent= started&&spent ? spent+(b?" / "+b:"")+" min" : (b?"≈ "+b+" min":""); el.classList.toggle("over",!!(b&&spent>b)); });
  }
  const dI=h("input",{class:"f sm",type:"number",min:0,max:300,id:"s_duree","aria-label":"Durée de l'entretien en minutes",placeholder:"auto"}); dI.value=sv.duree||"";
  dI.addEventListener("input",()=>{ sv.duree=dI.value; save("notes"); });
  const io=("IntersectionObserver" in window)?new IntersectionObserver(ents=>{ ents.forEach(en=>{ if(en.isIntersecting){ tick(); curSec=en.target.id.replace("sv-",""); } }); },{rootMargin:"-30% 0px -60% 0px"}):null;
  sections.forEach(sx=>io&&io.observe(sx.el));
  const iv=setInterval(()=>{ if(running()){ tick(); renderClock(); save("clock"); } },10000);
  const onVis=()=>{ if(document.visibilityState==="hidden") tick(); else lastT=running()?Date.now():null; }; document.addEventListener("visibilitychange",onVis);
  if(running()) lastT=Date.now();
  const _applyVis=applyVis; applyVis=function(){ _applyVis(); renderClock(); };
  applyVis(); save("init");
  return { destroy(){ tick(); if(running()) save("clock"); clearInterval(iv); io&&io.disconnect(); document.removeEventListener("visibilitychange",onVis); } };
};

/* ---------------- Tableau de statistiques (Réglages) */
S.statsPanel=(box,jeunes)=>{
  const js=jeunes.map(ensure), all=js.length, act=js.filter(j=>j.statut==="actif").length;
  const prem=js.filter(j=>IO.premier(j)).length, svs=js.flatMap(j=>live(j.suivis)), ts=js.map(IO.timeStats);
  const pm=ts.map(t=>t.premier).filter(x=>x!=null), sm=ts.flatMap(t=>t.suivis), tot=ts.reduce((a,t)=>a+(t.total||0),0);
  const rdv=js.flatMap(j=>live(j.rdv)), hon=rdv.filter(r=>r.statut==="fait").length, man=rdv.filter(r=>r.statut==="absent"||r.statut==="excuse").length;
  const sorties=js.filter(j=>j.sortie), pos=sorties.filter(j=>["emploi","apprent","stage","formation"].includes(j.sortie)).length;
  const objs=js.flatMap(j=>live(j.objectifs)), cand=js.flatMap(j=>live(j.candidatures));
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const k=(n,l)=>'<div class="kpi"><b>'+n+'</b><span>'+esc(l)+'</span></div>';
  const progs={}; js.forEach(j=>{ const p=j.programme||"Non défini"; progs[p]=(progs[p]||0)+1; });
  box.innerHTML='<div class="kpis">'+k(all,"jeunes au total")+k(act,"dossiers actifs")+k(prem,"premiers entretiens")+k(svs.length,"suivis")+
    k(fmtMin(tot||null),"temps d'entretien total")+k(fmtMin(avg(pm)),"durée moyenne d'un premier entretien")+k(fmtMin(avg(sm)),"durée moyenne d'un suivi")+
    k(hon+man?Math.round(hon/(hon+man)*100)+" %":"—","présence aux rendez-vous")+k(objs.length?Math.round(objs.filter(o=>IO.objLevel(o).niveau===4).length/objs.length*100)+" %":"—","objectifs atteints")+
    k(cand.filter(c=>c.statut!=="prevue").length,"candidatures envoyées")+k(cand.filter(c=>c.statut==="acceptee").length,"candidatures acceptées")+k(sorties.length?pos+" / "+sorties.length:"—","sorties vers emploi, apprentissage, stage ou formation")+'</div>'+
    '<p class="sub-n" style="margin-top:8px">Par programme : '+Object.entries(progs).map(([p,n])=>esc(p)+" "+n).join(" · ")+'. Le temps compte le premier entretien (chrono de la grille) et les suivis (chrono ou durée saisie).</p>';
};

/* ---------------- Cartes de l'accueil */
S.homeCards=(js,card,list)=>{
  const bil=[]; js.forEach(j=>{ const d=IO.bilanDu(j); if(d) bil.push({j,d}); }); bil.sort((a,b)=>a.d.date.localeCompare(b.d.date));
  if(bil.length) card("Bilans à prévoir",bil.length,list(bil,x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.j.nom)+'</b><span class="faint">'+esc(REF.modeleLabel(x.d.modele))+' · vers le '+esc(U.fmtDate(x.d.date))+(U.daysFrom(x.d.date)<0?' · <span class="warn-t">en retard</span>':'')+'</span></div>';
    const r=h("div",{class:"racts"}); const b=h("button",{type:"button",class:"btn"},"Faire le bilan"); b.addEventListener("click",()=>S.create(x.j,null,x.d.modele)); r.append(b,h("a",{class:"btn",href:"#/j/"+x.j.id},"Dossier")); li.appendChild(r); return li; },""));
  const rel=[]; js.filter(j=>j.statut!=="clos").forEach(j=>relances(j,3).forEach(c=>rel.push({j,c}))); rel.sort((a,b)=>a.c.relance.localeCompare(b.c.relance));
  if(rel.length) card("Candidatures à relancer",rel.length,list(rel.slice(0,12),x=>{ const li=h("li",{class:"row"}); li.innerHTML='<div class="rmain"><b>'+esc(x.c.entreprise)+(x.c.poste?" · "+esc(x.c.poste):"")+'</b><span class="faint">'+esc(x.j.nom)+' · relance le '+esc(U.fmtDate(x.c.relance))+'</span></div><div class="racts"><a class="btn" href="#/j/'+x.j.id+'/candidatures">Candidatures</a></div>'; return li; },""));
};
})();
