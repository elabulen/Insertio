  const tf=h("div",{class:"field"}); tf.appendChild(h("label",null,"Type de séance")); const coachBox=h("div");
  tf.appendChild(segc([{k:"suivi",t:"Accompagnement"},{k:"coaching",t:"Coaching"}],s.type||"suivi",v=>{ s.type=v; if(v==="coaching"&&!s.theme) s.theme=coachTheme(j,n); save(); renderTitle(); renderCoach(); }));
  card.appendChild(tf); card.appendChild(coachBox);
  function renderCoach(){ coachBox.innerHTML=""; if(s.type!=="coaching") return;
    field(coachBox,"Histoire et parcours du jeune",ta(j.coachHistoire,"En quelques mots : son parcours, sa situation, ce qui l'a amené·e ici…",v=>{ j.coachHistoire=v; save(); }),"Commun à toutes les séances de coaching de ce jeune.");
    const th=h("select",{class:"f","aria-label":"Thème du coaching"}); th.innerHTML=REF.COACHING.map(c=>'<option'+(c.t===(s.theme||coachTheme(j,n))?" selected":"")+'>'+esc(c.t)+'</option>').join(""); th.addEventListener("change",()=>{ s.theme=th.value; save(); renderTitle(); }); field(coachBox,"Thème",th);
    field(coachBox,"Exercices réalisés",ta(s.exercices,"Ex. respiration carrée, ancrage, visualisation ; simulation avec questions RH…",v=>{ s.exercices=v; save(); }));
    field(coachBox,"Ressenti du jeune",ta(s.ressenti,"Comment le jeune a vécu la séance, ce qui l'aide",v=>{ s.ressenti=v; save(); }));
    field(coachBox,"Recommandations pour la suite",ta(s.reco,"Ce que la coach conseille de travailler",v=>{ s.reco=v; save(); }));
    const moi=(IO.Team.me&&IO.Team.me.nom)||"", estEden=/eden|tulin/i.test(moi) || !(IO.Team.data&&IO.Team.data.membres&&IO.Team.data.membres.length);
    if(estEden){ const op=field(coachBox,"🔒 Observation personnelle (réservée à Eden)",ta(s.obsPerso,"Tes impressions personnelles, hypothèses, points de vigilance… Visible uniquement dans ton profil, jamais dans la fiche PDF ni dans les mails.",v=>{ s.obsPerso=v; save(); })); op.classList.add("obs-perso"); }
    else if(s.obsPerso) coachBox.appendChild(h("p",{class:"hint"},"🔒 Eden a noté une observation personnelle (visible seulement dans son profil).")); }
  renderCoach();
  // Résumé + dictée
  const rs=ta(s.resume,"Ce qui a été fait, ce que le jeune a dit, les avancées…",v=>{ s.resume=v; save(); });
  const rf=field(card,"Ce qui s'est passé",rs);
  const micRow=h("div",{class:"btn-row",style:"margin-top:10px;align-items:center"}); const interim=h("div",{class:"interim"}); rf.append(micRow,interim);
  // Transmissions + rappels
  const tr=ta(s.transmis,"Pour la personne qui fera la prochaine séance : où on en est, à quoi faire attention…",v=>{ s.transmis=v; save(); });
  field(card,"À transmettre pour la prochaine séance",tr);
  const rf2=h("div",{class:"field"}); rf2.appendChild(h("label",null,"Rappels pour la prochaine séance")); const rl=h("ul",{class:"rlist"}); rf2.appendChild(rl);
  const add=h("div",{class:"inline-add"}); const ri=h("input",{class:"f",placeholder:"Ex. vérifier l'envoi de la candidature Migros","aria-label":"Nouveau rappel"}); const rb2=h("button",{type:"button",class:"btn"},"Ajouter"); add.append(ri,rb2); rf2.appendChild(add); card.appendChild(rf2);
  const renderR=()=>{ rl.innerHTML=""; s.rappels.filter(r=>!r.deleted).forEach(r=>{ const li=h("li",{class:r.done?"done":""}); const cb=h("input",{type:"checkbox","aria-label":"Fait"}); cb.checked=!!r.done; cb.addEventListener("change",()=>{ r.done=cb.checked; save(); li.classList.toggle("done",r.done); }); const x=h("button",{type:"button","aria-label":"Retirer"},"×"); x.addEventListener("click",()=>{ r.deleted=true; save(); renderR(); }); li.append(cb,h("span",null,esc(r.t)),x); rl.appendChild(li); }); };
  const addR=t=>{ t=String(t||"").trim(); if(!t) return; s.rappels.push({id:U.uid("r"),t:t.charAt(0).toUpperCase()+t.slice(1),done:false}); save(); renderR(); };
  rb2.addEventListener("click",()=>{ addR(ri.value); ri.value=""; ri.focus(); }); ri.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addR(ri.value); ri.value=""; } });
  renderR();
  // Dictée
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    const mb=h("button",{type:"button",class:"btn mic"},"🎙 Dicter la séance"); micRow.appendChild(mb);
    micRow.appendChild(h("span",{class:"hint",style:"margin:0"},"Parle normalement. Commence une phrase par « rappel » pour créer un rappel."));
    let rec=null, on=false;
    const stop=()=>{ on=false; mb.classList.remove("on"); mb.textContent="🎙 Dicter la séance"; interim.textContent=""; try{ rec&&rec.stop(); }catch(e){} };
    mb.addEventListener("click",()=>{
      if(on){ stop(); return; }
      rec=new SR(); rec.lang="fr-FR"; rec.continuous=true; rec.interimResults=true;
      rec.onresult=ev=>{ let tmp=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const r=ev.results[i], t=r[0].transcript.trim(); if(!t) continue;
          if(r.isFinal){ if(RAPPEL_RE.test(t)){ addR(t.replace(RAPPEL_RE,"")); } else { const sent=t.charAt(0).toUpperCase()+t.slice(1)+(/[.!?]$/.test(t)?"":"."); s.resume=(s.resume?s.resume.replace(/\s*$/,"")+" ":"")+sent; rs.value=s.resume; save(); } }
          else tmp+=t+" "; }
        interim.textContent=tmp; };
      rec.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed") U.toast("Micro refusé : autorise le micro pour InsertiO dans Chrome (icône à gauche de l'adresse)",6000); else if(ev.error!=="no-speech") U.toast("Dictée interrompue ("+ev.error+")"); stop(); };
      rec.onend=()=>{ if(on){ try{ rec.start(); }catch(e){ stop(); } } };

    });

  } else micRow.appendChild(h("span",{class:"hint",style:"margin:0"},"Dictée : utilise Chrome, ou la touche Windows + H dans le champ."));
  // Message libre pour le jeune
  field(card,"Message pour le jeune (facultatif)",ta(s.pourJeune,"Une ou deux phrases reprises dans le mail : ce que vous avez fait ensemble, un encouragement…",v=>{ s.pourJeune=v; save(); }),"Les notes internes ci-dessus ne sont jamais envoyées au jeune.");

  const rd=h("div",{class:"field"}); rd.appendChild(h("label",null,"Prochain rendez-vous")); const rg=h("div",{class:"ctrl-row"});
  const r1=inp("date",s.rdv_date,v=>{ s.rdv_date=v; save(); },{"aria-label":"Date du prochain rendez-vous"}); const r2=inp("time",s.rdv_heure,v=>{ s.rdv_heure=v; save(); },{"aria-label":"Heure"}); if(!s.rdv_lieu) s.rdv_lieu=App.settings.lieu||""; const r3=inp("text",s.rdv_lieu,v=>{ s.rdv_lieu=v; save(); },{"aria-label":"Lieu"});
  if(!s.rdv_date&&n<N){ r1.placeholder=""; r1.title="Proposé : "+U.fmtDate(plannedDate(j,n+1)); }
  rg.append(r1,r2,r3); rd.appendChild(rg);
  if(!s.rdv_date&&n<N){ const sg=h("button",{type:"button",class:"btn",style:"margin-top:10px"},"Même jour dans une semaine ("+U.fmtDate(addDays(s.date||U.today(),7))+")"); sg.addEventListener("click",()=>{ s.rdv_date=addDays(s.date||U.today(),7); s.rdv_heure=s.rdv_heure||s.heure||""; r1.value=s.rdv_date; save(); sg.remove(); }); rd.appendChild(sg); }
  card.appendChild(rd);
  // Barre d'actions : 3 boutons
  const bar=h("div",{class:"actionbar"}); const bi=h("div",{class:"in"}); bar.appendChild(bi); main.appendChild(bar);
  const bSave=h("button",{type:"button",class:"btn primary"},"Enregistrer"); bi.appendChild(bSave);
  bSave.addEventListener("click",async()=>{ if(!s.presence){ s.presence="present"; } save(); await App.flushAll();
    try{ const blob=await IO.pdfBlob(IO.Fiche.seance(j,s)); const name=(s.type==="coaching"?"Coaching_"+coachIdx(j,n):"Seance_"+String(n).padStart(2,"0"))+"_"+(s.date||U.today())+".pdf"; await IO.Store.addFile(j.id,"Fiches",blob,name,true); U.toast("Séance enregistrée · fiche PDF rangée dans le dossier",4500); }
    catch(e){ U.toast("Séance enregistrée, mais la fiche PDF n'a pas pu être créée : "+(e.message||e),6000); }
    App.go("#/j/"+j.id); });

  bi.appendChild(bMail);

  return App.view;
};

/* ================================================================ Onglet Coaching (vue d'ensemble) */
IO.V6.coaching=main=>{
  const App=A(); if(App.banner(main)) return;
  main.appendChild(h("div",{class:"v-head"},'<div><h1>Coaching</h1><div class="meta">Les séances avec la coach emploi, pour tous les jeunes.</div></div>'));
  const js=App.sorted().map(ensure).filter(j=>["elan","tremplin"].includes(kind(j)));
  const up=[], done=[];
  js.forEach(j=>{ const N=maxN(j); for(let n=1;n<=N;n++){ if(typeOf(j,n)!=="coaching") continue; const s=getS(j,n); if(isDone(s)) done.push({j,n,s,d:s.date}); else if(j.statut!=="clos") up.push({j,n,d:plannedDate(j,n)}); } });
  const grid=h("div",{class:"coach-grid"}); main.appendChild(grid);

    items.forEach(x=>{ const li=h("li"); const a=h("a",{class:"sess"+(x.s?" faite":""),href:"#/j/"+x.j.id+"/seance/"+x.n}); a.innerHTML='<span class="num">'+coachIdx(x.j,x.n)+'</span><div><div class="t">'+esc(x.j.nom||"")+'</div><div class="s">'+esc(coachTheme(x.j,x.n))+' · '+esc(sub(x))+'</div></div><span class="go">›</span>'; li.appendChild(a); ul.appendChild(li); });
    grid.appendChild(c); };
  box("À venir",up.sort((a,b)=>a.d.localeCompare(b.d)),x=>"semaine du "+U.fmtDate(x.d));
  box("Réalisées",done.sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,30),x=>"le "+U.fmtDate(x.d)+(x.s.accomp?" avec "+x.s.accomp:""));
};

/* ================================================================ Statistiques */
const SORTIE_POS=["emploi","apprent","stage","formation"];
const baseCsv=IO.statsCsv;
IO.statsCsv=jeunes=>{
  const lines=baseCsv(jeunes).replace(/^﻿/,"").split("\r\n"); const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  lines[0]+=";"+["programme_type","seances_prevues","seances_realisees","seances_manquees","coaching_realises","passages_pole_numerique","parcours_termine","date_fin","sortie_positive"].map(q).join(";");
  jeunes.forEach((j,i)=>{ ensure(j); const ss=live(j.seances); lines[i+1]+=";"+[kind(j)||"",nbSeances(j)||"",ss.filter(s=>s.presence==="present"&&s.date).length,ss.filter(s=>s.presence==="absent"||s.presence==="excuse").length,ss.filter(s=>s.type==="coaching"&&s.presence==="present").length,live(j.passages).length,finished(j)?"oui":"",j.parcours.finReelle||"",finished(j)?(SORTIE_POS.includes(j.sortie)?"oui":"non"):""].map(q).join(";"); });
  return "﻿"+lines.join("\r\n");
};
const basePanel=IO.Suivi.statsPanel;
IO.Suivi.statsPanel=(box,jeunes)=>{
  const js=jeunes.map(ensure); const fin=js.filter(finished), pos=fin.filter(j=>SORTIE_POS.includes(j.sortie));
  const seances=js.reduce((a,j)=>a+doneCount(j),0), coach=js.reduce((a,j)=>a+live(j.seances).filter(s=>s.type==="coaching"&&s.presence==="present").length,0), pass=js.reduce((a,j)=>a+live(j.passages).length,0);
  const moy=fin.filter(j=>kind(j)!=="pole").length?Math.round(fin.filter(j=>kind(j)!=="pole").reduce((a,j)=>a+doneCount(j),0)/fin.filter(j=>kind(j)!=="pole").length*10)/10:"—";
  const k=(n,l)=>'<div class="kpi"><b>'+n+'</b><span>'+esc(l)+'</span></div>';
  box.appendChild(h("div",{class:"kpis",style:"margin-bottom:16px"},k(seances,"séances réalisées")+k(coach,"séances de coaching")+k(pass,"passages Pôle numérique")+k(fin.length,"parcours terminés")+k(pos.length+" / "+fin.length,"sorties en emploi, stage, apprentissage ou formation")+k(moy,"séances en moyenne par parcours terminé")));
  basePanel(box,jeunes);
};
